<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1, user-scalable=no">
<title>Writing Academy — S.S. Wordcraft</title>
<style>
  :root{
    --hull-dark:#101f27;
    --hull-panel:#17313d;
    --hull-panel-2:#1e3d4b;
    --rivet:#2c4a58;
    --brass:#c8963f;
    --brass-bright:#e3b567;
    --steam:#efe7d6;
    --steam-dim:#b9c4c8;
    --amber:#d9713c;
    --emerald:#57a373;
    --danger:#c1543c;
    --font-plate: Georgia, 'Iowan Old Style', 'Palatino Linotype', serif;
    --font-body: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
    --font-gauge: 'Courier New', Courier, monospace;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background-color:var(--hull-dark);
    background-image:
      radial-gradient(circle, rgba(200,150,63,0.35) 1.5px, transparent 1.6px),
      radial-gradient(1200px 800px at 50% -200px, #1c3b49 0%, var(--hull-dark) 60%);
    background-size:18px 18px, auto;
    color:var(--steam);
    font-family:var(--font-body);
    min-height:100vh;
    -webkit-tap-highlight-color:transparent;
    padding-bottom:40px;
  }
  header.topbar{
    position:sticky; top:0; z-index:20;
    background:linear-gradient(180deg, var(--hull-panel) 0%, rgba(23,49,61,0.92) 100%);
    border-bottom:2px solid var(--rivet);
    padding:14px 16px 12px;
    display:flex; align-items:center; gap:12px;
  }
  header.topbar .back{
    background:none;border:1px solid var(--rivet); color:var(--steam-dim);
    border-radius:8px; padding:8px 10px; font-size:15px; cursor:pointer;
  }
  header.topbar .back:disabled{opacity:0.35; cursor:default;}
  header.topbar .titles{flex:1; min-width:0;}
  header.topbar h1{
    font-family:var(--font-plate); font-size:17px; letter-spacing:0.02em;
    margin:0; color:var(--brass-bright);
    white-space:nowrap; overflow:hidden; text-overflow:ellipsis;
  }
  header.topbar .sub{font-size:12px; color:var(--steam-dim); margin-top:2px;}

  /* Boiler gauge — signature element */
  .gauge{
    width:52px;height:52px;border-radius:50%;
    background:conic-gradient(var(--brass) calc(var(--pct,0)*1%), var(--rivet) 0);
    display:flex;align-items:center;justify-content:center;
    flex-shrink:0;
    box-shadow: inset 0 0 0 2px var(--hull-dark), 0 0 0 2px var(--rivet);
  }
  .gauge .inner{
    width:38px;height:38px;border-radius:50%;
    background:var(--hull-panel-2);
    display:flex;align-items:center;justify-content:center;
    font-family:var(--font-gauge); font-size:11px; color:var(--brass-bright);
  }

  main{max-width:640px; margin:0 auto; padding:18px 16px 60px;}

  .hero{ text-align:center; padding:18px 10px 8px; }
  .hero .eyebrow{
    font-family:var(--font-gauge); letter-spacing:0.18em; font-size:11px;
    color:var(--brass); text-transform:uppercase;
  }
  .hero h2{ font-family:var(--font-plate); font-size:26px; margin:6px 0 4px; color:var(--steam); }
  .hero p{color:var(--steam-dim); font-size:14px; margin:0 auto; max-width:460px; line-height:1.5;}

  .big-gauge-wrap{display:flex;justify-content:center;margin:18px 0 8px;}
  .big-gauge{
    width:118px;height:118px;border-radius:50%;
    background:conic-gradient(var(--brass) calc(var(--pct,0)*1%), var(--rivet) 0);
    display:flex;align-items:center;justify-content:center;
    box-shadow: inset 0 0 0 4px var(--hull-dark), 0 0 0 3px var(--rivet), 0 8px 24px rgba(0,0,0,0.35);
  }
  .big-gauge .inner{
    width:88px;height:88px;border-radius:50%;
    background:radial-gradient(circle at 35% 30%, var(--hull-panel-2), var(--hull-panel));
    display:flex;flex-direction:column;align-items:center;justify-content:center;
  }
  .big-gauge .num{font-family:var(--font-gauge); font-size:24px; color:var(--brass-bright); font-weight:bold;}
  .big-gauge .lbl{font-size:9px; letter-spacing:0.1em; color:var(--steam-dim); text-transform:uppercase; margin-top:2px;}

  .rank-line{text-align:center; font-size:13px; color:var(--steam-dim); margin-bottom:22px;}
  .rank-line b{color:var(--brass-bright); font-family:var(--font-plate);}

  .section-label{
    font-family:var(--font-gauge); font-size:11px; letter-spacing:0.14em; color:var(--steam-dim);
    text-transform:uppercase; margin:22px 2px 10px;
  }

  .plan-map{display:flex; flex-direction:column; align-items:stretch; margin:6px 0 16px;}
  .plan-step-box{background:rgba(16,31,39,0.5); border:1px solid var(--rivet); border-radius:10px; padding:10px 12px;}
  .plan-step-label{font-family:var(--font-gauge); font-size:10px; letter-spacing:0.08em; color:var(--brass); text-transform:uppercase; margin-bottom:4px;}
  .plan-step-text{font-size:13px; color:var(--steam); line-height:1.4;}
  .plan-arrow{text-align:center; color:var(--steam-dim); font-size:14px; margin:2px 0;}
  .plan-cta{
    margin-top:6px; background:rgba(200,150,63,0.1); border:1px dashed var(--brass);
    border-radius:12px; padding:14px; text-align:center;
  }
  .plan-cta p{font-size:13px; color:var(--steam-dim); margin:0 0 10px;}
  details.plan-peek{
    background:rgba(16,31,39,0.4); border:1px solid var(--rivet); border-radius:10px;
    padding:10px 12px; margin-bottom:14px;
  }
  details.plan-peek summary{
    font-family:var(--font-gauge); font-size:12px; color:var(--brass-bright); cursor:pointer;
    letter-spacing:0.04em;
  }
  details.plan-peek .plan-map{margin-top:10px; margin-bottom:2px;}

  .badge-shelf{display:flex; flex-wrap:wrap; gap:14px; justify-content:center; margin:6px 0 26px;}
  .badge-item{width:76px; text-align:center;}
  .badge-icon{
    width:54px; height:54px; border-radius:50%; display:flex; align-items:center; justify-content:center;
    font-size:24px; margin:0 auto 6px; background:var(--hull-panel-2); border:2px solid var(--rivet);
  }
  .badge-item.earned .badge-icon{
    border-color:var(--brass-bright);
    background:linear-gradient(180deg, rgba(227,181,103,0.28), rgba(227,181,103,0.08));
    box-shadow:0 0 10px rgba(227,181,103,0.35);
  }
  .badge-item.locked .badge-icon{opacity:0.35; filter:grayscale(1);}
  .badge-name{font-size:9.5px; color:var(--steam-dim); line-height:1.3;}
  .badge-item.earned .badge-name{color:var(--brass-bright);}

  .badge-unlock{
    display:flex; align-items:center; gap:12px; background:rgba(227,181,103,0.12); border:1px solid var(--brass);
    border-radius:12px; padding:12px 14px; margin:0 auto 16px; max-width:320px; text-align:left;
  }
  .badge-unlock-icon{font-size:32px;}
  .badge-unlock-title{font-family:var(--font-gauge); font-size:10px; letter-spacing:0.08em; color:var(--brass); text-transform:uppercase;}
  .badge-unlock-name{font-family:var(--font-plate); font-size:15px; color:var(--steam);}

  .verb-card{
    background:var(--hull-panel-2); border:1px solid var(--rivet); border-radius:12px;
    padding:14px 16px; margin-bottom:12px;
  }
  .verb-header{display:flex; align-items:center; gap:8px; margin-bottom:4px;}
  .verb-icon{font-size:20px;}
  .verb-word{font-family:var(--font-plate); font-size:17px; color:var(--brass-bright);}
  .verb-meaning{font-size:13px; color:var(--steam); margin-bottom:6px; line-height:1.4;}
  .verb-example{font-size:12.5px; color:var(--steam-dim); font-style:italic; line-height:1.4;}
  .verb-quiz{margin-top:12px; padding-top:12px; border-top:1px dashed var(--rivet);}
  .verb-quiz-q{
    font-family:var(--font-gauge); font-size:10.5px; letter-spacing:0.05em; color:var(--brass);
    text-transform:uppercase; margin-bottom:8px;
  }
  .verb-quiz .choice-btn{font-size:13px; padding:9px 12px; margin-bottom:7px;}
  .verb-quiz-feedback{margin-top:2px;}
  .verb-quiz-feedback .feedback{margin-top:8px; padding:9px 12px; font-size:12.5px;}

  .world-intro-card{
    background:linear-gradient(180deg, var(--hull-panel-2), var(--hull-panel));
    border:1px solid var(--rivet); border-radius:14px;
    padding:18px 16px; margin-bottom:20px;
  }
  .world-intro-heading{
    font-family:var(--font-plate); font-size:16px; color:var(--brass-bright); margin-bottom:8px;
  }
  .world-intro-body{
    font-size:13px; color:var(--steam-dim); line-height:1.5; margin:0 0 8px;
  }

  .mission-list{display:flex; flex-direction:column; gap:14px;}
  .mission-card{
    background:linear-gradient(180deg, var(--hull-panel-2), var(--hull-panel));
    border:1px solid var(--rivet); border-radius:14px;
    padding:16px; display:flex; align-items:center; gap:14px;
    cursor:pointer; transition:transform .15s ease, border-color .15s ease;
  }
  .mission-card:active{transform:scale(0.98);}
  .mission-card.locked{opacity:0.55; cursor:default;}
  .mission-card.construction{opacity:0.6; cursor:default; border-style:dashed;}
  .mission-card .icon{font-size:30px; width:46px; text-align:center;}
  .mission-card .body{flex:1; min-width:0;}
  .mission-card h3{font-family:var(--font-plate); font-size:16px; margin:0 0 3px; color:var(--steam);}
  .mission-card .worldsub{font-family:var(--font-gauge); font-size:10.5px; letter-spacing:0.08em; color:var(--brass); text-transform:uppercase; margin-bottom:4px;}
  .mission-card p.desc{font-size:12.5px; color:var(--steam-dim); margin:0 0 6px; line-height:1.4;}
  .progress-track{height:7px; border-radius:4px; background:var(--rivet); overflow:hidden;}
  .progress-fill{height:100%; background:linear-gradient(90deg, var(--brass), var(--brass-bright));}
  .mission-card .status{font-size:11px; color:var(--brass); font-family:var(--font-gauge); margin-top:5px;}
  .mission-card .status.construction-text{color:var(--steam-dim);}
  .lock-badge{font-size:20px;}

  /* LADDER PLAYER */
  .rung-track{display:flex; gap:5px; justify-content:center; margin:6px 0 20px;}
  .rung{
    width:24px;height:24px;border-radius:6px;
    display:flex;align-items:center;justify-content:center;
    font-family:var(--font-gauge); font-size:11px;
    background:var(--rivet); color:var(--steam-dim);
    border:1px solid var(--rivet);
  }
  .rung.done{background:var(--emerald); color:#0d2318; border-color:var(--emerald);}
  .rung.active{background:var(--brass); color:#2a1c04; border-color:var(--brass-bright); box-shadow:0 0 0 3px rgba(200,150,63,0.25);}

  .level-card{
    background:var(--hull-panel-2); border:1px solid var(--rivet); border-radius:16px;
    padding:20px 18px; margin-bottom:16px;
  }
  .level-kicker{font-family:var(--font-gauge); font-size:11px; letter-spacing:0.12em; color:var(--brass); text-transform:uppercase; margin-bottom:6px;}
  .level-title{font-family:var(--font-plate); font-size:19px; color:var(--steam); margin:0 0 12px; line-height:1.35;}
  .scenario{
    background:rgba(16,31,39,0.55); border-left:3px solid var(--brass);
    padding:10px 12px; border-radius:0 8px 8px 0; font-size:14px; color:var(--steam-dim);
    margin-bottom:14px; line-height:1.5;
  }
  .scenario code{font-family:var(--font-gauge); color:var(--brass-bright);}

  .choice-btn{
    display:block; width:100%; text-align:left;
    background:var(--hull-panel); border:1px solid var(--rivet); color:var(--steam);
    border-radius:10px; padding:12px 14px; margin-bottom:9px; font-size:15px;
    cursor:pointer;
  }
  .choice-btn:active{transform:scale(0.99);}
  .choice-btn.correct{border-color:var(--emerald); background:rgba(87,163,115,0.18);}
  .choice-btn.wrong{border-color:var(--danger); background:rgba(193,84,60,0.18);}

  .word-bank{display:flex; flex-wrap:wrap; gap:8px; margin-bottom:14px; min-height:38px;}
  .word-chip{
    background:var(--hull-panel); border:1px solid var(--brass); color:var(--brass-bright);
    padding:8px 12px; border-radius:8px; font-size:14px; cursor:pointer;
  }
  .build-slot{
    min-height:52px; background:rgba(16,31,39,0.5); border:1px dashed var(--rivet);
    border-radius:10px; padding:8px; display:flex; flex-wrap:wrap; gap:8px; align-items:center;
    margin-bottom:12px;
  }
  .build-slot .word-chip{background:var(--brass); color:#2a1c04; border-color:var(--brass-bright);}
  .build-slot .placeholder{color:var(--steam-dim); font-size:13px; padding:6px;}

  input[type=text], textarea{
    width:100%; background:rgba(16,31,39,0.55); border:1px solid var(--rivet); color:var(--steam);
    border-radius:10px; padding:12px; font-size:15px; font-family:var(--font-body);
    margin-bottom:10px; resize:vertical;
  }
  textarea{min-height:90px; line-height:1.5;}
  input[type=text]:focus, textarea:focus{outline:2px solid var(--brass); border-color:var(--brass);}

  .framework{margin-bottom:12px;}
  .framework .step{margin-bottom:12px;}
  .framework .step label{
    display:block; font-family:var(--font-gauge); font-size:11px; letter-spacing:0.1em;
    color:var(--brass); text-transform:uppercase; margin-bottom:5px;
  }

  .btn-row{display:flex; gap:10px; margin-top:8px;}
  .btn{
    flex:1; padding:13px 14px; border-radius:10px; border:none; font-size:15px; cursor:pointer;
    font-family:var(--font-body); font-weight:600;
  }
  .btn.primary{background:linear-gradient(180deg, var(--brass-bright), var(--brass)); color:#241a05;}
  .btn.ghost{background:transparent; border:1px solid var(--rivet); color:var(--steam-dim);}
  .btn:disabled{opacity:0.4;}
  .btn:active{transform:scale(0.98);}

  .feedback{ margin-top:14px; padding:12px 14px; border-radius:10px; font-size:14px; line-height:1.5; }
  .feedback.good{background:rgba(87,163,115,0.15); border:1px solid var(--emerald); color:#cdeedb;}
  .feedback.info{background:rgba(200,150,63,0.13); border:1px solid var(--brass); color:var(--steam);}
  .feedback .model{
    margin-top:8px; padding-top:8px; border-top:1px dashed rgba(255,255,255,0.15);
    font-style:italic; color:var(--steam-dim);
  }

  .complete-screen{text-align:center; padding:30px 14px;}
  .complete-screen .badge{font-size:52px; margin-bottom:10px;}
  .complete-screen h2{font-family:var(--font-plate); color:var(--brass-bright); margin:0 0 8px;}
  .complete-screen p{color:var(--steam-dim); font-size:14px; margin-bottom:22px;}

  .diagram-box{
    background:rgba(16,31,39,0.4); border:1px dashed var(--rivet); border-radius:12px;
    padding:14px 10px 10px; margin-bottom:14px; text-align:center;
  }
  .diagram-caption{
    font-size:12px; color:var(--steam-dim); margin-top:8px; line-height:1.4; font-style:italic;
  }

  .fill-pills{display:flex; flex-wrap:wrap; gap:10px; margin-bottom:6px;}
  .fill-pill{
    background:var(--hull-panel); border:1px solid var(--brass); color:var(--brass-bright);
    padding:10px 18px; border-radius:24px; font-size:15px; cursor:pointer;
  }
  .fill-pill:active{transform:scale(0.97);}
  .fill-pill.correct{border-color:var(--emerald); background:rgba(87,163,115,0.18); color:#cdeedb;}
  .fill-pill.wrong{border-color:var(--danger); background:rgba(193,84,60,0.18); color:#f3c9c0;}

  .hint-zone{margin:2px 0 14px;}
  .hint-label{font-family:var(--font-gauge); font-size:11px; letter-spacing:0.08em; color:var(--steam-dim); text-transform:uppercase; margin-bottom:7px;}
  .hint-chips{display:flex; flex-wrap:wrap; gap:8px;}
  .hint-chip{
    background:rgba(200,150,63,0.14); border:1px solid var(--brass); color:var(--brass-bright);
    padding:8px 12px; border-radius:20px; font-size:13px; cursor:pointer; line-height:1.3;
  }
  .hint-chip:active{transform:scale(0.97);}

  .hidden{display:none !important;}
</style>
</head>
<body>

<header class="topbar">
  <button class="back" id="backBtn">← Map</button>
  <div class="titles">
    <h1 id="topTitle">Writing Academy</h1>
    <div class="sub" id="topSub">S.S. Wordcraft</div>
  </div>
  <div class="gauge"><div class="inner" id="topGaugeNum">0%</div></div>
</header>

<main id="app"></main>

<script>
(function(){
  const STORAGE_KEY = 'writing-academy-v1';

  // ---------- CONTENT: WORLDS ----------
  const WORLDS = [
    {
      id:'math-writer', icon:'⚙️', title:"Chief Engineer's Office", worldsub:'Math Writer',
      desc:'Explain your calculations so the Chief can follow your working.',
      status:'ready',
      missions:[
        {
          id:'boiler-pressure', icon:'🧮', title:'Boiler Pressure Calculation',
          desc:'Explain how you solved the equation, step by step.', equation:'3x + 5 = 20',
          levels:[
            { type:'choice', kicker:'Level 1 · Choose',
              title:'To solve 3x + 5 = 20, what should you do first?',
              scenario:'The pressure gauge reading gives the equation <code>3x + 5 = 20</code>. The Chief wants to know your first move.',
              options:['Divide both sides by 3','Subtract 5 from both sides','Add 5 to both sides','Multiply both sides by 3'],
              correct:1,
              feedback:'Right — you undo the +5 first by subtracting 5 from both sides.' },
            { type:'build', kicker:'Level 2 · Build',
              title:'Put the words in order to make a correct sentence.',
              scenario:'Build the sentence that describes the first step.',
              words:['Subtract','5','from','both','sides.'],
              target:'Subtract 5 from both sides.',
              feedback:'That\'s the sentence — clear and in the right order.' },
            { type:'complete', kicker:'Level 3 · Complete',
              title:'Fill in the missing number.',
              scenario:'Subtracting 5 from both sides of <code>3x + 5 = 20</code> gives:',
              prefix:'3x = ', accept:['15'], options:['10','15','20','25'],
              feedback:'Correct — 20 − 5 = 15, so 3x = 15.' },
            { type:'starter', kicker:'Level 4 · Sentence Starter',
              title:'Finish the sentence.',
              scenario:'Describe your first step using the starter below.',
              starter:'First, I ',
              hints:['subtracted 5 from both sides','divided both sides by 3'],
              minWords:3,
              feedback:'Good — that\'s a clear first step, written as a full sentence.' },
            { type:'twoSentence', kicker:'Level 5 · Two Sentences',
              title:'Explain how you solved 3x + 5 = 20.',
              scenario:'Write two sentences: one for your first step, one for your final answer.',
              hints:['First, I subtracted 5 from both sides.','Then, I divided both sides by 3.','Therefore, x = 5.'],
              minWords:10,
              model:'First, I subtracted 5 from both sides to get 3x = 15. Then, I divided both sides by 3, so x = 5.',
              feedback:'Nice work — you explained the method, not just the answer.' },
            { type:'structured', kicker:'Level 6 · Structured Paragraph',
              title:'Write the full explanation using the framework.',
              scenario:'Use First → Then → Therefore to explain the whole method for 3x + 5 = 20.',
              framework:[
                {label:'First…', placeholder:'e.g. First, I subtracted 5 from both sides.'},
                {label:'Then…', placeholder:'e.g. Then, I divided both sides by 3.'},
                {label:'Therefore…', placeholder:'e.g. Therefore, x = 5.'}
              ],
              model:'First, I subtracted 5 from both sides, which gave 3x = 15. Then, I divided both sides by 3. Therefore, x = 5.',
              feedback:'That\'s a complete, structured explanation — the Chief can follow every step.' },
            { type:'independent', kicker:'Level 7 · Independent',
              title:'Now explain a new one on your own: 4x − 7 = 21',
              scenario:'Try it yourself first. If you get stuck, a few starting points are there to help.',
              hints:['First, I added 7 to both sides.','Then, I divided both sides by 4.','Therefore, x = ...'],
              minWords:15,
              model:'First, I added 7 to both sides, which gave 4x = 28. Then, I divided both sides by 4. Therefore, x = 7.',
              feedback:'You explained a brand-new problem completely by yourself. That\'s independent engineering-report writing.' }
          ]
        },
        {
          id:'engineering-error', icon:'🔧', title:'Engineering Error',
          desc:'Find the junior engineer\'s mistake and explain it clearly.', equation:'2(x + 3) = 16',
          levels:[
            { type:'choice', kicker:'Level 1 · Choose',
              title:'A junior engineer solved 2(x + 3) = 16 like this: "2x + 3 = 16, so 2x = 13, x = 6.5." What went wrong?',
              scenario:'Look closely at the first line of working: <code>2(x + 3) = 16 → 2x + 3 = 16</code>.',
              options:['He forgot to distribute the 2 to the 3 as well','He added instead of subtracted','He divided incorrectly','There is no mistake'],
              correct:0,
              feedback:'Right — the 2 must multiply both x and 3, so it should be 2x + 6 = 16.' },
            { type:'build', kicker:'Level 2 · Build',
              title:'Put the words in order.',
              scenario:'Build the sentence that names the mistake.',
              words:['He','forgot','to','distribute','the','2','to','the','3.'],
              target:'He forgot to distribute the 2 to the 3.',
              feedback:'Exactly — naming the mistake precisely is the whole job here.' },
            { type:'complete', kicker:'Level 3 · Complete',
              title:'Fill in the missing number.',
              scenario:'The correct first step distributes the 2, giving:',
              prefix:'2x + ', suffix:' = 16', accept:['6'], options:['3','6','8','9'],
              feedback:'Correct — 2 × 3 = 6, so it\'s 2x + 6 = 16.' },
            { type:'starter', kicker:'Level 4 · Sentence Starter',
              title:'Finish the sentence.',
              scenario:'Name the mistake using the starter below.',
              starter:'The mistake is ',
              hints:['forgetting to distribute the 2 to the 3','not multiplying the 3 by 2'],
              minWords:3,
              feedback:'Good — clear and specific about what went wrong.' },
            { type:'twoSentence', kicker:'Level 5 · Two Sentences',
              title:'Explain the mistake and the fix.',
              scenario:'Write one sentence naming the mistake, and one sentence giving the correct first step.',

  function essayStructureSVG(highlight){

  function planSummaryHTML(question, answerText, reasonObj, counterObj, conclusionObj){
    const rows = [
      {label:'QUESTION', text:question},
      {label:'MY ANSWER', text:answerText},
      {label:'REASON', text:reasonObj.text + (reasonObj.example ? ' ('+reasonObj.example+')' : '')},
      {label:'COUNTERARGUMENT', text:counterObj.text},
      {label:'CONCLUSION', text:conclusionObj.text}
    ];
    let html = `<div class="plan-map">`;
    rows.forEach((r,i)=>{
      html += `<div class="plan-step-box"><div class="plan-step-label">${r.label}</div><div class="plan-step-text">${r.text}</div></div>`;
      if(i<rows.length-1) html += `<div class="plan-arrow">↓</div>`;
    });
    html += `</div>`;
    return html;
  }

  function loadState(){
    try{
      const raw = localStorage.getItem(STORAGE_KEY);
      if(raw) return JSON.parse(raw);
    }catch(e){}
    return { worlds:{} };
  }
  function saveState(){
    try{ localStorage.setItem(STORAGE_KEY, JSON.stringify(state)); }catch(e){}
  }
  let state = loadState();
  WORLDS.forEach(w=>{
    if(w.status!=='ready') return;
    if(!state.worlds[w.id]) state.worlds[w.id] = {};
    w.missions.forEach(m=>{
      if(!state.worlds[w.id][m.id]) state.worlds[w.id][m.id] = { levelIndex:0, done:false };
    });
    if(w.planning && !state.worlds[w.id].plan) state.worlds[w.id].plan = null;
  });

  function worldPct(world){
    if(world.status!=='ready') return 0;
    const totalLevels = world.missions.reduce((s,m)=>s+m.levels.length,0);
    const doneLevels = world.missions.reduce((s,m)=>s+Math.min(state.worlds[world.id][m.id].levelIndex, m.levels.length),0);
    return totalLevels ? Math.round((doneLevels/totalLevels)*100) : 0;
  }
  function overallPct(){
    const readyWorlds = WORLDS.filter(w=>w.status==='ready');
    if(!readyWorlds.length) return 0;
    const sum = readyWorlds.reduce((s,w)=>s+worldPct(w),0);
    return Math.round(sum/readyWorlds.length);
  }
  function rankLabel(pct){
    if(pct>=100) return 'Junior Engineer';
    if(pct>=50) return 'Engineering Cadet';
    return 'Deck Cadet';
  }

  function totalMissionsDone(){
    let n = 0;
    WORLDS.forEach(w=>{

      w.missions.forEach(m=>{ if(state.worlds[w.id][m.id].done) n++; });

  }

        {label:'Recommendation…', placeholder:'e.g. I recommend reducing speed to conserve fuel, or arranging a fuel stop.'}

      minWords:20,
      model:'The ship has used 4200 litres of fuel, leaving 800 litres remaining. The remaining six-hour leg would need 1680 litres at the current speed, which is 880 litres more than we have. I recommend reducing engine speed to conserve fuel, or arranging a fuel stop before the shortfall becomes critical.' }
  ];
  if(!state.bosses) state.bosses = {};
  BOSSES.forEach(b=>{ if(!state.bosses[b.id]) state.bosses[b.id] = { done:false }; });
  function bossUnlocked(b){ return b.unlock.every(wid=>worldPct(getWorld(wid))===100); }

  function updateTopbar(){
    if(view.screen==='worldmap'){
      document.querySelector('.gauge').style.setProperty('--pct', overallPct());

      topTitle.textContent = 'Writing Academy';
      topSub.textContent = 'S.S. Wordcraft';

    } else if(view.screen==='missions'){
      const w = getWorld(view.worldId);
      const pct = worldPct(w);
      document.querySelector('.gauge').style.setProperty('--pct', pct);
      topGaugeNum.textContent = pct+'%';
      topTitle.textContent = w.title;
      topSub.textContent = 'S.S. Wordcraft · '+w.worldsub;
      backBtn.disabled = false; backBtn.textContent = '← Map';
    } else if(view.screen==='planning'){
      const w = getWorld(view.worldId);
      const pct = worldPct(w);
      document.querySelector('.gauge').style.setProperty('--pct', pct);
      topGaugeNum.textContent = pct+'%';
      topTitle.textContent = 'Plan Your Essay';
      topSub.textContent = 'S.S. Wordcraft · '+w.worldsub;
      backBtn.disabled = false; backBtn.textContent = '← Missions';
    } else if(view.screen==='verbtrainer'){
      document.querySelector('.gauge').style.setProperty('--pct', overallPct());
      topGaugeNum.textContent = overallPct()+'%';
      topTitle.textContent = 'Command Word Glossary';
      topSub.textContent = 'S.S. Wordcraft';
      backBtn.disabled = false; backBtn.textContent = '← Map';
    } else if(view.screen==='bosslist'){
      document.querySelector('.gauge').style.setProperty('--pct', overallPct());
      topGaugeNum.textContent = overallPct()+'%';
      topTitle.textContent = 'Boss Battles';
      topSub.textContent = 'S.S. Wordcraft';
      backBtn.disabled = false; backBtn.textContent = '← Map';
    } else if(view.screen==='boss' || view.screen==='bossVictory'){
      const boss = BOSSES.find(b=>b.id===view.bossId);
      document.querySelector('.gauge').style.setProperty('--pct', overallPct());
      topGaugeNum.textContent = overallPct()+'%';
      topTitle.textContent = boss ? boss.title : 'Boss Battle';
      topSub.textContent = 'S.S. Wordcraft · Boss Battle';
      backBtn.disabled = false; backBtn.textContent = '← Boss Battles';
    } else {
      const w = getWorld(view.worldId);
      const pct = worldPct(w);
      document.querySelector('.gauge').style.setProperty('--pct', pct);
      topGaugeNum.textContent = pct+'%';
      const m = getMission(view.worldId, view.missionId);
      topTitle.textContent = m.title;
      topSub.textContent = 'Equation: '+m.equation;
      backBtn.disabled = false; backBtn.textContent = '← Missions';
    }
  }

  backBtn.addEventListener('click', ()=>{
    if(view.screen==='worldmap') return;
    if(view.screen==='missions'){ goWorldMap(); return; }
    if(view.screen==='verbtrainer'){ goWorldMap(); return; }
    if(view.screen==='bosslist'){ goWorldMap(); return; }
    if(view.screen==='boss' || view.screen==='bossVictory'){ openBossList(); return; }
    if(view.screen==='planning'){ view = { screen:'missions', worldId:view.worldId, missionId:null, levelIndex:0, buildOrder:[], buildBank:[] }; render(); return; }
    view = { screen:'missions', worldId:view.worldId, missionId:null, levelIndex:0, buildOrder:[], buildBank:[] };
    render();
  });

  function goWorldMap(){ view = { screen:'worldmap', worldId:null, missionId:null, levelIndex:0, buildOrder:[], buildBank:[] }; render(); }
  function openWorld(worldId){ view = { screen:'missions', worldId, missionId:null, levelIndex:0, buildOrder:[], buildBank:[] }; render(); }
  function openPlanning(worldId){ view = { screen:'planning', worldId, missionId:null, levelIndex:0, buildOrder:[], buildBank:[], planStep:0, planChoices:{} }; render(); }
  function openVerbTrainer(){ view = { screen:'verbtrainer', worldId:null, missionId:null, levelIndex:0, buildOrder:[], buildBank:[] }; render(); }
  function openBossList(){ view = { screen:'bosslist', worldId:null, missionId:null, levelIndex:0, buildOrder:[], buildBank:[] }; render(); }
  function openBoss(bossId){ view = { screen:'boss', bossId, bossStep:0, missionId:null, levelIndex:0, buildOrder:[], buildBank:[] }; render(); }
  function openMission(worldId, missionId){
    const m = getMission(worldId, missionId);
    const progress = state.worlds[worldId][missionId];
    view = { screen:'level', worldId, missionId, levelIndex: Math.min(progress.levelIndex, m.levels.length-1), buildOrder:[], buildBank:[] };
    render();
  }

  function nextLevel(){
    const m = getMission(view.worldId, view.missionId);
    const prog = state.worlds[view.worldId][view.missionId];
    if(prog.levelIndex < view.levelIndex+1) prog.levelIndex = view.levelIndex+1;
    saveState();
    if(view.levelIndex+1 >= m.levels.length){
      const badgesBefore = BADGES.filter(b=>b.check()).map(b=>b.id);
      prog.done = true; prog.levelIndex = m.levels.length;
      saveState();
      const badgesAfter = BADGES.filter(b=>b.check());
      view.newBadges = badgesAfter.filter(b=>!badgesBefore.includes(b.id));
      view.screen = 'complete';
      render();
    } else {
      view.levelIndex += 1;
      view.buildOrder = []; view.buildBank = [];
      render();
    }
  }

  // ---------- RENDER: MISSIONS (within a world) ----------
  function renderMissions(){
    const w = getWorld(view.worldId);
    let html = '';
    html += `<div class="hero">
      <div class="eyebrow">${w.worldsub}</div>
      <h2>${w.title}</h2>
      <p>${w.desc}</p>
    </div>`;
    if(w.intro){
      html += `<div class="world-intro-card">
        <div class="world-intro-heading">${w.intro.heading}</div>
        <p class="world-intro-body">${w.intro.body}</p>
        ${w.intro.diagrams.map(d=>DIAGRAMS[d]||'').join('')}
      </div>`;
    }
    if(w.planning){
      const savedPlan = state.worlds[w.id].plan;
      if(savedPlan){
        html += `<div class="world-intro-card">
          <div class="world-intro-heading">📋 Your Plan</div>
          <p class="world-intro-body">This is the plan you built. Use it while you write, or redo it if you've changed your mind.</p>
          ${planSummaryHTML(w.planning.question, savedPlan.answerText, savedPlan.reason, savedPlan.counter, savedPlan.conclusion)}
          <div class="btn-row"><button class="btn ghost" id="redoPlanBtn">Redo My Plan</button></div>
        </div>`;
      } else {
        html += `<div class="plan-cta">
          <p>Ready to plan your own essay? Choose your answer, reason, counterargument, and conclusion — then start writing.</p>
          <button class="btn primary" id="startPlanBtn" style="max-width:240px;margin:0 auto;">Build My Plan →</button>
        </div>`;
      }
    }
    html += `<div class="mission-list">`;
    w.missions.forEach((m,i)=>{
      const prog = state.worlds[w.id][m.id];
      const total = m.levels.length;
      const done = Math.min(prog.levelIndex, total);
      const missionPct = Math.round((done/total)*100);
      const prevDone = i===0 || state.worlds[w.id][w.missions[i-1].id].done;
      const locked = !prevDone && !prog.done && done===0;
      html += `<div class="mission-card ${locked?'locked':''}" data-mission="${m.id}">
        <div class="icon">${m.icon}</div>
        <div class="body">
          <h3>${m.title}</h3>
          <p class="desc">${m.desc}</p>
          <div class="progress-track"><div class="progress-fill" style="width:${missionPct}%"></div></div>
          <div class="status">${prog.done?'✓ COMPLETE':(locked?'LOCKED':(done+'/'+total+' LEVELS'))}</div>
        </div>
        ${locked?'<div class="lock-badge">🔒</div>':''}
      </div>`;
    });

    app.innerHTML = html;
    document.querySelectorAll('.mission-card[data-mission]').forEach(card=>{
      card.addEventListener('click', ()=>{
        if(card.classList.contains('locked')) return;
        openMission(w.id, card.dataset.mission);
      });

    if(document.getElementById('startPlanBtn')){
      document.getElementById('startPlanBtn').addEventListener('click', ()=>openPlanning(w.id));
    }
    if(document.getElementById('redoPlanBtn')){
      document.getElementById('redoPlanBtn').addEventListener('click', ()=>openPlanning(w.id));
    }
  }

  // ---------- RENDER: BOSS BATTLES ----------
  function renderBossList(){
    let html = '';
    html += `<div class="hero">
      <div class="eyebrow">Special Challenges</div>
      <h2>Boss Battles</h2>
      <p>No sentence starters, no scaffolding by default — these combine everything you've learned. Complete the linked worlds to unlock each one.</p>
    </div>`;
    html += `<div class="mission-list">`;
    BOSSES.forEach(b=>{
      const unlocked = bossUnlocked(b);
      const done = state.bosses[b.id].done;
      if(unlocked){
        html += `<div class="mission-card" data-boss="${b.id}">
          <div class="icon">${b.icon}</div>
          <div class="body">
            <h3>${b.title}</h3>
            <p class="desc">${b.type==='final' ? 'The ultimate multi-part challenge — calculate, decide, and report.' : b.prompt}</p>
            <div class="status">${done?'✓ DEFEATED':'⚔️ READY TO CHALLENGE'}</div>
          </div>
        </div>`;
      } else {
        html += `<div class="mission-card construction">
          <div class="icon">${b.icon}</div>
          <div class="body">
            <h3>${b.title}</h3>
            <p class="desc">Unlocks after completing: ${b.unlock.map(wid=>getWorld(wid).worldsub).join(', ')}</p>
            <div class="status construction-text">🔒 LOCKED</div>
          </div>
        </div>`;
      }
    });

    document.querySelectorAll('.mission-card[data-boss]').forEach(card=>{
      card.addEventListener('click', ()=>openBoss(card.dataset.boss));

  function renderBoss(){
    const boss = BOSSES.find(b=>b.id===view.bossId);
    if(boss.type==='final') renderBossFinal(boss);
    else renderBossSingle(boss);
  }

  function renderBossSingle(boss){
    let html = '';
    html += `<div class="level-card">`;
    html += `<div class="level-kicker">🔴 BOSS BATTLE</div>`;
    html += `<div class="level-title">${boss.prompt}</div>`;
    if(boss.diagram && DIAGRAMS[boss.diagram]) html += DIAGRAMS[boss.diagram];
    html += `<div class="scenario">${boss.scenario}</div>`;
    html += `<textarea id="freeInput" placeholder="Write your full answer here…"></textarea>`;
    html += renderHintChips(boss.hints, 'Truly stuck? Tap for a nudge:');
    html += `<div id="bossFeedback"></div>`;
    html += `<div class="btn-row" id="bossActionRow"><button class="btn primary" id="bossCheckBtn">Check my answer</button></div>`;
    html += `</div>`;
    app.innerHTML = html;
    wireHintChips(boss.hints);
    wireBossSingleCheck(boss);
  }

  function wireBossSingleCheck(boss){
    document.getElementById('bossCheckBtn').addEventListener('click', ()=>{
      const val = document.getElementById('freeInput').value;
      if(wordCount(val) >= boss.minWords){
        document.getElementById('bossFeedback').innerHTML = `<div class="feedback good">Boss defeated! <div class="model">Example answer: "${boss.model}"</div></div>`;
        document.getElementById('bossActionRow').innerHTML = `<button class="btn primary" id="bossClaimBtn">Claim Victory →</button>`;
        document.getElementById('bossClaimBtn').addEventListener('click', ()=>finishBoss(boss));
      } else {
        document.getElementById('bossFeedback').innerHTML = `<div class="feedback info">Add a bit more — try to include every part the prompt asks for.</div>`;
        document.getElementById('bossActionRow').innerHTML = `<button class="btn primary" id="bossCheckBtn">Check again</button>`;
        wireBossSingleCheck(boss);
      }
    });
  }

  function renderBossFinal(boss){
    const step = view.bossStep;
    let html = '';
    html += `<div class="rung-track">`;
    for(let i=0;i<boss.steps.length+1;i++){
      let cls='rung';
      if(i<step) cls+=' done'; else if(i===step) cls+=' active';
      html += `<div class="${cls}">${i+1}</div>`;
    }
    html += `</div>`;
    html += `<div class="level-card">`;
    html += `<div class="level-kicker">👑 FINAL BOSS</div>`;
    if(step===0) html += `<div class="scenario">${boss.scenario}</div>`;
    if(step < boss.steps.length){
      const s = boss.steps[step];
      html += `<div class="level-title">${s.question}</div>`;
      s.options.forEach((opt,i)=>{ html += `<button class="choice-btn" data-i="${i}">${opt}</button>`; });
      html += `<div id="bossFeedback"></div><div class="btn-row" id="bossActionRow"></div>`;
    } else {
      html += `<div class="level-title">Write your report to the Captain.</div>`;
      html += `<div class="framework">` + boss.writeFramework.map((f,i)=>`<div class="step"><label>${f.label}</label><textarea data-fi="${i}" placeholder="${f.placeholder}"></textarea></div>`).join('') + `</div>`;
      html += `<div id="bossFeedback"></div><div class="btn-row" id="bossActionRow"><button class="btn primary" id="bossCheckBtn">Check my report</button></div>`;
    }
    html += `</div>`;
    app.innerHTML = html;

    if(step < boss.steps.length){
      const s = boss.steps[step];
      document.querySelectorAll('.choice-btn').forEach(btn=>{
        btn.addEventListener('click', ()=>{
          const btns = document.querySelectorAll('.choice-btn');
          if(btns[0].dataset.locked) return;
          btns.forEach(x=>x.dataset.locked='1');
          const i = parseInt(btn.dataset.i,10);
          if(i===s.correct){ btn.classList.add('correct'); }
          else { btn.classList.add('wrong'); btns[s.correct].classList.add('correct'); }
          document.getElementById('bossActionRow').innerHTML = `<button class="btn primary" id="bossNextBtn">Next →</button>`;
          document.getElementById('bossNextBtn').addEventListener('click', ()=>{ view.bossStep++; render(); });
        });
      });
    } else {
      document.getElementById('bossCheckBtn').addEventListener('click', ()=>{
        const areas = document.querySelectorAll('[data-fi]');
        let allFilled = true, total = '';
        areas.forEach(a=>{ if(wordCount(a.value)<2) allFilled=false; total += ' '+a.value; });
        if(allFilled && wordCount(total) >= boss.minWords){
          document.getElementById('bossFeedback').innerHTML = `<div class="feedback good">Boss defeated! <div class="model">Example answer: "${boss.model}"</div></div>`;
          document.getElementById('bossActionRow').innerHTML = `<button class="btn primary" id="bossClaimBtn">Claim Victory →</button>`;
          document.getElementById('bossClaimBtn').addEventListener('click', ()=>finishBoss(boss));
        } else {
          document.getElementById('bossFeedback').innerHTML = `<div class="feedback info">Fill in each part with enough detail before submitting your report.</div>`;
        }
      });
    }
  }

  function finishBoss(boss){
    const badgesBefore = BADGES.filter(b=>b.check()).map(b=>b.id);
    state.bosses[boss.id].done = true;
    saveState();
    const badgesAfter = BADGES.filter(b=>b.check());
    view.newBadges = badgesAfter.filter(b=>!badgesBefore.includes(b.id));
    view.screen = 'bossVictory';
    render();
  }

  function renderBossVictory(){
    const boss = BOSSES.find(b=>b.id===view.bossId);
    let badgeHtml = '';
    if(view.newBadges && view.newBadges.length){
      badgeHtml = view.newBadges.map(b=>`<div class="badge-unlock">
        <div class="badge-unlock-icon">${b.icon}</div>
        <div><div class="badge-unlock-title">Badge Unlocked!</div><div class="badge-unlock-name">${b.name}</div></div>
      </div>`).join('');
    }
    app.innerHTML = `<div class="complete-screen">
      <div class="badge">${boss.icon}</div>
      <h2>Boss Defeated!</h2>
      <p><b>${boss.title}</b> is complete — no scaffolding, all you.</p>
      ${badgeHtml}
      <button class="btn primary" id="doneBtn" style="max-width:220px;margin:0 auto;">Back to Boss Battles</button>
    </div>`;
    document.getElementById('doneBtn').addEventListener('click', ()=>{ view.newBadges=null; openBossList(); });
  }

    html += `<div class="hero">
      <div class="eyebrow">Toolkit</div>
      <h2>Command Word Glossary</h2>

          <div class="verb-quiz-q">${v.quiz.question}</div>

        </div>

        if(groupBtns[0].dataset.locked) return;
        groupBtns.forEach(b=>b.dataset.locked='1');
        const oi = parseInt(btn.dataset.opt,10);
        const v = VERBS[vi];
        const feedback = document.getElementById('vqFeedback-'+vi);
        if(oi===v.quiz.correct){
          btn.classList.add('correct');
          feedback.innerHTML = `<div class="feedback good">Right — that\u2019s a real example of "${v.word}".</div>`;

          btn.classList.add('wrong');
          groupBtns[v.quiz.correct].classList.add('correct');
          feedback.innerHTML = `<div class="feedback info">Not quite — the highlighted sentence is the one that "${v.word}s".</div>`;
        }
      });

  // ---------- RENDER: PLANNING (interactive plan builder) ----------
  function renderPlanning(){
    const w = getWorld(view.worldId);
    const p = w.planning;
    const stepNames = ['answer','reason','counter','conclusion','summary'];
    const stepName = stepNames[view.planStep];
    let html = '';

    html += `<div class="rung-track">`;
    stepNames.slice(0,4).forEach((s,i)=>{
      let cls = 'rung';
      if(i<view.planStep) cls += ' done'; else if(i===view.planStep) cls += ' active';
      html += `<div class="${cls}">${i+1}</div>`;
    });
    html += `</div>`;

    html += `<div class="level-card">`;

    if(stepName==='answer'){
      html += `<div class="level-kicker">PLAN STEP 1 · YOUR ANSWER</div>`;
      html += `<div class="level-title">${p.question}</div>`;
      html += `<button class="choice-btn" data-answer="yes">Yes — ships should rely more on automation</button>`;
      html += `<button class="choice-btn" data-answer="no">No — human crews should remain primary</button>`;
    } else if(stepName==='reason'){
      const opts = p.reasons[view.planChoices.answer];
      html += `<div class="level-kicker">PLAN STEP 2 · YOUR REASON</div>`;
      html += `<div class="level-title">Pick your strongest reason.</div>`;
      opts.forEach((o,i)=>{
        html += `<button class="choice-btn" data-reason="${i}">${o.text}<br><span style="font-size:12px;color:var(--steam-dim);">${o.example}</span></button>`;
      });
    } else if(stepName==='counter'){
      const opts = p.counters[view.planChoices.answer];
      html += `<div class="level-kicker">PLAN STEP 3 · COUNTERARGUMENT</div>`;
      html += `<div class="level-title">Pick a counterargument to address.</div>`;
      opts.forEach((o,i)=>{ html += `<button class="choice-btn" data-counter="${i}">${o.text}</button>`; });
    } else if(stepName==='conclusion'){
      const opts = p.conclusions[view.planChoices.answer];
      html += `<div class="level-kicker">PLAN STEP 4 · CONCLUSION</div>`;
      html += `<div class="level-title">Pick your conclusion.</div>`;
      opts.forEach((o,i)=>{ html += `<button class="choice-btn" data-conclusion="${i}">${o.text}</button>`; });
    } else if(stepName==='summary'){
      const ans = view.planChoices;
      const answerText = ans.answer==='yes' ? 'Yes — ships should rely more on automation.' : 'No — human crews should remain primary.';
      const reasonObj = p.reasons[ans.answer][ans.reasonIdx];
      const counterObj = p.counters[ans.answer][ans.counterIdx];
      const conclusionObj = p.conclusions[ans.answer][ans.conclusionIdx];
      html += `<div class="level-kicker">YOUR PLAN IS READY</div>`;
      html += `<div class="level-title">Here's your essay plan.</div>`;
      html += planSummaryHTML(p.question, answerText, reasonObj, counterObj, conclusionObj);
      html += `<div class="btn-row"><button class="btn ghost" id="editPlanBtn">Change Answer</button><button class="btn primary" id="startWritingBtn">Start Writing →</button></div>`;
    }

    html += `</div>`;
    app.innerHTML = html;

    if(stepName==='answer'){
      document.querySelectorAll('[data-answer]').forEach(btn=>{
        btn.addEventListener('click', ()=>{
          view.planChoices.answer = btn.dataset.answer;
          view.planStep = 1;
          render();
        });
      });
    } else if(stepName==='reason'){
      document.querySelectorAll('[data-reason]').forEach(btn=>{
        btn.addEventListener('click', ()=>{
          view.planChoices.reasonIdx = parseInt(btn.dataset.reason,10);
          view.planStep = 2;
          render();
        });
      });
    } else if(stepName==='counter'){
      document.querySelectorAll('[data-counter]').forEach(btn=>{
        btn.addEventListener('click', ()=>{
          view.planChoices.counterIdx = parseInt(btn.dataset.counter,10);
          view.planStep = 3;
          render();
        });
      });
    } else if(stepName==='conclusion'){
      document.querySelectorAll('[data-conclusion]').forEach(btn=>{
        btn.addEventListener('click', ()=>{
          view.planChoices.conclusionIdx = parseInt(btn.dataset.conclusion,10);
          view.planStep = 4;
          render();
        });
      });
    } else if(stepName==='summary'){
      document.getElementById('editPlanBtn').addEventListener('click', ()=>{
        view.planStep = 0; view.planChoices = {};
        render();
      });
      document.getElementById('startWritingBtn').addEventListener('click', ()=>{
        const ans = view.planChoices;
        const answerText = ans.answer==='yes' ? 'Yes — ships should rely more on automation.' : 'No — human crews should remain primary.';
        state.worlds[w.id].plan = {
          answerText,
          reason: p.reasons[ans.answer][ans.reasonIdx],
          counter: p.counters[ans.answer][ans.counterIdx],
          conclusion: p.conclusions[ans.answer][ans.conclusionIdx]
        };
        saveState();
        openWorld(w.id);
      });
    }
  }

  // ---------- RENDER: LEVEL ----------
  function wordCount(str){ return (str.trim().match(/\S+/g)||[]).length; }

  function renderHintChips(hints, label){
    if(!hints || !hints.length) return '';
    let html = `<div class="hint-zone"><div class="hint-label">💡 ${label}</div><div class="hint-chips">`;
    hints.forEach((h,i)=>{ html += `<div class="hint-chip" data-hint="${i}">${h}</div>`; });
    html += `</div></div>`;
    return html;
  }
  function wireHintChips(hints){
    if(!hints || !hints.length) return;
    document.querySelectorAll('.hint-chip').forEach(chip=>{
      chip.addEventListener('click', ()=>{
        const input = document.getElementById('freeInput');
        if(!input) return;
        const text = hints[parseInt(chip.dataset.hint,10)];
        const current = input.value;
        const needsSpace = current.length>0 && !current.endsWith(' ') && !current.endsWith('\n');
        input.value = current + (needsSpace?' ':'') + text + ' ';
        input.focus();
        input.selectionStart = input.selectionEnd = input.value.length;
      });
    });
  }

  function renderLevel(){
    const m = getMission(view.worldId, view.missionId);
    const lvl = m.levels[view.levelIndex];
    let html = '';

    html += `<div class="rung-track">`;
    m.levels.forEach((l,i)=>{
      let cls = 'rung';
      if(i < view.levelIndex || state.worlds[view.worldId][view.missionId].done) cls += ' done';
      else if(i===view.levelIndex) cls += ' active';
      html += `<div class="${cls}">${i+1}</div>`;
    });
    html += `</div>`;

    const w = getWorld(view.worldId);
    const savedPlan = state.worlds[view.worldId].plan;
    if(w.planning && savedPlan){
      html += `<details class="plan-peek"><summary>📋 Peek at your plan</summary>${planSummaryHTML(w.planning.question, savedPlan.answerText, savedPlan.reason, savedPlan.counter, savedPlan.conclusion)}</details>`;
    }

    html += `<div class="level-card">`;
    html += `<div class="level-kicker">${lvl.kicker}</div>`;
    html += `<div class="level-title">${lvl.title}</div>`;
    if(m.diagram && DIAGRAMS[m.diagram]) html += DIAGRAMS[m.diagram];
    if(lvl.scenario) html += `<div class="scenario">${lvl.scenario}</div>`;

    if(lvl.type==='choice'){
      lvl.options.forEach((opt,i)=>{ html += `<button class="choice-btn" data-i="${i}">${opt}</button>`; });
    } else if(lvl.type==='build'){
      html += `<div class="build-slot" id="buildSlot"><span class="placeholder">Tap words below to build your sentence…</span></div>`;
      html += `<div class="word-bank" id="wordBank"></div>`;
      html += `<div class="btn-row"><button class="btn ghost" id="resetBuild">Reset</button></div>`;
    } else if(lvl.type==='complete'){
      html += `<div style="font-family:var(--font-gauge);font-size:16px;margin-bottom:14px;">${lvl.prefix||''}<span id="blankSpan" style="color:var(--brass-bright);border-bottom:2px dashed var(--brass);padding:0 6px;">____</span>${lvl.suffix||''}</div>`;
      html += `<div class="fill-pills" id="fillPills">`;
      lvl.options.forEach((opt,i)=>{ html += `<div class="fill-pill" data-i="${i}">${opt}</div>`; });
      html += `</div>`;
    } else if(lvl.type==='starter'){
      html += `<div style="font-size:15px;color:var(--brass-bright);margin-bottom:8px;font-family:var(--font-plate);">"${lvl.starter}___________"</div>`;
      html += `<textarea id="freeInput" placeholder="${lvl.starter}...">${lvl.starter}</textarea>`;
      html += renderHintChips(lvl.hints, 'Need an idea? Tap one:');
    } else if(lvl.type==='twoSentence' || lvl.type==='independent'){
      html += `<textarea id="freeInput" placeholder="Write your answer here…"></textarea>`;
      html += renderHintChips(lvl.hints, 'Need a starting point? Tap one to add it:');
    } else if(lvl.type==='structured'){
      html += `<div class="framework">`;
      lvl.framework.forEach((f,i)=>{
        html += `<div class="step"><label>${f.label}</label><textarea data-fi="${i}" placeholder="${f.placeholder}"></textarea></div>`;
      });
      html += `</div>`;
    }

    html += `<div id="feedbackZone"></div>`;
    html += `<div class="btn-row" id="actionRow">`;
    if(lvl.type==='choice' || lvl.type==='build' || lvl.type==='complete'){
      html += `<button class="btn primary" id="checkBtn" disabled>Check</button>`;
    } else {
      html += `<button class="btn primary" id="checkBtn">Check my answer</button>`;
    }
    html += `</div>`;
    html += `</div>`;

    app.innerHTML = html;
    wireLevelInteractions(lvl);
    wireHintChips(lvl.hints);
  }

  function wireLevelInteractions(lvl){
    const feedbackZone = document.getElementById('feedbackZone');
    const checkBtn = document.getElementById('checkBtn');

    function showFeedback(msg, model){
      let html = `<div class="feedback good">${msg}`;
      if(model) html += `<div class="model">Example answer: "${model}"</div>`;
      html += `</div>`;
      feedbackZone.innerHTML = html;
      document.getElementById('actionRow').innerHTML = `<button class="btn primary" id="nextBtn">Next →</button>`;
      document.getElementById('nextBtn').addEventListener('click', nextLevel);
    }

    if(lvl.type==='choice'){
      const btns = document.querySelectorAll('.choice-btn');
      btns.forEach(b=>{
        b.addEventListener('click', ()=>{
          if(b.dataset.locked) return;
          btns.forEach(x=>x.dataset.locked='1');
          const i = parseInt(b.dataset.i,10);
          if(i===lvl.correct){
            b.classList.add('correct');
            showFeedback(lvl.feedback);
          } else {
            b.classList.add('wrong');
            btns[lvl.correct].classList.add('correct');
            showFeedback(lvl.feedback);
          }
        });
      });
    }

    if(lvl.type==='build'){
      const bank = document.getElementById('wordBank');
      const slot = document.getElementById('buildSlot');
      let available = lvl.words.map((w,i)=>({w,i,used:false}));
      function renderBank(){
        bank.innerHTML='';
        available.forEach(item=>{
          if(item.used) return;
          const chip = document.createElement('div');
          chip.className='word-chip'; chip.textContent=item.w;
          chip.addEventListener('click', ()=>{
            item.used = true;
            view.buildOrder.push(item.w);
            renderSlot(); renderBank();
            checkBuildReady();
          });
          bank.appendChild(chip);
        });
      }
      function renderSlot(){
        if(view.buildOrder.length===0){
          slot.innerHTML = '<span class="placeholder">Tap words below to build your sentence…</span>';
          return;
        }
        slot.innerHTML='';
        view.buildOrder.forEach((w,idx)=>{
          const chip = document.createElement('div');
          chip.className='word-chip'; chip.textContent=w;
          chip.addEventListener('click', ()=>{
            view.buildOrder.splice(idx,1);
            const found = available.find(a=>a.w===w && a.used);
            if(found) found.used=false;
            renderSlot(); renderBank();
            checkBuildReady();
          });
          slot.appendChild(chip);
        });
      }
      function checkBuildReady(){
        checkBtn.disabled = view.buildOrder.length !== lvl.words.length;
      }
      document.getElementById('resetBuild').addEventListener('click', ()=>{
        view.buildOrder = [];
        available.forEach(a=>a.used=false);
        renderSlot(); renderBank(); checkBuildReady();
      });
      renderBank(); renderSlot();

      checkBtn.addEventListener('click', ()=>{
        const built = view.buildOrder.join(' ').replace(/\s+([.,])/g,'$1');
        if(built.trim().toLowerCase() === lvl.target.trim().toLowerCase()){
          showFeedback(lvl.feedback);
        } else {
          feedbackZone.innerHTML = `<div class="feedback info">Not quite the right order yet. The correct sentence is: <br><b>"${lvl.target}"</b> — tap Reset and try building it again, or continue when ready.</div>`;
          document.getElementById('actionRow').innerHTML = `<button class="btn ghost" id="retryBtn">Reset & try again</button><button class="btn primary" id="nextBtn">Continue →</button>`;
          document.getElementById('retryBtn').addEventListener('click', ()=>{ document.getElementById('resetBuild').click(); feedbackZone.innerHTML=''; renderLevelActionRow(); });
          document.getElementById('nextBtn').addEventListener('click', nextLevel);
        }
      });
    }

    if(lvl.type==='complete'){
      const pills = document.querySelectorAll('.fill-pill');
      const blankSpan = document.getElementById('blankSpan');
      pills.forEach(p=>{
        p.addEventListener('click', ()=>{
          if(p.dataset.locked) return;
          pills.forEach(x=>x.dataset.locked='1');
          const val = p.textContent.trim().toLowerCase();
          const isRight = lvl.accept.some(a=>a.toLowerCase()===val);
          const correctPill = Array.from(pills).find(x=>lvl.accept.some(a=>a.toLowerCase()===x.textContent.trim().toLowerCase()));
          if(isRight){
            p.classList.add('correct');
            if(blankSpan) blankSpan.textContent = p.textContent.trim();
            showFeedback(lvl.feedback);
          } else {
            p.classList.add('wrong');
            if(correctPill) correctPill.classList.add('correct');
            if(blankSpan) blankSpan.textContent = correctPill ? correctPill.textContent.trim() : lvl.accept[0];
            showFeedback(lvl.feedback);
          }
        });
      });
    }

    if(lvl.type==='starter'){
      checkBtn.addEventListener('click', ()=>{
        const val = document.getElementById('freeInput').value;
        const afterStarter = val.slice(lvl.starter.length);
        if(wordCount(afterStarter) >= lvl.minWords){
          showFeedback(lvl.feedback);
        } else {
          feedbackZone.innerHTML = `<div class="feedback info">Try adding a few more words after "${lvl.starter.trim()}" so it's a full sentence.</div>`;
          document.getElementById('actionRow').innerHTML = `<button class="btn primary" id="checkBtn">Check again</button>`;
          wireLevelInteractions(lvl);
        }
      });
    }

    if(lvl.type==='twoSentence' || lvl.type==='independent'){
      checkBtn.addEventListener('click', ()=>{
        const val = document.getElementById('freeInput').value;
        if(wordCount(val) >= lvl.minWords){
          showFeedback(lvl.feedback, lvl.model);
        } else {
          feedbackZone.innerHTML = `<div class="feedback info">Add a bit more detail — try to explain both the step and the result.</div>`;
          document.getElementById('actionRow').innerHTML = `<button class="btn primary" id="checkBtn">Check again</button>`;
          wireLevelInteractions(lvl);
        }
      });
    }

    if(lvl.type==='structured'){
      checkBtn.addEventListener('click', ()=>{
        const areas = document.querySelectorAll('[data-fi]');
        let allFilled = true;
        areas.forEach(a=>{ if(wordCount(a.value) < 2) allFilled = false; });
        if(allFilled){
          showFeedback(lvl.feedback, lvl.model);
        } else {
          feedbackZone.innerHTML = `<div class="feedback info">Fill in each part of the framework — even a short phrase is fine, just make sure every box has something.</div>`;
          document.getElementById('actionRow').innerHTML = `<button class="btn primary" id="checkBtn">Check again</button>`;
          wireLevelInteractions(lvl);
        }
      });
    }
  }

  function renderLevelActionRow(){
    const lvl = getMission(view.worldId, view.missionId).levels[view.levelIndex];
    document.getElementById('actionRow').innerHTML = (lvl.type==='choice'||lvl.type==='build')
      ? `<button class="btn primary" id="checkBtn" disabled>Check</button>`
      : `<button class="btn primary" id="checkBtn">Check my answer</button>`;
    wireLevelInteractions(lvl);
  }

  // ---------- RENDER: COMPLETE ----------
  function renderComplete(){
    const w = getWorld(view.worldId);
    const m = getMission(view.worldId, view.missionId);
    let badgeHtml = '';
    if(view.newBadges && view.newBadges.length){
      badgeHtml = view.newBadges.map(b=>`<div class="badge-unlock">
        <div class="badge-unlock-icon">${b.icon}</div>
        <div><div class="badge-unlock-title">Badge Unlocked!</div><div class="badge-unlock-name">${b.name}</div></div>
      </div>`).join('');
    }
    app.innerHTML = `<div class="complete-screen">
      <div class="badge">${m.icon}</div>
      <h2>Mission Complete</h2>
      <p>You explained your thinking from a multiple-choice hint all the way to a fully independent write-up. <b>${m.title}</b> is signed off.</p>
      ${badgeHtml}
      <button class="btn primary" id="doneBtn" style="max-width:220px;margin:0 auto;">Back to ${w.worldsub}</button>
    </div>`;
    document.getElementById('doneBtn').addEventListener('click', ()=>{ view.newBadges=null; openWorld(w.id); });
  }

  function render(){
    updateTopbar();
    if(view.screen==='worldmap') renderWorldMap();
    else if(view.screen==='missions') renderMissions();
    else if(view.screen==='verbtrainer') renderVerbTrainer();
    else if(view.screen==='bosslist') renderBossList();
    else if(view.screen==='boss') renderBoss();
    else if(view.screen==='bossVictory') renderBossVictory();
    else if(view.screen==='planning') renderPlanning();
    else if(view.screen==='level') renderLevel();
    else if(view.screen==='complete') renderComplete();
  }

  render();
})();
</script>
</body>
</html>
