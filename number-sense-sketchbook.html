1","cp1","bn1"]},{id:"ch2",num:2,name:"Mental Computation",emoji:"\u{1F9EE}",desc:"Solve it in your head",topics:["lr1","cs1","pt1","bt1","mf1","dh1","df1"]},{id:"ch3",num:3,name:"Multiplication Thinking",emoji:"\u2716\uFE0F",desc:"Multiply with confidence",topics:["ar1","am1","nlm1","gr1","sc1","rt1"]},{id:"ch4",num:4,name:"Division Thinking",emoji:"\u2797",desc:"Split fairly, group smartly",topics:["sh1","gp1","pq1","ff1","it1"]},{id:"ch5",num:5,name:"Estimation",emoji:"\u{1F3AF}",desc:"Get close, fast",topics:["fe1","rd1","cn1","rs1"]},{id:"ch6",num:6,name:"Fraction Sense",emoji:"\u{1F355}",desc:"See parts of a whole",topics:["fb1","fnl1","feq1","fcp1","fpc1"]},{id:"ch7",num:7,name:"Decimal Sense",emoji:"\u{1F51F}",desc:"Tenths, hundredths & beyond",topics:["dpv1","dnl1","dcp1","dp101"]},{id:"ch8",num:8,name:"Percent Sense",emoji:"\u{1F4AF}",desc:"Mental shortcuts for percents",topics:["pc10","pc51","pc257","pcmix"]},{id:"ch9",num:9,name:"Ratio Sense",emoji:"\u2696\uFE0F",desc:"Compare quantities that scale together",topics:["rsc1","rur1","rdl1","rtb1"]},{id:"ch10",num:10,name:"Patterns",emoji:"\u{1F501}",desc:"Spot the rule, predict what's next",topics:["rp1","grw1","iom1","tnr1","spp1"]},{id:"ch11",num:11,name:"Algebraic Thinking",emoji:"\u{1F4E6}",desc:"Unknowns, balance, and expressions",topics:["uk1","bal1","var1","ineq1","alg1"]},{id:"ch12",num:12,name:"Visual Strategies Capstone",emoji:"\u{1F3D7}\uFE0F",desc:"Bar models pulling every strategy together",topics:["bm1","bm2","bm3","capstone1"]}];var qc={nb1:{id:"nb1",chapter:"ch1",strategy:"Number Bonds",emoji:"\u{1F6A2}",blurb:"Two parts always fit together to make the whole \u2014 like two lifeboats holding all the passengers.",worked:{model:{type:"bondweb",whole:12,a:7,b:5,missing:null},note:"12 passengers boarded two lifeboats: 7 in Lifeboat A, 5 in Lifeboat B. 7 and 5 are the number bonds of 12 \u2014 the whole splits into exactly those two parts."},items:[{model:{type:"bondweb",whole:10,a:4,b:6,missing:"b"},solve:{prompt:"The crew sealed 10 rivets across two hull compartments. 4 rivets are in the bow section \u2014 how many are in the stern section?",accepted:["6"]}},{model:{type:"bondweb",whole:20,a:13,b:7,missing:"b"},solve:{prompt:"BOSS ROUND: 20 crates of coal must load into two bunkers. 13 fit in the forward bunker \u2014 how many go in the aft bunker to load all 20?",accepted:["7"]}}],generalRule:{statement:"SPEC SHEET: If you know the WHOLE and ONE PART, subtract to find the MISSING PART. whole \u2212 known part = missing part.",check:{prompt:"A ship has 15 portholes total. 9 are on the port side. Which finds the starboard count?",options:["15 + 9","15 \u2212 9","9 \u2212 15"],correctIndex:1,explain:"Whole \u2212 known part = missing part, so 15 \u2212 9 = 6 portholes on the starboard side."}},why:{text:"Number bonds work because addition and subtraction are opposite moves \u2014 one always undoes the other. If 7 + 5 = 12, then 12 \u2212 5 must bring you straight back to 7. Every bond is 3 numbers locked together like a rivet: pull one out, and the other two always show you the way back.",demo:{model:{type:"bondweb",whole:9,a:4,b:5,missing:null},caption:"Test it: 4 + 5 = 9, so 9 \u2212 4 = 5 and 9 \u2212 5 = 4. The rivet holds from every direction."}}},fn1:{id:"fn1",chapter:"ch1",strategy:"Friendly Numbers",emoji:"\u{1F344}",blurb:"Round numbers are easier to work with in your head \u2014 like rounding your coin count to the nearest flagpole.",worked:{model:{type:"choice",number:38,options:[30,40,50],correctIndex:1,unit:"ten"},note:"You collected 38 coins in World 1. The scoreboard rounds to the nearest flagpole \u2014 38 is closer to the 40-flag than the 30-flag."},items:[{model:{type:"choice",number:47,options:[40,50,60],correctIndex:1,unit:"ten"},solve:{prompt:"47 coins collected \u2014 which flagpole (40 or 50) is your score closest to?",accepted:["50"]}},{model:{type:"choice",number:213,options:[100,200,300],correctIndex:1,unit:"hundred"},solve:{prompt:"BOSS ROUND: 213 coins after the castle battle. Round to the nearest 100 for the leaderboard.",accepted:["200"]}}],generalRule:{statement:"SPEC SHEET: Check the digit right after the place you're rounding. 5 or more \u2192 round UP. Less than 5 \u2192 round DOWN, stay put.",check:{prompt:"You have 65 coins, rounding to the nearest ten. The ones digit is 5. What do you do?",options:["Round down to 60","Round up to 70","Stay at 65"],correctIndex:1,explain:"5 or more always rounds UP \u2014 65 rounds up to 70."}},why:{text:"A number line has two flagposts, and whichever one you're standing closer to is the fastest one to reach mentally. Rounding just measures which flagpost is nearer \u2014 you're not guessing, you're checking distances.",demo:{model:{type:"choice",number:82,options:[80,90],correctIndex:0,unit:"ten"},caption:"Test it: 82 is only 2 away from 80, but 8 away from 90 \u2014 80 wins easily."}}},cm1:{id:"cm1",chapter:"ch1",strategy:"Complement to 10, 100, 1000",emoji:"\u{1F9EA}",blurb:"What's missing to reach the next round target \u2014 like topping off a beaker to an exact volume.",worked:{model:{type:"jumpline",min:0,max:10,step:1,start:7,jumps:[{delta:3}]},note:"Your beaker holds 7 mL. The experiment needs exactly 10 mL. Add 3 mL more \u2014 7 and 3 are complements of 10."},items:[{model:{type:"jumpline",min:0,max:100,step:10,start:30,jumps:[{delta:70}]},solve:{prompt:"The flask holds 30 mL of solution. The recipe calls for 100 mL total. How many more mL do you add?",accepted:["70"]}},{model:{type:"jumpline",min:0,max:1e3,step:40,start:640,jumps:[{delta:360}]},solve:{prompt:"BOSS ROUND: The coolant tank holds 640 L. Full capacity is 1000 L. How many more litres to top it off completely?",accepted:["360"]}}],generalRule:{statement:"SPEC SHEET: To find what's missing to reach a round target, subtract: target \u2212 what you have = what's missing.",check:{prompt:"A tank has 450 L, full capacity is 1000 L. Which finds the missing amount?",options:["1000 \u2212 450","450 \u2212 1000","1000 + 450"],correctIndex:0,explain:"target \u2212 current amount = 1000 \u2212 450 = 550 L still needed."}},why:{text:"Reaching a round number is just subtraction wearing a disguise. If 7 + 3 = 10, then 10 \u2212 7 = 3 automatically \u2014 you're measuring the gap between where you are and the target line, and that gap is always the complement.",demo:{model:{type:"jumpline",min:0,max:30,step:6,start:24,jumps:[{delta:6}]},caption:"Test it: 24 mL needs 6 more to reach the 30 mL mark \u2014 same gap, different beaker."}}},nd1:{id:"nd1",chapter:"ch1",strategy:"Near Doubles",emoji:"\u{1F6A2}",blurb:"Close to a double? Double the small one, then adjust \u2014 like twin boilers just one rivet apart.",worked:{model:{type:"bondweb",mode:"neardouble",small:6,big:7,doubleVal:12,adjust:1,missing:null},note:"Boiler Room A has 6 rivets, twin Boiler Room B has 7. Since 7 is close to double 6, double 6 (12) then add 1 more: 13 rivets total."},items:[{model:{type:"bondweb",mode:"neardouble",small:8,big:9,doubleVal:16,adjust:1,missing:"sum"},solve:{prompt:"Two coal bunkers hold 8 and 9 tonnes. Use near doubles: what's the total?",accepted:["17"]}},{model:{type:"bondweb",mode:"neardouble",small:14,big:15,doubleVal:28,adjust:1,missing:"sum"},solve:{prompt:"BOSS ROUND: Twin funnels vent 15 and 14 tonnes of steam. Use near doubles: what's the total?",accepted:["29"]}}],generalRule:{statement:"SPEC SHEET: When two numbers are almost the same, double the SMALLER one, then add the extra bit that makes the bigger one bigger.",check:{prompt:"For 9 + 10, what's the near-doubles move?",options:["Double 9 (18), add 1 \u2192 19","Double 10 (20), add 1 \u2192 21","Double 9 (18), add 2 \u2192 20"],correctIndex:0,explain:"Double the smaller number (9 \u2192 18), then add the 1 extra that 10 carries: 18 + 1 = 19."}},why:{text:"Doubling is one of the easiest facts your brain already knows by heart. Since 7 is just 1 more than 6, adding 6 + 7 is exactly the same as 6 + 6 (instant recall) plus that extra 1. You're not learning a new fact \u2014 you're reusing one you already own.",demo:{model:{type:"bondweb",mode:"neardouble",small:11,big:12,doubleVal:22,adjust:1,missing:null},caption:"Test it: 11 + 12 = double 11 (22) + 1 = 23. Same trick, bigger rivets."}}},cp1:{id:"cp1",chapter:"ch1",strategy:"Compensation",emoji:"\u{1F9EA}",blurb:"Push one number up, pull the other down by the same amount \u2014 like pouring liquid between two beakers.",worked:{model:{type:"compensate",a:{start:47,delta:3},b:{start:38,delta:-3}},note:"Beaker A has 47 mL, Beaker B has 38 mL. Pour 3 mL from B into A: now A = 50 (friendly!) and B = 35. Total stays 85 mL \u2014 nothing was lost, just moved."},items:[{model:{type:"compensate",a:{start:29,delta:1},b:{start:56,delta:-1}},solve:{prompt:"Beaker A has 29 mL, Beaker B has 56 mL. Use compensation: what's the total?",accepted:["85"]}},{model:{type:"compensate",a:{start:68,delta:2},b:{start:24,delta:-2}},solve:{prompt:"BOSS ROUND: Flask A has 68 mL, Flask B has 24 mL. Use compensation: what's the total?",accepted:["92"]}}],generalRule:{statement:"SPEC SHEET: Add an amount to one number, subtract the SAME amount from the other. The total never changes \u2014 you're just moving weight between two sides of a balance.",check:{prompt:"38 + 25. If you add 2 to 38 to make 40, what must you do to 25?",options:["Also add 2","Subtract 2","Leave it alone"],correctIndex:1,explain:"To keep the total the same, whatever you add to one side must come off the other: 40 + 23 = 63, same as 38 + 25."}},why:{text:"Addition is like a two-pan balance scale. Whatever weight you shift from one side to the other, the TOTAL on the scale stays exactly the same \u2014 you've just rearranged it into an easier shape to lift.",demo:{model:{type:"compensate",a:{start:19,delta:1},b:{start:26,delta:-1}},caption:"Test it: 19 + 26 \u2192 20 + 25 = 45. Same total, friendlier numbers."}}},bn1:{id:"bn1",chapter:"ch1",strategy:"Benchmark Numbers",emoji:"\u{1F344}",blurb:"Compare a number to a friendly landmark to judge its size \u2014 like checking which checkpoint flag you're nearest.",worked:{model:{type:"choice",number:47,options:[0,50,100],correctIndex:1,unit:"benchmark"},note:"You're at coin-count 47. The checkpoints are 0, 50, and 100. 47 is way closer to the 50-checkpoint than either other flag."},items:[{model:{type:"choice",number:63,options:[50,100],correctIndex:0,unit:"benchmark"},solve:{prompt:"Coin count 63 \u2014 is it closer to the 50-flag or the 100-flag?",accepted:["50"]}},{model:{type:"choice",number:.42,options:[0,.5,1],correctIndex:1,unit:"benchmarkFrac"},solve:{prompt:"BOSS ROUND: Power meter reads 0.42 \u2014 is it closer to 0, 0.5, or 1?",accepted:["0.5",".5"]}}],generalRule:{statement:"SPEC SHEET: Pick the benchmark that's the SHORTEST distance away \u2014 measure the gap to each landmark and pick the smallest gap.",check:{prompt:"78 coins \u2014 is it closer to the 50-flag or the 100-flag?",options:["50-flag (gap 28)","100-flag (gap 22)"],correctIndex:1,explain:"78 to 100 is a gap of 22, but 78 to 50 is a gap of 28 \u2014 100 is the shorter reach."}},why:{text:"Your brain is much faster comparing a number to a handful of landmarks than tracking its exact distance from zero. It's the same trick pilots use with checkpoints on a long flight \u2014 you don't need the exact mileage, just which checkpoint you're nearest to.",demo:{model:{type:"choice",number:.83,options:[.5,1],correctIndex:1,unit:"benchmarkFrac"},caption:"Test it: 0.83 is only 0.17 from 1, but 0.33 from 0.5 \u2014 1 wins easily."}}},nw1:{id:"nw1",chapter:"ch1",strategy:"Number Webs",emoji:"\u{1F578}\uFE0F",blurb:"Every number has a whole web of partner pairs \u2014 like a ship's wiring diagram: one hub, many connections, all adding to the same total.",worked:{model:{type:"numweb",whole:10,pairs:[[1,9],[2,8],[3,7],[4,6],[5,5]]},note:"The boiler room has 10 valves. Every line through the hub is a pair: 3 open + 7 closed, 4 + 6, 5 + 5. One hub, five partner pairs. Spot the pattern: one side goes up, the other comes down."},items:[{model:{type:"numweb",whole:10,pairs:[[2,8],[3,null],[6,null],[9,1]]},solve:{prompt:"10 coins hide in a Mario pipe room. 6 are in the first pipe. How many are in the second pipe?",accepted:["4"]}},{model:{type:"numweb",whole:20,pairs:[[5,15],[8,null],[12,null],[17,3]]},solve:{prompt:"BOSS ROUND: 20 mL of acid must be split between two flasks. Flask A gets 12 mL. How many mL go in Flask B?",accepted:["8"]}}],generalRule:{statement:"SPEC SHEET: Every pair on a number web adds up to the SAME hub number. Know the hub and one partner? partner = hub \u2212 the part you know.",check:{prompt:"A web has the hub 12. One end of a pair is 5. What is the other end?",options:["17","7","60"],correctIndex:1,explain:"Hub \u2212 known part: 12 \u2212 5 = 7. Every pair on this web adds to 12."}},why:{text:"A web works because every line is a promise: both ends must add up to the hub. If the left end goes up by 1, the right end must go down by 1, or the total would change. Different pairs are just different ways to cut the same number.",demo:{model:{type:"numweb",whole:8,pairs:[[1,7],[2,6],[3,5],[4,4]]},caption:"Test it: left side 1 \u2192 2 \u2192 3 \u2192 4, right side 7 \u2192 6 \u2192 5 \u2192 4. Up 1, down 1 \u2014 the total stays 8."}}}};var Qc={lr1:{id:"lr1",chapter:"ch2",strategy:"Left-to-Right Addition",emoji:"\u{1F6A2}",blurb:"Add the biggest place first, then work your way down \u2014 like inspecting the biggest compartments first.",worked:{model:{type:"columnsum",numberA:234,numberB:152,columns:[{place:"hundreds",a:200,b:100,sum:300},{place:"tens",a:30,b:50,sum:80},{place:"ones",a:4,b:2,sum:6}],total:386},note:"Deck A carries 234 passengers, Deck B carries 152. Add hundreds first (300), then tens (80), then ones (6): 300 + 80 + 6 = 386."},items:[{model:{type:"columnsum",numberA:345,numberB:123,columns:[{place:"hundreds",a:300,b:100,sum:400},{place:"tens",a:40,b:20,sum:60},{place:"ones",a:5,b:3,sum:8}],total:468},solve:{prompt:"Cargo Hold A has 345 crates, Cargo Hold B has 123. Add left to right: what's the total?",accepted:["468"]}},{model:{type:"columnsum",numberA:456,numberB:231,columns:[{place:"hundreds",a:400,b:200,sum:600},{place:"tens",a:50,b:30,sum:80},{place:"ones",a:6,b:1,sum:7}],total:687},solve:{prompt:"BOSS ROUND: Coal Bunker A holds 456 tonnes, Bunker B holds 231. Add left to right: what's the total?",accepted:["687"]}}],generalRule:{statement:"SPEC SHEET: Add the BIGGEST place value first (hundreds, then tens, then ones), then combine the partial sums.",check:{prompt:"Adding 341 + 256 \u2014 which place do you add first?",options:["Ones","Tens","Hundreds"],correctIndex:2,explain:"Left-to-right means biggest place value first \u2014 hundreds, then tens, then ones."}},why:{text:"Place-value blocks never overlap \u2014 hundreds only ever combine with hundreds, tens with tens. You can total each block separately, in any order, then just add the partial totals together. It's like inspecting each watertight compartment on its own before adding up the ship's full headcount.",demo:{model:{type:"columnsum",numberA:214,numberB:163,columns:[{place:"hundreds",a:200,b:100,sum:300},{place:"tens",a:10,b:60,sum:70},{place:"ones",a:4,b:3,sum:7}],total:377},caption:"Test it: 300 + 70 + 7 = 377 \u2014 same trick, different decks."}}},cs1:{id:"cs1",chapter:"ch2",strategy:"Compensation (Subtracting)",emoji:"\u{1F9EA}",blurb:"Subtract a friendlier number, then fix the answer \u2014 like draining a flask and correcting the last drop.",worked:{model:{type:"compensate",op:"-",a:{start:62,delta:-20,label:"subtract 20"},fix:{delta:1}},note:"You need to drain 19 mL from a 62 mL flask. Draining 20 mL is easier (62 \u2212 20 = 42), but that's 1 mL too much \u2014 add 1 back: 42 + 1 = 43."},items:[{model:{type:"compensate",op:"-",a:{start:83,delta:-30,label:"subtract 30"},fix:{delta:1}},solve:{prompt:"Drain 29 mL from an 83 mL flask using compensation: what's left?",accepted:["54"]}},{model:{type:"compensate",op:"-",a:{start:145,delta:-60,label:"subtract 60"},fix:{delta:2}},solve:{prompt:"BOSS ROUND: Drain 58 L from a 145 L tank using compensation: what's left?",accepted:["87"]}}],generalRule:{statement:"SPEC SHEET: Subtract a friendlier, ROUNDER number first, then fix the answer by adding back the extra you took off.",check:{prompt:"62 \u2212 19. If you subtract 20 instead of 19, what must you do to fix the answer?",options:["Add 1 back","Subtract 1 more","Leave it alone"],correctIndex:0,explain:"You subtracted 1 mL too many (20 instead of 19), so add 1 back onto the result: 43."}},why:{text:"Taking away too much just means you need to give a little back. If you drain 20 mL but only meant to drain 19 mL, the flask has exactly 1 mL less than it should \u2014 so adding 1 back restores the precise amount.",demo:{model:{type:"compensate",op:"-",a:{start:74,delta:-30,label:"subtract 30"},fix:{delta:1}},caption:"Test it: 74 \u2212 30 = 44, but we only needed 74 \u2212 29, so add 1 back: 45."}}},pt1:{id:"pt1",chapter:"ch2",strategy:"Partitioning",emoji:"\u{1F344}",blurb:"Break both numbers into tens and ones, then combine \u2014 like sorting coins by size before counting.",worked:{model:{type:"columnsum",numberA:47,numberB:38,columns:[{place:"tens",a:40,b:30,sum:70},{place:"ones",a:7,b:8,sum:15}],total:85},note:"You collect 47 coins in one level, 38 in another. Split each into tens and ones: (40 + 30) + (7 + 8) = 70 + 15 = 85."},items:[{model:{type:"columnsum",numberA:56,numberB:27,columns:[{place:"tens",a:50,b:20,sum:70},{place:"ones",a:6,b:7,sum:13}],total:83},solve:{prompt:"Partition and add: 56 coins plus 27 coins?",accepted:["83"]}},{model:{type:"columnsum",numberA:89,numberB:46,columns:[{place:"tens",a:80,b:40,sum:120},{place:"ones",a:9,b:6,sum:15}],total:135},solve:{prompt:"BOSS ROUND: Partition and add: 89 coins plus 46 coins?",accepted:["135"]}}],generalRule:{statement:"SPEC SHEET: Break both numbers into tens and ones, add the tens together, add the ones together, then combine the two totals.",check:{prompt:"47 + 38 partitioned \u2014 which is the correct split-and-combine?",options:["(40+30) + (7+8)","(4+3) + (70+80)","(47+30) + (8)"],correctIndex:0,explain:"Split each number into tens and ones, add same-sized parts, then combine: 70 + 15 = 85."}},why:{text:"Addition doesn't care what order you group numbers in \u2014 you can add tens with tens and ones with ones separately, then combine the two totals at the end. Same total, just built in an easier order, like sorting coins by size before you count them.",demo:{model:{type:"columnsum",numberA:64,numberB:28,columns:[{place:"tens",a:60,b:20,sum:80},{place:"ones",a:4,b:8,sum:12}],total:92},caption:"Test it: 80 + 12 = 92 \u2014 same trick, different coin pile."}}},bt1:{id:"bt1",chapter:"ch2",strategy:"Bridging Through 10",emoji:"\u{1F6A2}",blurb:"Jump to the next ten first, then take the rest of the hop \u2014 like loading crates up to a full deck, then the overflow.",worked:{model:{type:"jumpline",min:0,max:20,step:1,start:8,jumps:[{delta:2},{delta:3}]},note:"Dock has 8 crates loaded, 5 more arrive. Bridge to 10 first (8 + 2 = 10), then load the rest (10 + 3 = 13). So 8 + 5 = 13."},items:[{model:{type:"jumpline",min:0,max:20,step:1,start:9,jumps:[{delta:1},{delta:5}]},solve:{prompt:"Bridge through 10: 9 crates plus 6 more?",accepted:["15"]}},{model:{type:"jumpline",min:40,max:60,step:1,start:47,jumps:[{delta:3},{delta:5}]},solve:{prompt:"BOSS ROUND: Bridge through the next ten: 47 crates plus 8 more?",accepted:["55"]}}],generalRule:{statement:"SPEC SHEET: Jump to the next friendly ten first, then take the rest of the hop from there.",check:{prompt:"9 + 6 \u2014 what's the bridge-through-10 move?",options:["9 + 1 = 10, then + 5 more = 15","9 + 6 = 15 straight away","9 + 10 = 19, then \u2212 4 = 15"],correctIndex:0,explain:"Bridge to 10 first (9 + 1), then add what's left of 6 (which is 5): 10 + 5 = 15."}},why:{text:"10 is the easiest number to add onto \u2014 your brain barely has to think about it. Splitting the second number into 'just enough to reach 10' plus 'the rest' turns a tricky jump into two easy hops.",demo:{model:{type:"jumpline",min:0,max:20,step:1,start:7,jumps:[{delta:3},{delta:2}]},caption:"Test it: 7 + 3 = 10, then + 2 = 12 \u2014 same trick, matches 7 + 5 = 12."}}},mf1:{id:"mf1",chapter:"ch2",strategy:"Making Friendly Numbers",emoji:"\u{1F9EA}",blurb:"Round one factor up, multiply, then subtract the extra \u2014 like prepping one spare test tube too many, then removing it.",worked:{model:{type:"chain",steps:[{label:"First, use the friendly number:",left:"25",op:"\xD7",right:"100",answer:"2500"},{label:"Now take away the extra:",left:"2500",op:"\u2212",right:"25",answer:"2475"}]},note:"You need 25 mL in each of 99 test tubes. Use the friendly 100 tubes first (25 \xD7 100 = 2500), then subtract the one extra tube's worth: 2500 \u2212 25 = 2475."},items:[{model:{type:"chain",steps:[{label:"First, use the friendly number:",left:"8",op:"\xD7",right:"20",answer:"160"},{label:"Now take away the extra:",left:"160",op:"\u2212",right:"8",answer:"152"}]},solve:{prompt:"Use friendly numbers: 8 mL in each of 19 tubes?",accepted:["152"]}},{model:{type:"chain",steps:[{label:"First, use the friendly number:",left:"12",op:"\xD7",right:"50",answer:"600"},{label:"Now take away the extra:",left:"600",op:"\u2212",right:"12",answer:"588"}]},solve:{prompt:"BOSS ROUND: Use friendly numbers: 12 mL in each of 49 tubes?",accepted:["588"]}}],generalRule:{statement:"SPEC SHEET: Round the tricky factor up to a friendly number, multiply, then subtract the extra copies you added.",check:{prompt:"8 \xD7 19 \u2014 using the friendly-number trick, what do you compute first?",options:["8 \xD7 20","8 \xD7 19 directly","8 \xD7 18"],correctIndex:0,explain:"Round 19 up to the friendly 20, multiply (8 \xD7 20 = 160), then subtract the 1 extra group of 8 you added: 160 \u2212 8 = 152."}},why:{text:"Multiplying by a round number like 20 or 100 is instant mental math, but 19 groups is exactly 1 fewer group than 20. So you compute the easy 'too many' answer first, then subtract exactly one extra group to correct it back down.",demo:{model:{type:"chain",steps:[{label:"First, use the friendly number:",left:"6",op:"\xD7",right:"20",answer:"120"},{label:"Now take away the extra:",left:"120",op:"\u2212",right:"6",answer:"114"}]},caption:"Test it: 6 \xD7 19 = (6 \xD7 20) \u2212 6 = 120 \u2212 6 = 114."}}},dh1:{id:"dh1",chapter:"ch2",strategy:"Doubling & Halving",emoji:"\u{1F344}",blurb:"Halve one factor, double the other \u2014 the answer stays the same, like rearranging blocks into an easier rectangle.",worked:{model:{type:"chain",steps:[{label:"Halve one, double the other:",left:"8",op:"\xD7",right:"10",answer:"80"}],preNote:"16 \xD7 5 \u2192 half 16 is 8, double 5 is 10."},note:"16 rows of 5 blocks. Halve the rows (8), double the blocks-per-row (10): 16 \xD7 5 = 8 \xD7 10 = 80."},items:[{model:{type:"chain",steps:[{label:"Halve one, double the other:",left:"7",op:"\xD7",right:"10",answer:"70"}],preNote:"14 \xD7 5 \u2192 half 14 is 7, double 5 is 10."},solve:{prompt:"Double and halve: 14 rows of 5 blocks?",accepted:["70"]}},{model:{type:"chain",steps:[{label:"Halve one, double the other:",left:"50",op:"\xD7",right:"8",answer:"400"}],preNote:"25 \xD7 16 \u2192 double 25 is 50, half 16 is 8."},solve:{prompt:"BOSS ROUND: Double and halve: 25 rows of 16 blocks?",accepted:["400"]}}],generalRule:{statement:"SPEC SHEET: Halve one factor, double the other \u2014 the product stays exactly the same.",check:{prompt:"For 18 \xD7 5, which halve-and-double move keeps the same answer?",options:["9 \xD7 10","18 \xD7 10","9 \xD7 5"],correctIndex:0,explain:"Halve 18 to 9, double 5 to 10: 9 \xD7 10 = 90, same as 18 \xD7 5 = 90."}},why:{text:"Multiplication is really just building a rectangle of blocks. If you make one side half as long and the other side twice as long, the rectangle covers the exact same total area \u2014 the shape changes, the total doesn't.",demo:{model:{type:"chain",steps:[{label:"Halve one, double the other:",left:"4",op:"\xD7",right:"10",answer:"40"}],preNote:"8 \xD7 5 \u2192 half 8 is 4, double 5 is 10."},caption:"Test it: 8 \xD7 5 = 4 \xD7 10 = 40 \u2014 same area, friendlier shape."}}},df1:{id:"df1",chapter:"ch2",strategy:"Difference Strategy",emoji:"\u{1F6A2}",blurb:"Count up from the smaller number to the bigger one \u2014 like measuring the distance between two knot-marks.",worked:{model:{type:"jumpline",min:20,max:65,step:1,start:28,jumps:[{delta:2},{delta:30},{delta:1}]},note:"The ship is at knot-mark 28 and needs to reach checkpoint 61. Count up in friendly jumps: 28 \u2192 30 (+2) \u2192 60 (+30) \u2192 61 (+1). Total distance: 33."},items:[{model:{type:"jumpline",min:15,max:55,step:1,start:19,jumps:[{delta:1},{delta:30},{delta:2}]},solve:{prompt:"Count up the difference: how far from knot-mark 19 to checkpoint 52?",accepted:["33"]}},{model:{type:"jumpline",min:40,max:85,step:1,start:47,jumps:[{delta:3},{delta:30},{delta:3}]},solve:{prompt:"BOSS ROUND: Count up the difference: how far from knot-mark 47 to checkpoint 83?",accepted:["36"]}}],generalRule:{statement:"SPEC SHEET: Count UP from the smaller number to the bigger number in friendly jumps \u2014 the total distance you travelled is the answer.",check:{prompt:"83 \u2212 47 \u2014 what's the counting-up move?",options:["Jump from 47 up to 83 in friendly hops, add up the jumps","Jump from 83 down to 47, multiply the jumps","Just subtract 8 from 3"],correctIndex:0,explain:"Counting up from 47 to 83 in easy hops and adding the jump sizes gives the difference: 36."}},why:{text:"Subtraction is really asking 'how far apart are these two numbers?' Instead of taking away, you measure the gap by walking from the smaller number to the bigger one in easy steps \u2014 the total distance you cover is the answer, every time.",demo:{model:{type:"jumpline",min:10,max:40,step:1,start:14,jumps:[{delta:1},{delta:20},{delta:2}]},caption:"Test it: from 14 to 37, jumps of 1 + 20 + 2 = 23 \u2014 matches 37 \u2212 14 exactly."}}}};var Gc={ar1:{id:"ar1",chapter:"ch3",strategy:"Arrays",emoji:"\u{1F6A2}",blurb:"Rows and columns show multiplication as a picture \u2014 like portholes lined up down the hull.",worked:{model:{type:"array",rows:4,cols:6,missing:"product"},note:"4 rows of 6 portholes down the hull make an array of 24 \u2014 that's 4 \xD7 6."},items:[{model:{type:"array",rows:5,cols:4,missing:"product"},solve:{prompt:"5 rows of 4 rivets \u2014 what's the total?",accepted:["20"]}},{model:{type:"array",rows:3,cols:7,missing:"product"},solve:{prompt:"BOSS ROUND: 3 rows of 7 deck lights \u2014 what's the total?",accepted:["21"]}}],generalRule:{statement:"SPEC SHEET: An array's ROWS \xD7 COLUMNS gives the total \u2014 no counting one by one needed.",check:{prompt:"An array has 6 rows and 4 columns. Which finds the total?",options:["6 + 4","6 \xD7 4","6 \xF7 4"],correctIndex:1,explain:"Rows \xD7 columns = total: 6 \xD7 4 = 24."}},why:{text:"Multiplication IS repeated equal rows \u2014 an array just makes that visible. Instead of counting every single porthole one at a time, you count how many are in one row, then how many rows there are, and multiply. Same total, found much faster.",demo:{model:{type:"array",rows:5,cols:3,missing:null},caption:"Test it: 5 rows of 3 = 15, counted in one multiplication instead of fifteen taps."}}},am1:{id:"am1",chapter:"ch3",strategy:"Area Model",emoji:"\u{1F9EA}",blurb:"Split a number apart, multiply each piece, then add \u2014 like dosing a test tube in two easy pours.",worked:{model:{type:"chain",areaParts:[80,12],steps:[{label:"Multiply the tens:",left:"20",op:"\xD7",right:"4",answer:"80"},{label:"Multiply the ones:",left:"3",op:"\xD7",right:"4",answer:"12"},{label:"Add the parts:",left:"80",op:"+",right:"12",answer:"92"}]},note:"23 mL goes into each of 4 test tubes. Split 23 into 20 + 3: (20 \xD7 4) + (3 \xD7 4) = 80 + 12 = 92 mL total."},items:[{model:{type:"chain",areaParts:[90,12],steps:[{label:"Multiply the tens:",left:"30",op:"\xD7",right:"3",answer:"90"},{label:"Multiply the ones:",left:"4",op:"\xD7",right:"3",answer:"12"},{label:"Add the parts:",left:"90",op:"+",right:"12",answer:"102"}]},solve:{prompt:"Use the area model: 34 mL in each of 3 tubes?",accepted:["102"]}},{model:{type:"chain",areaParts:[100,30],steps:[{label:"Multiply the tens:",left:"20",op:"\xD7",right:"5",answer:"100"},{label:"Multiply the ones:",left:"6",op:"\xD7",right:"5",answer:"30"},{label:"Add the parts:",left:"100",op:"+",right:"30",answer:"130"}]},solve:{prompt:"BOSS ROUND: Use the area model: 26 mL in each of 5 tubes?",accepted:["130"]}}],generalRule:{statement:"SPEC SHEET: Split one factor into tens and ones, multiply each part separately, then add the two results together.",check:{prompt:"23 \xD7 4 using the area model \u2014 which is the correct split?",options:["(20\xD74) + (3\xD74)","(2\xD74) + (3\xD74)","(20+4) \xD7 3"],correctIndex:0,explain:"Split 23 into 20 + 3, multiply each part by 4, then add: 80 + 12 = 92."}},why:{text:"Multiplication spreads evenly across addition \u2014 if a number is split into two parts, multiplying the whole thing is the same as multiplying each part separately and adding the results. It's like painting a wall in two sections: paint each section fully, and you've painted the whole wall.",demo:{model:{type:"chain",areaParts:[60,12],steps:[{label:"Multiply the tens:",left:"20",op:"\xD7",right:"3",answer:"60"},{label:"Multiply the ones:",left:"4",op:"\xD7",right:"3",answer:"12"},{label:"Add the parts:",left:"60",op:"+",right:"12",answer:"72"}]},caption:"Test it: 24 \xD7 3 = (20\xD73) + (4\xD73) = 60 + 12 = 72."}}},nlm1:{id:"nlm1",chapter:"ch3",strategy:"Number Line",emoji:"\u{1F344}",blurb:"Skip-count equal jumps to multiply \u2014 like collecting coins in identical hops.",worked:{model:{type:"jumpline",min:0,max:24,step:6,start:0,jumps:[{delta:6},{delta:6},{delta:6},{delta:6}]},note:"Four jumps of 6 coins: 6, 12, 18, 24. So 4 \xD7 6 = 24."},items:[{model:{type:"jumpline",min:0,max:15,step:5,start:0,jumps:[{delta:5},{delta:5},{delta:5}]},solve:{prompt:"Skip-count: 3 jumps of 5 coins?",accepted:["15"]}},{model:{type:"jumpline",min:0,max:20,step:4,start:0,jumps:[{delta:4},{delta:4},{delta:4},{delta:4},{delta:4}]},solve:{prompt:"BOSS ROUND: Skip-count: 5 jumps of 4 coins?",accepted:["20"]}}],generalRule:{statement:"SPEC SHEET: Skip-count in equal jumps \u2014 the number of jumps times the jump size gives the total.",check:{prompt:"Skip-counting 5, 10, 15, 20 \u2014 what multiplication does this show?",options:["4 \xD7 5","5 \xD7 5","4 + 5"],correctIndex:0,explain:"4 jumps of 5 = 4 \xD7 5 = 20."}},why:{text:"Multiplication is really just fast, equal-sized skip-counting. Instead of adding the same number over and over, one jump at a time, you count how big each jump is and how many jumps you took, and multiply straight to the answer.",demo:{model:{type:"jumpline",min:0,max:16,step:4,start:0,jumps:[{delta:4},{delta:4},{delta:4},{delta:4}]},caption:"Test it: 4 jumps of 4 = 16, same as 4 \xD7 4."}}},gr1:{id:"gr1",chapter:"ch3",strategy:"Groups",emoji:"\u{1F6A2}",blurb:"Equal groups added together make a multiplication fact \u2014 like passengers loaded evenly into lifeboats.",worked:{model:{type:"groups",groups:4,each:5},note:"4 lifeboats with 5 passengers each is the same as 4 \xD7 5 = 20."},items:[{model:{type:"groups",groups:6,each:3},solve:{prompt:"6 lifeboats with 3 passengers each \u2014 how many total?",accepted:["18"]}},{model:{type:"groups",groups:8,each:7},solve:{prompt:"BOSS ROUND: 8 lifeboats with 7 passengers each \u2014 how many total?",accepted:["56"]}}],generalRule:{statement:"SPEC SHEET: Equal groups added together = groups \xD7 amount-in-each-group.",check:{prompt:"6 lifeboats with 3 passengers each \u2014 which multiplication finds the total?",options:["6 \xD7 3","6 + 3","3 \xF7 6"],correctIndex:0,explain:"groups \xD7 each = 6 \xD7 3 = 18."}},why:{text:"Adding the same group over and over gets slow once there are lots of groups. Multiplication is a shortcut for exactly that repeated addition \u2014 count how many groups, count how many in each, and multiply once instead of adding six separate times.",demo:{model:{type:"groups",groups:5,each:4},caption:"Test it: 5 groups of 4 = 20, one multiplication instead of five additions."}}},sc1:{id:"sc1",chapter:"ch3",strategy:"Scaling",emoji:"\u{1F9EA}",blurb:"Make a quantity bigger by a scale factor \u2014 like scaling up a recipe for more test tubes.",worked:{model:{type:"scale",original:5,factor:3,scaled:15},note:"A 5 mL recipe scaled \xD73 becomes 15 mL."},items:[{model:{type:"scale",original:8,factor:2,scaled:16},solve:{prompt:"Scale 8 mL by \xD72. What do you get?",accepted:["16"]}},{model:{type:"scale",original:6,factor:4,scaled:24},solve:{prompt:"BOSS ROUND: Scale 6 mL by \xD74. What do you get?",accepted:["24"]}}],generalRule:{statement:"SPEC SHEET: To scale a quantity, multiply the original by the scale factor.",check:{prompt:"Scale 7 mL by \xD73 \u2014 which operation finds the answer?",options:["7 \xD7 3","7 + 3","7 \xF7 3"],correctIndex:0,explain:"original \xD7 factor = scaled amount: 7 \xD7 3 = 21."}},why:{text:"Scaling stretches a quantity by a set multiple, evenly across the whole thing \u2014 every part gets the same number of copies. That's exactly what multiplication measures: a scale factor of 3 means the amount now appears 3 times over.",demo:{model:{type:"scale",original:4,factor:5,scaled:20},caption:"Test it: 4 mL scaled \xD75 = 20 mL."}}},rt1:{id:"rt1",chapter:"ch3",strategy:"Ratio Thinking",emoji:"\u{1F6A2}",blurb:"Compare two amounts that grow together at a steady rate \u2014 like crates and the ropes that always match them.",worked:{model:{type:"chain",ratioVisual:{topVals:[4,12],bottomVals:[3,9],topLabel:"Crates",bottomLabel:"Ropes"},steps:[{label:"Find the scale factor:",left:"12",op:"\xF7",right:"4",answer:"3"},{label:"Scale the ropes:",left:"3",op:"\xD7",right:"3",answer:"9"}]},note:"4 crates need 3 ropes. 12 crates is 3\xD7 as many, so ropes scale \xD73 too: 3 \xD7 3 = 9."},items:[{model:{type:"chain",ratioVisual:{topVals:[2,6],bottomVals:[5,15],missingIndex:1,side:"bottom",topLabel:"Anchors",bottomLabel:"Lifebuoys"},steps:[{label:"Find the scale factor:",left:"6",op:"\xF7",right:"2",answer:"3"},{label:"Scale the lifebuoys:",left:"5",op:"\xD7",right:"3",answer:"15"}]},solve:{prompt:"2 anchors need 5 lifebuoys. With 6 anchors, how many lifebuoys?",accepted:["15"]}},{model:{type:"chain",ratioVisual:{topVals:[2,12],bottomVals:[3,18],missingIndex:1,side:"bottom",topLabel:"Masts",bottomLabel:"Flags"},steps:[{label:"Find the scale factor:",left:"12",op:"\xF7",right:"2",answer:"6"},{label:"Scale the flags:",left:"3",op:"\xD7",right:"6",answer:"18"}]},solve:{prompt:"BOSS ROUND: 2 masts need 3 flags. With 12 masts, how many flags?",accepted:["18"]}}],generalRule:{statement:"SPEC SHEET: Find how many times bigger one side grew, then scale the other side by that exact same factor.",check:{prompt:"4 crates need 3 ropes. If crates grow to 12 (\xD73), how do ropes scale?",options:["\xD73 too, so 9 ropes","+3, so 6 ropes","Stays at 3 ropes"],correctIndex:0,explain:"Both sides of a ratio scale by the same factor: ropes \xD7 3 = 9."}},why:{text:"A ratio is a fixed partnership \u2014 whatever multiple one side grows by, the other side must grow by exactly the same multiple to stay balanced. It's like a recipe where doubling the flour means doubling the sugar too, or the whole thing falls apart.",demo:{model:{type:"chain",ratioVisual:{topVals:[3,9],bottomVals:[2,6],topLabel:"Anchors",bottomLabel:"Chains"},steps:[{label:"Find the scale factor:",left:"9",op:"\xF7",right:"3",answer:"3"},{label:"Scale the chains:",left:"2",op:"\xD7",right:"3",answer:"6"}]},caption:"Test it: 3 anchors need 2 chains. 9 anchors (\xD73) need 6 chains (\xD73)."}}}};var Kc={sh1:{id:"sh1",chapter:"ch4",strategy:"Sharing",emoji:"\u{1F344}",blurb:"Split a total equally among a number of groups \u2014 like sharing out coins evenly between players.",worked:{model:{type:"array",rows:4,cols:5,missing:"cols"},note:"20 coins shared equally among 4 players gives 5 coins each."},items:[{model:{type:"array",rows:3,cols:6,missing:"cols"},solve:{prompt:"Share 18 coins equally among 3 players. How many each?",accepted:["6"]}},{model:{type:"array",rows:5,cols:4,missing:"cols"},solve:{prompt:"BOSS ROUND: Share 20 coins equally among 5 players. How many each?",accepted:["4"]}}],generalRule:{statement:"SPEC SHEET: Sharing equally means splitting the total into that many EQUAL groups \u2014 total \xF7 number of groups = amount in each.",check:{prompt:"20 coins shared among 4 players \u2014 which operation finds each player's share?",options:["20 \xF7 4","20 \xD7 4","20 \u2212 4"],correctIndex:0,explain:"total \xF7 groups = amount each: 20 \xF7 4 = 5."}},why:{text:"Division is multiplication's undo button. If 4 equal groups make 20 (4 \xD7 5 = 20), then splitting 20 back into 4 equal groups must return exactly 5 each \u2014 the two operations are mirror images of each other.",demo:{model:{type:"array",rows:4,cols:4,missing:null},caption:"Test it: 16 shared into 4 groups = 4 each, since 4 \xD7 4 = 16, so 16 \xF7 4 = 4."}}},gp1:{id:"gp1",chapter:"ch4",strategy:"Grouping",emoji:"\u{1F6A2}",blurb:"Find how many equal groups fit inside a total \u2014 like sorting crates into equal-sized loads.",worked:{model:{type:"jumpline",min:0,max:24,step:6,start:24,jumps:[{delta:-6},{delta:-6},{delta:-6},{delta:-6}]},note:"24 crates split into loads of 6: that's 4 jumps back to 0. 24 \xF7 6 = 4."},items:[{model:{type:"jumpline",min:0,max:15,step:5,start:15,jumps:[{delta:-5},{delta:-5},{delta:-5}]},solve:{prompt:"How many loads of 5 crates fit in 15?",accepted:["3"]}},{model:{type:"jumpline",min:0,max:28,step:7,start:28,jumps:[{delta:-7},{delta:-7},{delta:-7},{delta:-7}]},solve:{prompt:"BOSS ROUND: How many loads of 7 crates fit in 28?",accepted:["4"]}}],generalRule:{statement:"SPEC SHEET: Grouping asks 'how many equal-sized groups fit inside the total?' \u2014 repeatedly subtract the group size and count the jumps.",check:{prompt:"How many groups of 6 fit in 24?",options:["4 jumps of 6, so 4 groups","24 \xD7 6 = 144 groups","6 groups of 24"],correctIndex:0,explain:"24 \xF7 6 = 4 \u2014 you can subtract 6 four times before reaching 0."}},why:{text:"Grouping and sharing are two sides of the same coin \u2014 instead of splitting into a fixed NUMBER of groups, you're now asking how many groups of a fixed SIZE fit inside. Counting how many times you can subtract the group size before hitting zero is exactly what division measures.",demo:{model:{type:"jumpline",min:0,max:18,step:6,start:18,jumps:[{delta:-6},{delta:-6},{delta:-6}]},caption:"Test it: 18 split into loads of 6 takes 3 jumps back to 0, so 18 \xF7 6 = 3."}}},pq1:{id:"pq1",chapter:"ch4",strategy:"Partial Quotients",emoji:"\u{1F9EA}",blurb:"Chip away friendly chunks until nothing's left \u2014 like measuring out a solution in easy repeated pours.",worked:{model:{type:"chain",steps:[{label:"Take a friendly chunk:",left:"6",op:"\xD7",right:"10",answer:"60"},{label:"Subtract it:",left:"84",op:"\u2212",right:"60",answer:"24"},{label:"Take another chunk:",left:"6",op:"\xD7",right:"4",answer:"24"},{label:"Subtract it:",left:"24",op:"\u2212",right:"24",answer:"0"},{label:"Add up the chunks:",left:"10",op:"+",right:"4",answer:"14"}]},note:"84 mL split into 6 mL doses = 14, found in two friendly chunks: 10 doses, then 4 more."},items:[{model:{type:"chain",steps:[{label:"Take a friendly chunk:",left:"8",op:"\xD7",right:"10",answer:"80"},{label:"Subtract it:",left:"96",op:"\u2212",right:"80",answer:"16"},{label:"Take another chunk:",left:"8",op:"\xD7",right:"2",answer:"16"},{label:"Subtract it:",left:"16",op:"\u2212",right:"16",answer:"0"},{label:"Add up the chunks:",left:"10",op:"+",right:"2",answer:"12"}]},solve:{prompt:"Use partial quotients: 96 mL split into 8 mL doses?",accepted:["12"]}},{model:{type:"chain",steps:[{label:"Take a friendly chunk:",left:"11",op:"\xD7",right:"10",answer:"110"},{label:"Subtract it:",left:"132",op:"\u2212",right:"110",answer:"22"},{label:"Take another chunk:",left:"11",op:"\xD7",right:"2",answer:"22"},{label:"Subtract it:",left:"22",op:"\u2212",right:"22",answer:"0"},{label:"Add up the chunks:",left:"10",op:"+",right:"2",answer:"12"}]},solve:{prompt:"BOSS ROUND: Use partial quotients: 132 mL split into 11 mL doses?",accepted:["12"]}}],generalRule:{statement:"SPEC SHEET: Chip away friendly multiplication chunks from the total, track how many you removed, then add up the chunks \u2014 that sum is the answer.",check:{prompt:"84 \xF7 6, using partial quotients: after removing a chunk of 6 \xD7 10 = 60, what's left to work on?",options:["24","84","6"],correctIndex:0,explain:"84 \u2212 60 = 24, then keep chipping away chunks of 6 from what remains."}},why:{text:"Long division is scary, but partial quotients breaks it into friendly, repeatable moves: keep subtracting easy multiples of the divisor until nothing's left, then add up how many multiples you removed. Each chunk you peel off gets you closer, and there's no single 'trick step' to memorize \u2014 just the same simple move, repeated.",demo:{model:{type:"chain",steps:[{label:"Take a friendly chunk:",left:"9",op:"\xD7",right:"10",answer:"90"},{label:"Subtract it:",left:"108",op:"\u2212",right:"90",answer:"18"},{label:"Take another chunk:",left:"9",op:"\xD7",right:"2",answer:"18"},{label:"Subtract it:",left:"18",op:"\u2212",right:"18",answer:"0"},{label:"Add up the chunks:",left:"10",op:"+",right:"2",answer:"12"}]},caption:"Test it: 108 \xF7 9 = 12, found in chunks of 10 and 2."}}},ff1:{id:"ff1",chapter:"ch4",strategy:"Fact Families",emoji:"\u{1F6A2}",blurb:"Multiplication and division facts travel in families \u2014 like a crew that can be arranged four different ways.",worked:{model:{type:"factfamily",a:4,b:3,product:12,askFact:"div1"},note:"4 lifeboats \xD7 3 crew = 12, 3 \xD7 4 = 12, 12 \xF7 4 = 3, 12 \xF7 3 = 4 \u2014 one family, four facts."},items:[{model:{type:"factfamily",a:6,b:5,product:30,askFact:"mult2"},solve:{prompt:"What is 5 \xD7 6?",accepted:["30"]}},{model:{type:"factfamily",a:7,b:8,product:56,askFact:"div2"},solve:{prompt:"BOSS ROUND: What is 56 \xF7 8?",accepted:["7"]}}],generalRule:{statement:"SPEC SHEET: One multiplication fact unlocks 4 related facts \u2014 2 multiplications and 2 divisions, all built from the same 3 numbers.",check:{prompt:"If 6 \xD7 7 = 42, which is automatically also true?",options:["42 \xF7 7 = 6","42 \xF7 6 = 42","7 \xD7 6 = 13"],correctIndex:0,explain:"The same 3 numbers (6, 7, 42) form a fact family: 6\xD77=42, 7\xD76=42, 42\xF76=7, 42\xF77=6."}},why:{text:"A fact family works because multiplication and division describe the SAME relationship between 3 numbers, just viewed from different directions. Once you know how 3 numbers connect, you automatically know all 4 ways to write that connection \u2014 you're not learning 4 new facts, just 1 fact from 4 angles.",demo:{model:{type:"factfamily",a:5,b:6,product:30,askFact:"mult1"},caption:"Test it: 5, 6, and 30 connect four ways: 5\xD76=30, 6\xD75=30, 30\xF75=6, 30\xF76=5."}}},it1:{id:"it1",chapter:"ch4",strategy:"Inverse Thinking",emoji:"\u{1F344}",blurb:"Use multiplication backwards to solve division \u2014 like reversing a warp-pipe to see where you came from.",worked:{model:{type:"chain",steps:[{label:"Think: what times 4 makes 20?",left:"20",op:"\xF7",right:"4",answer:"5"}]},note:"Think 4 \xD7 ? = 20 \u2192 ? = 5. So 20 \xF7 4 = 5."},items:[{model:{type:"chain",steps:[{label:"Think: what times 6 makes 42?",left:"42",op:"\xF7",right:"6",answer:"7"}]},solve:{prompt:"What is 42 \xF7 6?",accepted:["7"]}},{model:{type:"chain",steps:[{label:"Think: what times 9 makes 63?",left:"63",op:"\xF7",right:"9",answer:"7"}]},solve:{prompt:"BOSS ROUND: What is 63 \xF7 9?",accepted:["7"]}}],generalRule:{statement:"SPEC SHEET: To solve a division, ask the multiplication question backwards: 'what number times the divisor gives the total?'",check:{prompt:"For 54 \xF7 6, what backwards question do you ask?",options:["What times 6 makes 54?","What times 54 makes 6?","54 plus what makes 6?"],correctIndex:0,explain:"Division is multiplication in reverse: 6 \xD7 ? = 54, so ? = 9."}},why:{text:"Division and multiplication are the same relationship viewed from opposite ends. Instead of a brand-new type of problem, you're just asking a multiplication fact you might already know, backwards \u2014 division stops being scary once you see it's really a multiplication puzzle in disguise.",demo:{model:{type:"chain",steps:[{label:"Think: what times 8 makes 40?",left:"40",op:"\xF7",right:"8",answer:"5"}]},caption:"Test it: 8 \xD7 5 = 40, so 40 \xF7 8 = 5 \u2014 same fact, opposite direction."}}}};var Yc={fe1:{id:"fe1",chapter:"ch5",strategy:"Front-End Estimation",emoji:"\u{1F6A2}",blurb:"Use only the leading digits for a quick estimate \u2014 like a fast passenger headcount before the exact tally.",worked:{model:{type:"chain",steps:[{label:"Keep just the leading digits:",left:"4000",op:"+",right:"3000",answer:"7000"}]},note:"Deck A has 4128 passengers, Deck B has 3872. Quick estimate: 4000 + 3000 \u2248 7000."},items:[{model:{type:"chain",steps:[{label:"Keep just the leading digits:",left:"5000",op:"+",right:"2000",answer:"7000"}]},solve:{prompt:"Estimate 5234 + 2711 passengers using front-end digits.",accepted:["7000"]}},{model:{type:"chain",steps:[{label:"Keep just the leading digits:",left:"6000",op:"+",right:"1000",answer:"7000"}]},solve:{prompt:"BOSS ROUND: Estimate 6489 + 1350 crates using front-end digits.",accepted:["7000"]}}],generalRule:{statement:"SPEC SHEET: Keep only the leading (biggest place-value) digit of each number, drop the rest, then combine those leading chunks for a fast ballpark estimate.",check:{prompt:"Estimate 3872 + 2145 using front-end digits \u2014 which is correct?",options:["3000 + 2000 = 5000","3872 + 2145 exactly","300 + 200 = 500"],correctIndex:0,explain:"Keep just the leading digits: 3000 + 2000 = 5000 is the front-end estimate."}},why:{text:"The leading digit carries almost all of a number's size \u2014 the smaller digits barely shift the total. Dropping them gives a fast, close-enough ballpark in seconds, which is exactly what an estimate is for: a quick sanity check, not a precise answer.",demo:{model:{type:"chain",steps:[{label:"Keep just the leading digits:",left:"7000",op:"+",right:"1000",answer:"8000"}]},caption:"Test it: 7128 + 1872 \u2248 7000 + 1000 = 8000 \u2014 a fast, close ballpark."}}},rd1:{id:"rd1",chapter:"ch5",strategy:"Rounding",emoji:"\u{1F344}",blurb:"Round to the nearest friendly number \u2014 like rounding your score for the leaderboard.",worked:{model:{type:"choice",number:67,options:[60,70,80],correctIndex:1,unit:"ten"},note:"67 coins rounds to 70 \u2014 the nearest ten."},items:[{model:{type:"choice",number:342,options:[300,400],correctIndex:0,unit:"hundred"},solve:{prompt:"Round 342 coins to the nearest hundred.",accepted:["300"]}},{model:{type:"choice",number:815,options:[800,900],correctIndex:0,unit:"hundred"},solve:{prompt:"BOSS ROUND: Round 815 coins to the nearest hundred.",accepted:["800"]}}],generalRule:{statement:"SPEC SHEET: Look at the digit right after the rounding place. 5 or more rounds UP, less than 5 rounds DOWN.",check:{prompt:"Round 67 to the nearest ten \u2014 the ones digit is 7.",options:["Round up to 70","Round down to 60","Stay at 67"],correctIndex:0,explain:"7 is 5 or more, so round UP: 70."}},why:{text:"A number line has landmarks on either side, and rounding just measures which landmark is closer. Checking the very next digit is a shortcut for measuring that distance without doing subtraction \u2014 5 or more means you're already past the halfway point toward the next landmark.",demo:{model:{type:"choice",number:458,options:[400,500],correctIndex:1,unit:"hundred"},caption:"Test it: 458 is closer to 500 than 400, since the tens digit (5) is already past halfway."}}},cn1:{id:"cn1",chapter:"ch5",strategy:"Compatible Numbers",emoji:"\u{1F9EA}",blurb:"Swap in nearby numbers that divide or combine easily \u2014 like rounding a solution volume to an easy divisor.",worked:{model:{type:"chain",steps:[{label:"Use compatible numbers:",left:"400",op:"\xF7",right:"20",answer:"20"}]},note:"398 mL split into 19 mL doses \u2248 400 \xF7 20 = 20 doses."},items:[{model:{type:"chain",steps:[{label:"Use compatible numbers:",left:"24",op:"\xF7",right:"4",answer:"6"}]},solve:{prompt:"Estimate 23 mL split into 4 mL doses using compatible numbers.",accepted:["6"]}},{model:{type:"chain",steps:[{label:"Use compatible numbers:",left:"56",op:"\xF7",right:"7",answer:"8"}]},solve:{prompt:"BOSS ROUND: Estimate 58 mL split into 7 mL doses using compatible numbers.",accepted:["8"]}}],generalRule:{statement:"SPEC SHEET: Swap the tricky numbers for nearby ones that divide evenly, then estimate with those instead.",check:{prompt:"Estimate 398 \xF7 19 with compatible numbers \u2014 which pair works best?",options:["400 \xF7 20","398 \xF7 19 exactly","400 \xF7 19"],correctIndex:0,explain:"400 and 20 are both close to the originals and divide evenly: 400 \xF7 20 = 20."}},why:{text:"Division estimates need FRIENDLY pairs, not just close ones \u2014 a pair that divides evenly gives an instant, clean estimate instead of a messy remainder. Swapping to the nearest 'nice pair' keeps the estimate fast and accurate enough.",demo:{model:{type:"chain",steps:[{label:"Use compatible numbers:",left:"81",op:"\xF7",right:"9",answer:"9"}]},caption:"Test it: 79 \xF7 9 \u2248 81 \xF7 9 = 9 \u2014 a friendly, evenly-dividing pair."}}},rs1:{id:"rs1",chapter:"ch5",strategy:"Reasonableness",emoji:"\u{1F6A2}",blurb:"Check if an answer makes sense before trusting it \u2014 a quality-control check on every calculation.",worked:{model:{type:"judgechoice",statement:"A ship holds 298 crates. After loading 51 more, someone says the total is 3490. Is that reasonable?",options:["Too low","About right","Too high"],correctIndex:2},note:"298 + 51 is close to 300 + 50 = 350 \u2014 3490 is way too high."},items:[{model:{type:"judgechoice",statement:"A crate holds 42 tins. Someone claims 6 crates hold about 250 tins. Is that reasonable?",options:["Too low","About right","Too high"],correctIndex:1},solve:{prompt:"Quickly estimate 6 crates of 42 tins (round 42 to 40).",accepted:["240","250"]}},{model:{type:"judgechoice",statement:"A voyage covers 19 nautical miles per hour. Someone claims 4 hours covers about 40 miles. Is that reasonable?",options:["Too low","About right","Too high"],correctIndex:0},solve:{prompt:"BOSS ROUND: Quickly estimate 4 hours at 19 nm/hour (round 19 to 20).",accepted:["80","76"]}}],generalRule:{statement:"SPEC SHEET: Before trusting an answer, do a quick mental estimate \u2014 if the real answer is way off from your estimate, something went wrong.",check:{prompt:"You estimate 6 \xD7 40 = 240, but your calculator shows 2400. What should you do?",options:["Trust the estimate and recheck the calculation","Trust 2400 \u2014 calculators are always right","Ignore both and guess"],correctIndex:0,explain:"A huge gap between 240 and 2400 signals an error, most likely a misplaced digit or decimal \u2014 recheck the calculation."}},why:{text:"Estimation acts as your reasonableness check because it catches errors that 'look right' on a calculator but are actually way off \u2014 like typing one extra zero. Comparing an exact answer to a quick ballpark estimate is the same instinct an engineer uses before trusting a measurement: does this number make sense for the situation?",demo:{model:{type:"judgechoice",statement:"A tank holds 52 L. Someone claims filling it 3 times gives about 1500 L.",options:["Too low","About right","Too high"],correctIndex:2},caption:"Test it: 52 \xD7 3 \u2248 50 \xD7 3 = 150, so 1500 is ten times too high \u2014 a red flag."}}}};var Xc={fb1:{id:"fb1",chapter:"ch6",strategy:"Benchmark Fractions",emoji:"\u{1F9EA}",blurb:"Compare a fraction to landmarks like 0, 1/2, and 1 \u2014 like checking a fill line against key marks on a flask.",worked:{model:{type:"choice",number:.875,numberLabel:"7/8",options:[0,.5,1],optionLabels:["0","1/2","1"],correctIndex:2,unit:"benchmarkFrac"},note:"A test tube filled to 7/8 is very close to completely full \u2014 much closer to 1 than to 1/2 or 0."},items:[{model:{type:"choice",number:.125,numberLabel:"1/8",options:[0,.5,1],optionLabels:["0","1/2","1"],correctIndex:0},solve:{prompt:"A flask is filled to 1/8 \u2014 is that closest to 0, 1/2, or 1?",accepted:["0"]}},{model:{type:"choice",number:.625,numberLabel:"5/8",options:[0,.5,1],optionLabels:["0","1/2","1"],correctIndex:1},solve:{prompt:"BOSS ROUND: A beaker is filled to 5/8 \u2014 is that closest to 0, 1/2, or 1?",accepted:["1/2","0.5",".5"]}}],generalRule:{statement:"SPEC SHEET: Compare the fraction's decimal value to the three landmarks 0, 1/2, and 1 \u2014 pick whichever landmark is the shortest distance away.",check:{prompt:"3/8 \u2014 which landmark is it closest to?",options:["0","1/2","1"],correctIndex:1,explain:"3/8 = 0.375, which is only 0.125 from 1/2 but 0.375 from 0 \u2014 1/2 is closer."}},why:{text:"A fraction's size can be measured just like a whole number's \u2014 check its distance to the three main landmarks (empty, half full, completely full) and pick the nearest one. This works because fractions are points on the very same number line whole numbers live on, just squeezed between 0 and 1.",demo:{model:{type:"choice",number:.3,numberLabel:"3/10",options:[0,.5,1],optionLabels:["0","1/2","1"],correctIndex:0},caption:"Test it: 3/10 = 0.3, much closer to 0 than to 1/2."}}},fnl1:{id:"fnl1",chapter:"ch6",strategy:"Number Line",emoji:"\u{1F6A2}",blurb:"Place a fraction at the correct spot by counting equal parts \u2014 like marking sections along a hull blueprint.",worked:{model:{type:"jumpline",fracDen:8,min:0,max:8,step:1,start:0,jumps:[{delta:5}]},note:"The engineer marks 5 equal sections along an 8-section hull blueprint: that lands on 5/8."},items:[{model:{type:"jumpline",fracDen:6,min:0,max:6,step:1,start:0,jumps:[{delta:4}]},solve:{prompt:"Mark 4 equal sections along a 6-section deck plan. What fraction is that?",accepted:["4/6","2/3"]}},{model:{type:"jumpline",fracDen:4,min:0,max:4,step:1,start:0,jumps:[{delta:3}]},solve:{prompt:"BOSS ROUND: Mark 3 equal sections along a 4-section funnel. What fraction is that?",accepted:["3/4"]}}],generalRule:{statement:"SPEC SHEET: Count how many equal parts the whole is split into (the denominator), then count how many parts you've moved (the numerator) \u2014 that's your position, numerator/denominator.",check:{prompt:"A number line is split into 5 equal parts, and you land on the 3rd mark. What fraction is that?",options:["3/5","5/3","3/3"],correctIndex:0,explain:"parts moved / total parts = 3/5."}},why:{text:"A fraction on a number line is a precise address \u2014 the denominator tells you how many equal steps fit in the whole, and the numerator tells you how many of those steps you've taken. It works because every equal part is exactly the same size, so counting them is as reliable as counting whole numbers.",demo:{model:{type:"jumpline",fracDen:5,min:0,max:5,step:1,start:0,jumps:[{delta:2}]},caption:"Test it: 2 steps out of 5 equal parts = 2/5."}}},feq1:{id:"feq1",chapter:"ch6",strategy:"Equivalent Fractions",emoji:"\u{1F344}",blurb:"Different-looking fractions can shade the exact same amount \u2014 like a half-full level bar split into more, smaller blocks.",worked:{model:{type:"fracequiv",a:1,b:2,d:4},note:"A level bar shaded 1/2 looks the same as one shaded 2/4 \u2014 they're equivalent."},items:[{model:{type:"fracequiv",a:2,b:3,d:6},solve:{prompt:"2/3 = ?/6. What's the missing numerator?",accepted:["4"]}},{model:{type:"fracequiv",a:3,b:4,d:8},solve:{prompt:"BOSS ROUND: 3/4 = ?/8. What's the missing numerator?",accepted:["6"]}}],generalRule:{statement:"SPEC SHEET: Multiply (or divide) BOTH the numerator and denominator by the same number \u2014 the fraction's value never changes.",check:{prompt:"1/3 = ?/9. What do you multiply the numerator by?",options:["\xD73, so 3/9","\xD79, so 9/9","+3, so 4/9"],correctIndex:0,explain:"9 \xF7 3 = 3, so multiply both top and bottom by 3: 1/3 = 3/9."}},why:{text:"Multiplying the top and bottom by the same number is really just multiplying by a disguised form of 1 (like 2/2 or 3/3), and multiplying by 1 never changes a value. You're re-cutting the same amount into smaller pieces \u2014 more pieces, same total shaded.",demo:{model:{type:"fracequiv",a:1,b:4,d:8},caption:"Test it: 1/4 and 2/8 shade the exact same amount \u2014 just cut into more pieces."}}},fcp1:{id:"fcp1",chapter:"ch6",strategy:"Comparing Fractions",emoji:"\u{1F6A2}",blurb:"Use the bar pictures to see which fraction covers more \u2014 like comparing how full two fuel tanks are.",worked:{model:{type:"fraccompare",a:{num:1,den:3},b:{num:1,den:2},correct:"b"},note:"Tank B is filled to 1/2, Tank A to 1/3. 1/2 covers more of the bar, so Tank B has more fuel."},items:[{model:{type:"fraccompare",a:{num:3,den:4},b:{num:5,den:8},correct:"a"},solve:{prompt:"Which fuel tank has more: 3/4 full or 5/8 full?",accepted:["3/4"]}},{model:{type:"fraccompare",a:{num:2,den:3},b:{num:3,den:5},correct:"a"},solve:{prompt:"BOSS ROUND: Which fuel tank has more: 2/3 full or 3/5 full?",accepted:["2/3"]}}],generalRule:{statement:"SPEC SHEET: To compare fractions, picture them as bars of the same length \u2014 whichever bar is shaded MORE is the bigger fraction.",check:{prompt:"Which is bigger: 2/5 or 3/5?",options:["3/5, because more parts are shaded out of the same 5","2/5, because 2 is a smaller number","They're equal"],correctIndex:0,explain:"Same denominator means same-size parts, so more shaded parts (3 vs 2) means the bigger fraction."}},why:{text:"A fraction always describes a piece of the SAME whole. Lining up two bars of identical length and shading each fraction lets you see directly which one covers more \u2014 no calculation needed, just a visual comparison.",demo:{model:{type:"fraccompare",a:{num:1,den:2},b:{num:2,den:5},correct:"a"},caption:"Test it: 1/2 covers more of the bar than 2/5 \u2014 you can see it directly."}}},fpc1:{id:"fpc1",chapter:"ch6",strategy:"Percent Connections",emoji:"\u{1F9EA}",decimalHint:!0,blurb:"Every fraction has a percent twin \u2014 like reading a solution's strength as a concentration percent.",worked:{model:{type:"chain",steps:[{label:"Divide to get a decimal:",left:"1",op:"\xF7",right:"4",answer:"0.25"},{label:"Multiply by 100 for percent:",left:"0.25",op:"\xD7",right:"100",answer:"25"}]},note:"A solution that's 1/4 concentrated = 0.25 = 25%."},items:[{model:{type:"chain",steps:[{label:"Divide to get a decimal:",left:"3",op:"\xF7",right:"4",answer:"0.75"},{label:"Multiply by 100 for percent:",left:"0.75",op:"\xD7",right:"100",answer:"75"}]},solve:{prompt:"What percent concentration is 3/4?",accepted:["75","75%"]}},{model:{type:"chain",steps:[{label:"Divide to get a decimal:",left:"1",op:"\xF7",right:"5",answer:"0.2"},{label:"Multiply by 100 for percent:",left:"0.2",op:"\xD7",right:"100",answer:"20"}]},solve:{prompt:"BOSS ROUND: What percent concentration is 1/5?",accepted:["20","20%"]}}],generalRule:{statement:"SPEC SHEET: Divide the numerator by the denominator to get a decimal, then multiply by 100 to get the percent.",check:{prompt:"Turn 2/5 into a percent \u2014 what's the first step?",options:["2 \xF7 5 = 0.4","5 \xF7 2 = 2.5","2 \xD7 5 = 10"],correctIndex:0,explain:"Divide numerator by denominator first: 2 \xF7 5 = 0.4, then \xD7 100 = 40%."}},why:{text:"A percent is just a fraction with a denominator of 100 in disguise. Dividing gives you the decimal 'address' of the fraction on the 0-to-1 line, and multiplying by 100 relabels that same address using hundredths instead \u2014 same amount, different units, like reading a ruler in cm instead of mm.",demo:{model:{type:"chain",steps:[{label:"Divide to get a decimal:",left:"3",op:"\xF7",right:"5",answer:"0.6"},{label:"Multiply by 100 for percent:",left:"0.6",op:"\xD7",right:"100",answer:"60"}]},caption:"Test it: 3/5 \u2192 0.6 \u2192 60%."}}}};var Zc={dpv1:{id:"dpv1",chapter:"ch7",strategy:"Place Value",emoji:"\u{1F9EA}",blurb:"Each digit after the decimal point has its own place \u2014 like reading a precise lab scale.",worked:{model:{type:"judgechoice",statement:"A lab scale reads 3.72 g. What place is the digit 7 in?",options:["Ones","Tenths","Hundredths"],correctIndex:1},note:"7 is right after the decimal point \u2014 that's the tenths place."},items:[{model:{type:"judgechoice",statement:"A scale reads 5.68 g. What place is the digit 8 in?",options:["Ones","Tenths","Hundredths"],correctIndex:2},solve:{prompt:"What is the value of the 8 in 5.68 g?",accepted:["0.08",".08"]}},{model:{type:"judgechoice",statement:"A beaker holds 12.4 mL. What place is the digit 4 in?",options:["Ones","Tenths","Hundredths"],correctIndex:1},solve:{prompt:"BOSS ROUND: What is the value of the 4 in 12.4 mL?",accepted:["0.4",".4"]}}],generalRule:{statement:"SPEC SHEET: Each place after the decimal point is 10\xD7 smaller than the one before it \u2014 tenths, then hundredths, then thousandths.",check:{prompt:"In 4.56, what place is the 6 in?",options:["Tenths","Hundredths","Ones"],correctIndex:1,explain:"The second digit after the decimal point is the hundredths place."}},why:{text:"Decimal places keep shrinking by a factor of 10 for the same reason whole-number places grow by a factor of 10 \u2014 the whole place-value system is built on repeated \xD710 steps, just running in the opposite direction past the decimal point. Once you know tenths are 10\xD7 smaller than ones, hundredths are just 10\xD7 smaller again.",demo:{model:{type:"judgechoice",statement:"In the number 7.29, what place is the digit 9 in?",options:["Ones","Tenths","Hundredths"],correctIndex:2},caption:"Test it: 9 is the second digit after the point \u2014 hundredths."}}},dnl1:{id:"dnl1",chapter:"ch7",strategy:"Decimal Number Line",emoji:"\u{1F344}",blurb:"Counting tenths and hundredths on a line makes decimals concrete \u2014 like reading a power gauge.",worked:{model:{type:"jumpline",decScale:10,min:0,max:10,step:1,start:0,jumps:[{delta:7}]},note:"The power gauge fills to 7 tenths from empty: that lands on 0.7."},items:[{model:{type:"jumpline",decScale:10,min:0,max:10,step:1,start:0,jumps:[{delta:4}]},solve:{prompt:"What decimal did the gauge land on?",accepted:["0.4",".4"]}},{model:{type:"jumpline",decScale:100,min:0,max:100,step:25,start:0,jumps:[{delta:25}]},solve:{prompt:"BOSS ROUND: What decimal did the gauge land on?",accepted:["0.25",".25"]}}],generalRule:{statement:"SPEC SHEET: Count the tenths (or hundredths) marks from 0 to find exactly where a decimal sits on the line.",check:{prompt:"A gauge line has marks at 0.1 intervals. Landing on the 6th mark means what decimal?",options:["0.6","6.0","0.06"],correctIndex:0,explain:"6 marks of 0.1 each = 0.6."}},why:{text:"A decimal number line works exactly like a whole-number line, just with smaller steps \u2014 instead of counting by 1s, you're counting by 0.1s or 0.01s. Landing on a mark is still just counting how many equal steps you've taken from zero.",demo:{model:{type:"jumpline",decScale:10,min:0,max:10,step:1,start:0,jumps:[{delta:3}]},caption:"Test it: 3 tenths from 0 lands on 0.3."}}},dcp1:{id:"dcp1",chapter:"ch7",strategy:"Comparing Decimals",emoji:"\u{1F6A2}",blurb:"Line up the place values to see which decimal is bigger \u2014 like comparing two fuel gauge readings.",worked:{model:{type:"judgechoice",statement:"Which fuel gauge reads more: 0.45 or 0.6?",options:["0.45","0.6"],correctIndex:1},note:"0.6 = 0.60, which is more than 0.45."},items:[{model:{type:"judgechoice",statement:"Which hull-thickness reading is bigger: 0.7 or 0.68?",options:["0.7","0.68"],correctIndex:0},solve:{prompt:"Type the bigger decimal.",accepted:["0.7",".7"]}},{model:{type:"judgechoice",statement:"Which depth reading is bigger: 1.2 or 1.09?",options:["1.2","1.09"],correctIndex:0},solve:{prompt:"BOSS ROUND: Type the bigger decimal.",accepted:["1.2"]}}],generalRule:{statement:"SPEC SHEET: Line up the decimal points, fill in missing places with zeros, then compare digit by digit from the left.",check:{prompt:"Compare 0.5 and 0.45 \u2014 which is bigger?",options:["0.5, since 0.5 = 0.50 and 50 > 45","0.45, since 45 > 5","They're equal"],correctIndex:0,explain:"Fill 0.5 as 0.50, then compare: 50 hundredths beats 45 hundredths."}},why:{text:"Comparing decimals goes wrong when people compare digit-COUNT instead of place-value \u2014 0.45 LOOKS bigger than 0.5 because it has more digits, but it isn't. Filling in the missing zero (0.50) lines up the same place values so you're comparing fairly: tenths to tenths, hundredths to hundredths.",demo:{model:{type:"judgechoice",statement:"Which is bigger: 0.8 or 0.75?",options:["0.8","0.75"],correctIndex:0},caption:"Test it: 0.8 = 0.80, and 80 hundredths beats 75 hundredths."}}},dp101:{id:"dp101",chapter:"ch7",strategy:"Multiplying by Powers of 10",emoji:"\u{1F9EA}",decimalHint:!0,blurb:"\xD710 shifts every digit one place to the left \u2014 like scaling up a recipe for a bigger batch.",worked:{model:{type:"chain",steps:[{label:"\xD710 shifts every digit one place left:",left:"3.4",op:"\xD7",right:"10",answer:"34"}]},note:"3.4 mL scaled \xD710 for a bigger batch = 34 mL."},items:[{model:{type:"chain",steps:[{label:"\xD710 shifts every digit one place left:",left:"2.7",op:"\xD7",right:"10",answer:"27"}]},solve:{prompt:"Scale 2.7 mL by \xD710. What do you get?",accepted:["27"]}},{model:{type:"chain",steps:[{label:"\xD7100 shifts every digit two places left:",left:"0.5",op:"\xD7",right:"100",answer:"50"}]},solve:{prompt:"BOSS ROUND: Scale 0.5 mL by \xD7100. What do you get?",accepted:["50"]}}],generalRule:{statement:"SPEC SHEET: \xD710 shifts every digit one place to the LEFT (bigger). \xD7100 shifts two places left. The decimal point looks like it 'moves' right, but really the digits are moving left.",check:{prompt:"What happens to 0.6 when you multiply by 10?",options:["Every digit shifts one place left: 6","Add a zero: 0.60","Nothing changes"],correctIndex:0,explain:"\xD710 shifts every digit one place left: 0.6 becomes 6."}},why:{text:"Multiplying by 10 makes every digit worth 10\xD7 more, and the only way a digit's VALUE can become 10\xD7 bigger without changing which digit it is, is for it to shift one whole place to the left \u2014 from hundredths to tenths, tenths to ones, and so on. The decimal point just marks where 'ones' is; the digits are what actually move.",demo:{model:{type:"chain",steps:[{label:"\xD710 shifts every digit one place left:",left:"1.2",op:"\xD7",right:"10",answer:"12"}]},caption:"Test it: 1.2 \xD7 10 = 12 \u2014 every digit shifts one place left."}}}};var Jc={pc10:{id:"pc10",chapter:"ch8",strategy:"Finding 10%",emoji:"\u{1F344}",decimalHint:!0,blurb:"Slide the decimal point one place left \u2014 like a toll booth taking a slice of your coin stash.",worked:{model:{type:"chain",percentGrid:{percent:10,why:"100% split into 10 equal strips. Each strip is 10% \u2014 that's why \xF710 works."},steps:[{label:"\xF710 for 10%:",left:"240",op:"\xF7",right:"10",answer:"24"}]},note:"You have 240 coins. The toll booth takes 10%: 24 coins."},items:[{model:{type:"chain",percentGrid:{percent:10,why:"100% split into 10 equal strips. Each strip is 10% \u2014 that's why \xF710 works."},steps:[{label:"\xF710 for 10%:",left:"350",op:"\xF7",right:"10",answer:"35"}]},solve:{prompt:"The toll booth takes 10% of your 350 coins. How many is that?",accepted:["35"]}},{model:{type:"chain",percentGrid:{percent:10,why:"100% split into 10 equal strips. Each strip is 10% \u2014 that's why \xF710 works."},steps:[{label:"\xF710 for 10%:",left:"86",op:"\xF7",right:"10",answer:"8.6"}]},solve:{prompt:"BOSS ROUND: The toll booth takes 10% of your 86 coins. How many is that?",accepted:["8.6"]}}],generalRule:{statement:"SPEC SHEET: To find 10% of any number, just divide by 10 \u2014 slide the decimal point one place left.",check:{prompt:"What is 10% of 450?",options:["45","4.5","450"],correctIndex:0,explain:"Divide by 10: 450 \xF7 10 = 45."}},why:{text:"100% is the WHOLE amount split into 10 equal strips \u2014 each strip is exactly 10%. Dividing by 10 finds the size of just one strip, which is why the \xF710 shortcut works every single time, no matter what the starting number is.",demo:{model:{type:"chain",percentGrid:{percent:10,why:"100% split into 10 equal strips."},steps:[{label:"\xF710 for 10%:",left:"180",op:"\xF7",right:"10",answer:"18"}]},caption:"Test it: 10% of 180 = 18 \u2014 one of ten equal strips."}}},pc51:{id:"pc51",chapter:"ch8",strategy:"Finding 5% & 1%",emoji:"\u{1F9EA}",decimalHint:!0,blurb:"5% is half of 10%. 1% is a hundredth \u2014 like diluting a solution by small, precise amounts.",worked:{model:{type:"chain",percentGrid:{percent:5,why:"5% is half of a 10% strip \u2014 find 10% first, then halve it."},steps:[{label:"Find 10% first:",left:"240",op:"\xF7",right:"10",answer:"24"},{label:"Halve it for 5%:",left:"24",op:"\xF7",right:"2",answer:"12"}]},note:"A 240 mL solution needs 5% diluted out: half of 10% (24) is 12 mL."},items:[{model:{type:"chain",percentGrid:{percent:5,why:"5% is half of a 10% strip \u2014 find 10% first, then halve it."},steps:[{label:"Find 10% first:",left:"60",op:"\xF7",right:"10",answer:"6"},{label:"Halve it for 5%:",left:"6",op:"\xF7",right:"2",answer:"3"}]},solve:{prompt:"5% of a 60 mL solution?",accepted:["3"]}},{model:{type:"chain",percentGrid:{percent:1,why:"100% split into 100 tiny squares. Each square is 1% \u2014 that's why \xF7100 works."},steps:[{label:"\xF7100 for 1%:",left:"500",op:"\xF7",right:"100",answer:"5"}]},solve:{prompt:"BOSS ROUND: 1% of a 500 mL solution?",accepted:["5"]}}],generalRule:{statement:"SPEC SHEET: 5% is HALF of 10% \u2014 find 10% first, then divide that in half. 1% is a hundredth \u2014 divide by 100.",check:{prompt:"To find 5% of 80, what's the first step?",options:["Find 10% of 80 (=8), then halve it (=4)","Multiply 80 by 5","Divide 80 by 5 directly"],correctIndex:0,explain:"5% is half of 10%: find 10% (8), then halve it (4)."}},why:{text:"5% sits exactly halfway between 0% and 10%, so it must be exactly half the size of a 10% strip. And since 100% is split into 100 tiny equal squares, each square is worth exactly 1% \u2014 dividing by 100 measures one tiny square directly.",demo:{model:{type:"chain",percentGrid:{percent:5,why:"5% is half of 10%."},steps:[{label:"Find 10% first:",left:"120",op:"\xF7",right:"10",answer:"12"},{label:"Halve it for 5%:",left:"12",op:"\xF7",right:"2",answer:"6"}]},caption:"Test it: 5% of 120 = half of 12 = 6."}}},pc257:{id:"pc257",chapter:"ch8",strategy:"25%, 50%, 75%",emoji:"\u{1F6A2}",blurb:"Quarter, half, three-quarters \u2014 all built from friendly fractions, like evacuating a deck in stages.",worked:{model:{type:"chain",percentGrid:{percent:50,why:"100% split into 2 equal halves. Each half is 50% \u2014 that's why \xF72 works."},steps:[{label:"Half for 50%:",left:"240",op:"\xF7",right:"2",answer:"120"}]},note:"240 passengers on deck \u2014 50% evacuated first is just half: 120."},items:[{model:{type:"chain",percentGrid:{percent:25,why:"100% split into 4 equal quarters. Each quarter is 25% \u2014 that's why \xF74 works."},steps:[{label:"Quarter for 25%:",left:"80",op:"\xF7",right:"4",answer:"20"}]},solve:{prompt:"25% of 80 crates loaded?",accepted:["20"]}},{model:{type:"chain",percentGrid:{percent:75,why:"75% is 3 of the 4 quarters \u2014 find one quarter, then \xD73."},steps:[{label:"Quarter first:",left:"40",op:"\xF7",right:"4",answer:"10"},{label:"\xD73 for three quarters:",left:"10",op:"\xD7",right:"3",answer:"30"}]},solve:{prompt:"BOSS ROUND: 75% of 40 tonnes of coal?",accepted:["30"]}}],generalRule:{statement:"SPEC SHEET: 50% is half, 25% is a quarter, 75% is three quarters \u2014 all built from the same friendly fraction splits.",check:{prompt:"What is 75% of 40?",options:["Find 1/4 (10), then \xD73 = 30","Find 1/2 (20), then +5","Divide 40 by 75"],correctIndex:0,explain:"75% = 3 quarters: find one quarter (10), then \xD73 = 30."}},why:{text:"25%, 50%, and 75% are just the fractions 1/4, 1/2, and 3/4 wearing percent labels. Splitting the whole into quarters gives you a building block (25%) that stacks up to make every one of these landmark percentages \u2014 2 quarters make 50%, 3 quarters make 75%.",demo:{model:{type:"chain",percentGrid:{percent:25,why:"100% split into 4 equal quarters."},steps:[{label:"Quarter for 25%:",left:"60",op:"\xF7",right:"4",answer:"15"}]},caption:"Test it: 25% of 60 = one quarter = 15."}}},pcmix:{id:"pcmix",chapter:"ch8",strategy:"Percent Shortcuts in Action",emoji:"\u{1F344}",decimalHint:!0,blurb:"Combine 10% and 5% chunks to reach any percent fast \u2014 like stacking bonus blocks to boost your score.",worked:{model:{type:"chain",percentGrid:{percent:15,why:"15% = 10% + 5%, two friendly chunks added together."},steps:[{label:"Find 10%:",left:"80",op:"\xF7",right:"10",answer:"8"},{label:"Find 5% (half of 10%):",left:"8",op:"\xF7",right:"2",answer:"4"},{label:"Add them for 15%:",left:"8",op:"+",right:"4",answer:"12"}]},note:"A bonus block gives 15% extra on 80 coins: 10% + 5% = 8 + 4 = 12 bonus coins."},items:[{model:{type:"chain",percentGrid:{percent:20,why:"20% is double 10% \u2014 find 10%, then \xD72."},steps:[{label:"Find 10%:",left:"65",op:"\xF7",right:"10",answer:"6.5"},{label:"Double it for 20%:",left:"6.5",op:"\xD7",right:"2",answer:"13"}]},solve:{prompt:"A bonus block gives 20% extra on 65 coins. How many bonus coins?",accepted:["13"]}},{model:{type:"chain",percentGrid:{percent:30,why:"30% is 10% taken three times \u2014 find 10%, then \xD73."},steps:[{label:"Find 10%:",left:"90",op:"\xF7",right:"10",answer:"9"},{label:"\xD73 for 30%:",left:"9",op:"\xD7",right:"3",answer:"27"}]},solve:{prompt:"BOSS ROUND: A bonus block gives 30% extra on 90 coins. How many bonus coins?",accepted:["27"]}}],generalRule:{statement:"SPEC SHEET: Break any percent into friendly 10%, 5%, and 1% chunks, find each chunk, then add them together.",check:{prompt:"To find 15% of a number, which chunks do you add?",options:["10% + 5%","10% + 1%","5% + 5%"],correctIndex:0,explain:"15% = 10% + 5%, two friendly chunks added together."}},why:{text:"Percentages add up just like whole numbers do \u2014 15% really is 10% plus 5% of the same amount, because percent is just a way of measuring parts of a whole, and parts can always be combined. Breaking a tricky percent into friendly chunks you already know how to find is the same 'chip away at it' idea as partial quotients.",demo:{model:{type:"chain",percentGrid:{percent:15,why:"15% = 10% + 5%."},steps:[{label:"Find 10%:",left:"100",op:"\xF7",right:"10",answer:"10"},{label:"Find 5% (half of 10%):",left:"10",op:"\xF7",right:"2",answer:"5"},{label:"Add them for 15%:",left:"10",op:"+",right:"5",answer:"15"}]},caption:"Test it: 15% of 100 = 10 + 5 = 15, split into friendly chunks."}}}};var ed={rsc1:{id:"rsc1",chapter:"ch9",strategy:"Scaling",emoji:"\u{1F9EA}",blurb:"Scale a recipe up by finding the scale factor first \u2014 like scaling a chemical mixture for more samples.",worked:{model:{type:"chain",ratioVisual:{topVals:[4,12],bottomVals:[2,6],topLabel:"Samples",bottomLabel:"mL Reagent"},steps:[{label:"Find the scale factor:",left:"12",op:"\xF7",right:"4",answer:"3"},{label:"Scale the reagent:",left:"2",op:"\xD7",right:"3",answer:"6"}]},note:"12 samples is 3\xD7 as many as 4, so reagent scales \xD73 too: 6 mL."},items:[{model:{type:"chain",ratioVisual:{topVals:[3,6],bottomVals:[9,18],missingIndex:1,side:"bottom",topLabel:"Samples",bottomLabel:"Drops of Indicator"},steps:[{label:"Find the scale factor:",left:"6",op:"\xF7",right:"3",answer:"2"},{label:"Scale the indicator:",left:"9",op:"\xD7",right:"2",answer:"18"}]},solve:{prompt:"3 samples need 9 drops of indicator. How many drops for 6 samples?",accepted:["18"]}},{model:{type:"chain",ratioVisual:{topVals:[5,15],bottomVals:[3,9],missingIndex:1,side:"bottom",topLabel:"Samples",bottomLabel:"mL Catalyst"},steps:[{label:"Find the scale factor:",left:"15",op:"\xF7",right:"5",answer:"3"},{label:"Scale the catalyst:",left:"3",op:"\xD7",right:"3",answer:"9"}]},solve:{prompt:"BOSS ROUND: 5 samples need 3 mL catalyst. How many mL for 15 samples?",accepted:["9"]}}],generalRule:{statement:"SPEC SHEET: Find how many times bigger the new amount is (the scale factor), then multiply every ingredient by that same factor.",check:{prompt:"A recipe for 4 people needs 2 mL reagent. Scaling to 12 people (\xD73), how much reagent?",options:["2 \xD7 3 = 6 mL","2 + 3 = 5 mL","2 \xF7 3 mL"],correctIndex:0,explain:"Scale factor 3 (12\xF74), so reagent also \xD73: 2 \xD7 3 = 6 mL."}},why:{text:"A recipe is a fixed ratio between ingredients and people \u2014 every ingredient must scale by the exact same factor, or the mixture comes out wrong. Finding the scale factor once and applying it to every part keeps the whole recipe balanced, just bigger.",demo:{model:{type:"chain",ratioVisual:{topVals:[6,18],bottomVals:[4,12],topLabel:"Samples",bottomLabel:"mL Solvent"},steps:[{label:"Find the scale factor:",left:"18",op:"\xF7",right:"6",answer:"3"},{label:"Scale the solvent:",left:"4",op:"\xD7",right:"3",answer:"12"}]},caption:"Test it: 6 samples need 4 mL. Scale to 18 samples (\xD73): 12 mL."}}},rur1:{id:"rur1",chapter:"ch9",strategy:"Unit Rate",emoji:"\u{1F6A2}",blurb:"Divide to find the value of just one \u2014 like the cost of a single lifebelt or the ship's speed.",worked:{model:{type:"chain",steps:[{label:"Divide total by count:",left:"12",op:"\xF7",right:"4",answer:"3"}]},note:"$12 buys 4 lifebelts, so each lifebelt costs $12 \xF7 4 = $3."},items:[{model:{type:"chain",steps:[{label:"Divide total by count:",left:"20",op:"\xF7",right:"5",answer:"4"}]},solve:{prompt:"$20 buys 5 lifebelts. What's the cost per lifebelt?",accepted:["4"]}},{model:{type:"chain",steps:[{label:"Divide distance by time:",left:"60",op:"\xF7",right:"4",answer:"15"}]},solve:{prompt:"BOSS ROUND: A ship covers 60 nm in 4 hours. What speed is that (nm per hour)?",accepted:["15"]}}],generalRule:{statement:"SPEC SHEET: Divide the total by the count to find the value of just ONE \u2014 that's the unit rate.",check:{prompt:"$20 buys 5 lifebelts. What's the cost per lifebelt?",options:["20 \xF7 5 = $4","20 \xD7 5 = $100","20 \u2212 5 = $15"],correctIndex:0,explain:"total \xF7 count = unit rate: 20 \xF7 5 = $4 each."}},why:{text:"A unit rate answers 'how much for just ONE?' \u2014 dividing the total evenly across the count spreads the cost (or distance, or anything) back down to a single unit. It's the same move as sharing, just applied to money or speed instead of objects.",demo:{model:{type:"chain",steps:[{label:"Divide total by count:",left:"18",op:"\xF7",right:"6",answer:"3"}]},caption:"Test it: $18 for 6 lifebuoys = $3 each \u2014 the unit rate."}}},rdl1:{id:"rdl1",chapter:"ch9",strategy:"Double Number Line",emoji:"\u{1F6A2}",blurb:"Two matching lines show how paired quantities grow together \u2014 like hours and nautical miles on a voyage.",worked:{model:{type:"doubleline",topVals:[0,1,2,3,4],bottomVals:[0,5,10,15,20],missingIndex:3,side:"bottom",missingValue:15,topLabel:"Hours",bottomLabel:"Nautical miles"},note:"Every hour adds 5 nm. In 3 hours, that's 15 nm."},items:[{model:{type:"doubleline",topVals:[0,1,2,3],bottomVals:[0,3,6,"?"],missingIndex:3,side:"bottom",missingValue:9,topLabel:"Crates",bottomLabel:"Rivets"},solve:{prompt:"What number completes the bottom row?",accepted:["9"]}},{model:{type:"doubleline",topVals:[0,"?",4,6],bottomVals:[0,7,14,21],missingIndex:1,side:"top",missingValue:2,topLabel:"Hours",bottomLabel:"Nautical miles"},solve:{prompt:"BOSS ROUND: What number c
