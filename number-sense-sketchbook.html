ompletes the top row?",accepted:["2"]}}],generalRule:{statement:"SPEC SHEET: Whatever step the top row takes, the bottom row takes the matching scaled step \u2014 the two lines always move together.",check:{prompt:"Top row goes 0, 1, 2, 3 (hours). Bottom row goes 0, 5, 10, ? (nautical miles). What's missing?",options:["15, since each hour adds 5 nm","10, same as hour 2","20, since 4 hours would give 20"],correctIndex:0,explain:"Each hour adds 5 nm, so hour 3 gives 15 nm."}},why:{text:"A double number line works because both rows are locked to the SAME ratio \u2014 every step on top corresponds to a matching, scaled step on the bottom. Once you know the ratio between one matching pair, you can find any other pair by scaling both rows by the same amount.",demo:{model:{type:"doubleline",topVals:[0,1,2,3],bottomVals:[0,4,8,12],missingIndex:3,side:"bottom",missingValue:12,topLabel:"Crates",bottomLabel:"Rivets"},caption:"Test it: 3 crates need 12 rivets, since each crate takes 4 \u2014 top and bottom scale together."}}},rtb1:{id:"rtb1",chapter:"ch9",strategy:"Tables",emoji:"\u{1F344}",blurb:"A ratio table lists paired amounts that scale together \u2014 like players and coins collected.",worked:{model:{type:"ratiotable",headers:["Players","Coins Collected"],rows:[["3","9"],["6","?"]],steps:[{label:"Find the scale factor:",left:"6",op:"\xF7",right:"3",answer:"2"},{label:"Scale the coins:",left:"9",op:"\xD7",right:"2",answer:"18"}]},note:"6 players is double 3, so coins double too: 18."},items:[{model:{type:"ratiotable",headers:["Levels Cleared","Power-Ups Found"],rows:[["4","20"],["8","?"]],steps:[{label:"Find the scale factor:",left:"8",op:"\xF7",right:"4",answer:"2"},{label:"Scale the power-ups:",left:"20",op:"\xD7",right:"2",answer:"40"}]},solve:{prompt:"4 levels cleared nets 20 power-ups. How many power-ups after 8 levels?",accepted:["40"]}},{model:{type:"ratiotable",headers:["Hours Played","Coins Earned"],rows:[["2","14"],["5","?"]],steps:[{label:"Find the scale factor:",left:"5",op:"\xF7",right:"2",answer:"2.5"},{label:"Scale the coins:",left:"14",op:"\xD7",right:"2.5",answer:"35"}]},solve:{prompt:"BOSS ROUND: 2 hours played earns 14 coins. How many coins after 5 hours?",accepted:["35"]}}],generalRule:{statement:"SPEC SHEET: In a ratio table, find how the top row scaled to get to the new row, then scale the bottom row by that exact same amount.",check:{prompt:"Table: 3 players \u2192 9 coins. 6 players \u2192 ? coins. What's the move?",options:["6 \xF7 3 = 2, then 9 \xD7 2 = 18","6 + 3 = 9 coins","9 \xF7 3 = 3 coins"],correctIndex:0,explain:"Scale factor 2 (6\xF73), so coins also \xD72: 9 \xD7 2 = 18."}},why:{text:"A ratio table is just several rows of the same fixed ratio, listed side by side. Since every row must keep the SAME relationship between the two columns, finding how one column scaled tells you exactly how much to scale the other column too \u2014 no matter which row you're filling in.",demo:{model:{type:"ratiotable",headers:["Players","Coins Collected"],rows:[["4","12"],["8","?"]],steps:[{label:"Find the scale factor:",left:"8",op:"\xF7",right:"4",answer:"2"},{label:"Scale the coins:",left:"12",op:"\xD7",right:"2",answer:"24"}]},caption:"Test it: 4 players collect 12 coins. 8 players (\xD72) collect 24."}}}};var td={rp1:{id:"rp1",chapter:"ch10",strategy:"Repeating Patterns",emoji:"\u{1F6A2}",blurb:"Find the smallest repeating chunk to predict what comes next \u2014 like a repeating hull marker sequence.",worked:{model:{type:"judgechoice",statement:"The engineer paints hull markers in a repeating pattern: \u{1F534}\u{1F535}\u{1F534}\u{1F535}\u{1F534}, ? What comes next?",options:["\u{1F534}","\u{1F535}","\u26AA"],correctIndex:1,visual:{kind:"strip",cells:["\u{1F534}","\u{1F535}","\u{1F534}","\u{1F535}","\u{1F534}"],unit:2}},note:"The pattern repeats every 2 markers: red, blue, red, blue... After red comes blue."},items:[{model:{type:"judgechoice",statement:"Rivet caps are painted in a pattern: \u2699\uFE0F\u2699\uFE0F\u{1F527}\u2699\uFE0F\u2699\uFE0F\u{1F527}\u2699\uFE0F\u2699\uFE0F, ? What comes next?",options:["\u2699\uFE0F","\u{1F527}","\u2B50"],correctIndex:1,visual:{kind:"strip",cells:["\u2699\uFE0F","\u2699\uFE0F","\u{1F527}","\u2699\uFE0F","\u2699\uFE0F","\u{1F527}","\u2699\uFE0F","\u2699\uFE0F"],unit:3}},solve:{prompt:"The pattern repeats every 3 caps. What comes next?",accepted:["\u{1F527}","wrench"]}},{model:{type:"judgechoice",statement:"BOSS ROUND: Warp-block colors repeat: \u{1F7E8}\u{1F7E9}\u{1F7E9}\u{1F7E8}\u{1F7E9}\u{1F7E9}\u{1F7E8}, ? What comes next?",options:["\u{1F7E8}","\u{1F7E9}"],correctIndex:1,visual:{kind:"strip",cells:["\u{1F7E8}","\u{1F7E9}","\u{1F7E9}","\u{1F7E8}","\u{1F7E9}","\u{1F7E9}","\u{1F7E8}"],unit:3}},solve:{prompt:"BOSS ROUND: The pattern repeats every 3 blocks. What comes next?",accepted:["\u{1F7E9}","green"]}}],generalRule:{statement:"SPEC SHEET: Find the smallest repeating chunk (the 'unit'), then count how far into the next unit you are to predict what comes next.",check:{prompt:"A pattern repeats every 2 symbols: \u2B50\u{1F53A}\u2B50\u{1F53A}\u2B50\u{1F53A}\u2B50, ? What comes next?",options:["\u{1F53A}","\u2B50","A new symbol"],correctIndex:0,explain:"The unit \u2B50\u{1F53A} has length 2. After 7 terms you're mid-unit, so the next term completes it: \u{1F53A}."}},why:{text:"Repeating patterns work because the SAME short sequence loops forever \u2014 once you know the loop's length and where you are within it, you can predict any position without listing every single term. It's the same idea as a scheduled shift rotation: know the cycle, know your place in it, and you know what's next.",demo:{model:{type:"judgechoice",statement:"A repeating pattern: \u{1F7E6}\u{1F7E6}\u{1F7E8}\u{1F7E6}\u{1F7E6}\u{1F7E8}\u{1F7E6}\u{1F7E6}, ? What comes next?",options:["\u{1F7E6}","\u{1F7E8}"],correctIndex:1,visual:{kind:"strip",cells:["\u{1F7E6}","\u{1F7E6}","\u{1F7E8}","\u{1F7E6}","\u{1F7E6}","\u{1F7E8}","\u{1F7E6}","\u{1F7E6}"],unit:3}},caption:"Test it: the unit \u{1F7E6}\u{1F7E6}\u{1F7E8} repeats \u2014 after two \u{1F7E6}'s, a \u{1F7E8} always follows."}}},grw1:{id:"grw1",chapter:"ch10",strategy:"Growing Patterns",emoji:"\u{1F6A2}",blurb:"Find the constant amount added each time \u2014 like a ship adding the same number of new portholes per deck.",worked:{model:{type:"chain",steps:[{label:"Find the common difference:",left:"7",op:"\u2212",right:"3",answer:"4"},{label:"Add the difference to the last term:",left:"15",op:"+",right:"4",answer:"19"}]},note:"The ship adds 4 new portholes to each deck level: 3, 7, 11, 15, ... The next deck has 15 + 4 = 19."},items:[{model:{type:"chain",steps:[{label:"Find the common difference:",left:"9",op:"\u2212",right:"5",answer:"4"},{label:"Add the difference to the last term:",left:"17",op:"+",right:"4",answer:"21"}]},solve:{prompt:"Rivet counts grow by the same amount each row: 5, 9, 13, 17, ? What's next?",accepted:["21"]}},{model:{type:"chain",steps:[{label:"Find the common difference:",left:"11",op:"\u2212",right:"6",answer:"5"},{label:"Add the difference to the last term:",left:"21",op:"+",right:"5",answer:"26"}]},solve:{prompt:"BOSS ROUND: A titration adds solution in a steady pattern: 6, 11, 16, 21, ? mL. What's next?",accepted:["26"]}}],generalRule:{statement:"SPEC SHEET: Find the constant amount added between terms (the common difference), then add it once more to the last term to find what's next.",check:{prompt:"2, 6, 10, 14, ? \u2014 what's the common difference and next term?",options:["+4, so next is 18","+2, so next is 16","\xD72, so next is 28"],correctIndex:0,explain:"Each term adds 4: 14 + 4 = 18."}},why:{text:"A growing pattern works because the SAME amount gets added every single step \u2014 that constant difference is the engine driving the whole sequence. Once you've measured it once (by subtracting two neighboring terms), you can keep applying it forever, just like a steady production rate on an assembly line.",demo:{model:{type:"chain",steps:[{label:"Find the common difference:",left:"9",op:"\u2212",right:"5",answer:"4"},{label:"Add the difference to the last term:",left:"21",op:"+",right:"4",answer:"25"}]},caption:"Test it: 5, 9, 13, 17, 21 grows by 4 each time \u2014 next is 25."}}},iom1:{id:"iom1",chapter:"ch10",strategy:"Input-Output Machines",emoji:"\u{1F6A2}",blurb:"Apply the same rule to every input, in order \u2014 like the engine room's fixed processing rule.",worked:{model:{type:"chain",steps:[{label:"Multiply by the rule:",left:"5",op:"\xD7",right:"2",answer:"10"},{label:"Then add:",left:"10",op:"+",right:"1",answer:"11"}]},note:"The engine room's rule is 'input \xD72, then +1'. Feed in 5: 5\xD72=10, 10+1=11 comes out."},items:[{model:{type:"chain",steps:[{label:"Multiply by the rule:",left:"4",op:"\xD7",right:"3",answer:"12"},{label:"Then add:",left:"12",op:"+",right:"2",answer:"14"}]},solve:{prompt:"The rule is \xD73, then +2. What comes out if you feed in 4?",accepted:["14"]}},{model:{type:"chain",steps:[{label:"Multiply by the rule:",left:"7",op:"\xD7",right:"2",answer:"14"},{label:"Then subtract:",left:"14",op:"\u2212",right:"3",answer:"11"}]},solve:{prompt:"BOSS ROUND: The rule is \xD72, then \u22123. What comes out if you feed in 7 coins?",accepted:["11"]}}],generalRule:{statement:"SPEC SHEET: Apply the SAME rule, in the SAME order, to every input that goes into the machine \u2014 the rule never changes, only the number does.",check:{prompt:"The rule is \xD74, then \u22121. What comes out for input 3?",options:["3\xD74=12, then 12\u22121=11","3\u22121=2, then \xD74=8","3\xD74\u22121 in any order works"],correctIndex:0,explain:"Apply the rule in order: \xD74 first (12), then \u22121 (11)."}},why:{text:"A function machine works because it's a fixed procedure, not a fixed answer \u2014 the SAME steps run every time, just on different starting numbers. Order matters because \xD74 then \u22121 gives a different result than \u22121 then \xD74, exactly like tightening a bolt before or after painting it changes the outcome.",demo:{model:{type:"chain",steps:[{label:"Multiply by the rule:",left:"6",op:"\xD7",right:"2",answer:"12"},{label:"Then add:",left:"12",op:"+",right:"3",answer:"15"}]},caption:"Test it: rule \xD72 then +3, input 6 \u2192 15. Same rule, different input, no surprises."}}},tnr1:{id:"tnr1",chapter:"ch10",strategy:"Term Rule",emoji:"\u{1F6A2}",blurb:"Jump straight to any term without listing them all \u2014 like calculating a hull section far down the blueprint.",worked:{model:{type:"chain",steps:[{label:"Find how many steps to add:",left:"5",op:"\u2212",right:"1",answer:"4"},{label:"Multiply steps by the common difference:",left:"4",op:"\xD7",right:"3",answer:"12"},{label:"Add to the first term:",left:"12",op:"+",right:"2",answer:"14"}]},note:"A hull section pattern starts at 2 and grows by 3 each time. The 5th section: (5\u22121) steps \xD7 3 = 12, plus the first term 2 = 14."},items:[{model:{type:"chain",steps:[{label:"Find how many steps to add:",left:"6",op:"\u2212",right:"1",answer:"5"},{label:"Multiply steps by the common difference:",left:"5",op:"\xD7",right:"5",answer:"25"},{label:"Add to the first term:",left:"25",op:"+",right:"4",answer:"29"}]},solve:{prompt:"A pattern starts at 4 and grows by 5 each time. What is the 6th term?",accepted:["29"]}},{model:{type:"chain",steps:[{label:"Find how many steps to add:",left:"5",op:"\u2212",right:"1",answer:"4"},{label:"Multiply steps by the common difference:",left:"4",op:"\xD7",right:"7",answer:"28"},{label:"Add to the first term:",left:"28",op:"+",right:"3",answer:"31"}]},solve:{prompt:"BOSS ROUND: A concentration pattern starts at 3 and grows by 7 each measurement. What is the 5th measurement?",accepted:["31"]}}],generalRule:{statement:"SPEC SHEET: To jump straight to any term, count how many STEPS from the first term (position \u2212 1), multiply by the common difference, then add the first term.",check:{prompt:"Find the 4th term of a pattern starting at 5, growing by 6 each time.",options:["(4\u22121)\xD76+5 = 23","4\xD76+5 = 29","4\xD75+6 = 26"],correctIndex:0,explain:"Steps = 4\u22121 = 3, times the difference 6 = 18, plus the first term 5 = 23."}},why:{text:"Jumping to any term without listing every single one works because a growing pattern is really just repeated addition \u2014 the SAME as multiplication! Instead of adding the difference over and over by hand, you multiply the difference by how many times you'd have added it, then add that onto the starting point in one move.",demo:{model:{type:"chain",steps:[{label:"Find how many steps to add:",left:"6",op:"\u2212",right:"1",answer:"5"},{label:"Multiply steps by the common difference:",left:"5",op:"\xD7",right:"4",answer:"20"},{label:"Add to the first term:",left:"20",op:"+",right:"2",answer:"22"}]},caption:"Test it: start 2, grow by 4 \u2192 the 6th term is 22, found in one multiplication instead of five additions."}}},spp1:{id:"spp1",chapter:"ch10",strategy:"Spatial Patterns",emoji:"\u{1F6A2}",blurb:"A growing square pattern's size follows stage \xD7 stage \u2014 like a growing lattice of support beams.",worked:{model:{type:"array",rows:3,cols:3,missing:"product"},note:"Blueprint stage 3 of the hull lattice is a 3\xD73 grid of support beams: 9 beams total."},items:[{model:{type:"array",rows:4,cols:4,missing:"product"},solve:{prompt:"Blueprint stage 4 is a 4\xD74 grid of support beams. How many total?",accepted:["16"]}},{model:{type:"array",rows:5,cols:5,missing:"product"},solve:{prompt:"BOSS ROUND: Level 5's block grid is 5\xD75. How many blocks total?",accepted:["25"]}}],generalRule:{statement:"SPEC SHEET: A growing square pattern at stage N has N \xD7 N total pieces \u2014 the stage number multiplied by itself.",check:{prompt:"Stage 6 of a growing square pattern \u2014 how many pieces?",options:["6 \xD7 6 = 36","6 + 6 = 12","6 \xD7 2 = 12"],correctIndex:0,explain:"A square stage N always has N \xD7 N pieces: 6 \xD7 6 = 36."}},why:{text:"A growing square pattern works because each stage adds a full new row AND a full new column to keep the shape square \u2014 and rows \xD7 columns is exactly what multiplication measures. This isn't random growth, it's the same array idea from Chapter 3, just relabeled by 'stage number' instead of a fixed count.",demo:{model:{type:"array",rows:7,cols:7,missing:null},caption:"Test it: stage 7 is a 7\xD77 grid = 49 pieces \u2014 same square-growth rule."}}}};var nd={uk1:{id:"uk1",chapter:"ch11",strategy:"Unknowns as Boxes",emoji:"\u{1F6A2}",blurb:"A box (or letter) standing in for a missing number \u2014 solved exactly like a number bond.",worked:{model:{type:"bondweb",whole:15,a:9,b:6,missing:null},note:"A crate weighs \u25A1 kg plus 9 kg of ballast, totaling 15 kg. The box (unknown) is 15 \u2212 9 = 6 kg."},items:[{model:{type:"bondweb",whole:22,a:14,b:8,missing:"b"},solve:{prompt:"Solve for the box: \u25A1 + 14 = 22",accepted:["8"]}},{model:{type:"bondweb",whole:40,a:17,b:23,missing:"b"},solve:{prompt:"BOSS ROUND: A flask holds \u25A1 mL plus 17 mL of solvent, totaling 40 mL. Solve for the box.",accepted:["23"]}}],generalRule:{statement:"SPEC SHEET: An unknown box in an addition equation is found the exact same way as a missing number bond: whole \u2212 known part = the box.",check:{prompt:"Solve \u25A1 + 12 = 30. What's the move?",options:["30 \u2212 12 = 18","30 + 12 = 42","12 \u2212 30 = \u221218"],correctIndex:0,explain:"whole \u2212 known part = box: 30 \u2212 12 = 18."}},why:{text:"A box (or a letter like x) is just a placeholder for a missing number bond \u2014 algebra doesn't introduce a new rule here, it just gives the missing part a name you can write down and solve for. Every 'solve for x' addition problem you'll ever see starts from this exact same number-bond idea.",demo:{model:{type:"bondweb",whole:18,a:7,b:11,missing:null},caption:"Test it: \u25A1 + 7 = 18 \u2192 \u25A1 = 11, same move as any number bond."}}},bal1:{id:"bal1",chapter:"ch11",strategy:"Balance & Equality",emoji:"\u{1F6A2}",blurb:"The = sign means both sides weigh the same \u2014 like a balance scale that must stay level.",worked:{model:{type:"judgechoice",statement:"A balance scale shows 8+5 on one side. Which keeps it balanced on the other side?",options:["9+4","10+2","13+1"],correctIndex:0,visual:{kind:"scale",left:[8,5],right:[null],tilt:"level"}},note:"8 + 5 = 13. 9 + 4 also equals 13, so it balances the scale."},items:[{model:{type:"judgechoice",statement:"Balance scale: 6+9 on one side. Which balances it?",options:["7+8","10+5","6+8"],correctIndex:0,visual:{kind:"scale",left:[6,9],right:[null],tilt:"level"}},solve:{prompt:"What number does 6+9 equal (that both sides must match)?",accepted:["15"]}},{model:{type:"judgechoice",statement:"BOSS ROUND: Coin scale shows 12+7 on one side. Which balances it?",options:["10+9","15+5","11+7"],correctIndex:0,visual:{kind:"scale",left:[12,7],right:[null],tilt:"level"}},solve:{prompt:"BOSS ROUND: What number does 12+7 equal?",accepted:["19"]}}],generalRule:{statement:"SPEC SHEET: The = sign means BOTH sides must have the exact same total value \u2014 whatever you do to balance one side, the other side must match exactly.",check:{prompt:"Does 9+6 = 8+7?",options:["Yes, both equal 15","No, 9+6 is bigger","No, 8+7 is bigger"],correctIndex:0,explain:"9+6=15 and 8+7=15 \u2014 both sides match, so the equation balances."}},why:{text:"Equality is a balance scale, not an arrow pointing to an answer \u2014 both sides must weigh the same. This matters because in algebra you'll do the exact same operation to BOTH sides of an equation to solve it, and that only works if you treat = as 'these two things are equal', not 'compute the left side'.",demo:{model:{type:"judgechoice",statement:"Does 14 = 6+8?",options:["Yes","No"],correctIndex:0,visual:{kind:"scale",left:[14],right:[6,8],tilt:"level"}},caption:"Test it: 6+8=14, so the scale balances both ways, no matter which side you write first."}}},var1:{id:"var1",chapter:"ch11",strategy:"Variable Expressions",emoji:"\u{1F6A2}",blurb:"Substitute a number for the letter, then follow the order of operations \u2014 the letter is just a labeled blank.",worked:{model:{type:"chain",steps:[{label:"Multiply:",left:"3",op:"\xD7",right:"4",answer:"12"},{label:"Add:",left:"12",op:"+",right:"2",answer:"14"}]},note:"The expression 3\xD7n + 2, evaluated at n=4: 3\xD74=12, then +2=14."},items:[{model:{type:"chain",steps:[{label:"Multiply:",left:"5",op:"\xD7",right:"6",answer:"30"},{label:"Subtract:",left:"30",op:"\u2212",right:"3",answer:"27"}]},solve:{prompt:"Evaluate 5\xD7n \u2212 3 when n=6.",accepted:["27"]}},{model:{type:"chain",steps:[{label:"Multiply:",left:"2",op:"\xD7",right:"9",answer:"18"},{label:"Add:",left:"18",op:"+",right:"7",answer:"25"}]},solve:{prompt:"BOSS ROUND: Evaluate 2\xD7n + 7 when n=9.",accepted:["25"]}}],generalRule:{statement:"SPEC SHEET: To evaluate an expression, substitute the given number in place of the letter, then follow the order of operations exactly.",check:{prompt:"Evaluate 4\xD7n + 1 when n=5.",options:["4\xD75+1 = 21","4+5\xD71 = 9","4\xD75\xD71 = 20"],correctIndex:0,explain:"Substitute n=5: 4\xD75=20, then +1=21."}},why:{text:"A variable is just a labeled blank waiting for a number \u2014 'evaluating' an expression means plugging that number in and computing exactly as written, same order every time. The letter n doesn't do anything special mathematically; it's a placeholder, the same way \u25A1 was in earlier chapters, just with a more grown-up name.",demo:{model:{type:"chain",steps:[{label:"Multiply:",left:"3",op:"\xD7",right:"5",answer:"15"},{label:"Add:",left:"15",op:"+",right:"4",answer:"19"}]},caption:"Test it: 3\xD7n+4 at n=5 \u2192 15+4=19."}}},ineq1:{id:"ineq1",chapter:"ch11",strategy:"Comparing Expressions",emoji:"\u{1F6A2}",blurb:"Substitute the same number into both expressions, then compare the results directly.",worked:{model:{type:"judgechoice",statement:"At n=4, compare 2\xD7n+1 and 3\xD7n\u22122. Which is bigger?",options:["Left side","Right side","Equal"],correctIndex:1,visual:{kind:"boxbars",n:4,rows:[{label:"Left: 2\xD7n+1",k:2,extra:1},{label:"Right: 3\xD7n\u22122",k:3,extra:-2}]}},note:"2\xD74+1=9 and 3\xD74\u22122=10. Since 10 > 9, the right side is bigger."},items:[{model:{type:"judgechoice",statement:"At n=3, compare 5\xD7n and 3\xD7n+8. Which is bigger?",options:["Left side","Right side","Equal"],correctIndex:1,visual:{kind:"boxbars",n:3,rows:[{label:"Left: 5\xD7n",k:5,extra:0},{label:"Right: 3\xD7n+8",k:3,extra:8}]}},solve:{prompt:"What is 3\xD7n+8 at n=3?",accepted:["17"]}},{model:{type:"judgechoice",statement:"BOSS ROUND: At n=6, compare 4\xD7n\u22125 and 2\xD7n+10. Which is bigger?",options:["Left side","Right side","Equal"],correctIndex:1,visual:{kind:"boxbars",n:6,rows:[{label:"Left: 4\xD7n\u22125",k:4,extra:-5},{label:"Right: 2\xD7n+10",k:2,extra:10}]}},solve:{prompt:"BOSS ROUND: What is 2\xD7n+10 at n=6?",accepted:["22"]}}],generalRule:{statement:"SPEC SHEET: To compare two expressions, substitute the same number into both, compute each side, then compare the results directly.",check:{prompt:"At n=5, compare 2\xD7n and n+8. Which is bigger?",options:["2\xD7n=10, n+8=13, so right is bigger","2\xD7n is always bigger","They're always equal"],correctIndex:0,explain:"Substitute n=5 into both: 2\xD75=10 and 5+8=13 \u2014 13 is bigger."}},why:{text:"Comparing expressions isn't a new skill \u2014 it's evaluating both sides (same as Variable Expressions) and then comparing two whole numbers, a skill from way back in Chapter 1's benchmark work. Algebra keeps building on the exact same number sense, just with expressions standing in for numbers until you plug a value in.",demo:{model:{type:"judgechoice",statement:"At n=2, compare 6\xD7n and 4\xD7n+5. Which is bigger?",options:["Left side","Right side","Equal"],correctIndex:1,visual:{kind:"boxbars",n:2,rows:[{label:"Left: 6\xD7n",k:6,extra:0},{label:"Right: 4\xD7n+5",k:4,extra:5}]}},caption:"Test it: at n=2, 6n=12 and 4n+5=13 \u2014 the right side edges ahead."}}},alg1:{id:"alg1",chapter:"ch11",strategy:"Translating Word Problems",emoji:"\u{1F6A2}",blurb:"Every phrase hides a matching operation \u2014 turn the sentence into an equation you already know how to solve.",worked:{model:{type:"judgechoice",statement:"A crate holds some bolts, plus 5 more were added, making 20 total. Which equation matches?",options:["b+5=20","b\u22125=20","5\xD7b=20"],correctIndex:0,visual:{kind:"bar",whole:20,label:"20 total",segs:[{v:15,text:"?",name:"b bolts"},{v:5,text:"5",name:"added"}]}},note:"'Some bolts plus 5 more equals 20' translates directly to b + 5 = 20."},items:[{model:{type:"judgechoice",statement:"A tank had some fuel, 30 L was pumped out, leaving 45 L. Which equation matches?",options:["f\u221230=45","f+30=45","30\u2212f=45"],correctIndex:0,visual:{kind:"bar",whole:75,label:"f = ?",segs:[{v:45,text:"45",name:"left in tank"},{v:30,text:"30",name:"pumped out"}]}},solve:{prompt:"Solve for f: how much fuel was there originally?",accepted:["75"]}},{model:{type:"judgechoice",statement:"BOSS ROUND: A beaker had some solution s, and 3 times that amount was poured in as a second batch, totaling 40 mL combined. Which equation matches?",options:["s+3\xD7s=40","s\xD73=40","s\u22123=40"],correctIndex:0,visual:{kind:"bar",whole:40,label:"40 mL",segs:[{v:10,text:"s",name:"1st batch"},{v:30,text:"s",name:"3 \xD7 s (2nd batch)",parts:3}]}},solve:{prompt:"BOSS ROUND: Solve for s: what was the original amount?",accepted:["10"]}}],generalRule:{statement:"SPEC SHEET: Turn each phrase into its matching operation \u2014 'plus/more/total' \u2192 +, 'minus/less/taken away' \u2192 \u2212, 'times/groups of' \u2192 \xD7, then write the unknown as a letter or box.",check:{prompt:"'A number decreased by 7 equals 15' \u2014 which equation matches?",options:["n\u22127=15","7\u2212n=15","n+7=15"],correctIndex:0,explain:"'Decreased by' means subtract: the original number minus 7 equals 15."}},why:{text:"Word problems are just equations wearing sentences \u2014 every phrase has a matching operation hiding inside it. Learning to spot those phrase-to-symbol matches means you can turn ANY word problem into something you already know how to solve, instead of guessing at the answer.",demo:{model:{type:"judgechoice",statement:"'12 more than a number equals 30' \u2014 which equation matches?",options:["n+12=30","12\u2212n=30","n\u221212=30"],correctIndex:0,visual:{kind:"bar",whole:30,label:"30",segs:[{v:18,text:"?",name:"n"},{v:12,text:"12",name:"12 more"}]}},caption:"Test it: 'more than' means add \u2014 n+12=30, so n=18."}}}};var rd={bm1:{id:"bm1",chapter:"ch12",strategy:"Bar Model: Part-Whole",emoji:"\u{1F6A2}",blurb:"Draw the whole as one bar split into parts \u2014 a number bond you can see.",worked:{model:{type:"bondweb",whole:85,a:37,b:48,missing:null},note:"The ship carries 85 passengers total. 37 are in First Class. The bar model shows the rest (Economy) is 85 \u2212 37 = 48."},items:[{model:{type:"bondweb",whole:120,a:45,b:75,missing:"b"},solve:{prompt:"120 crates total, 45 are coal. How many are cargo (the rest)?",accepted:["75"]}},{model:{type:"bondweb",whole:96,a:58,b:38,missing:"b"},solve:{prompt:"BOSS ROUND: 96 coins total collected, 58 from blocks. How many from enemies (the rest)?",accepted:["38"]}}],generalRule:{statement:"SPEC SHEET: Draw the WHOLE as one bar split into parts \u2014 if you know the whole and one part, the other part is whole minus that part, exactly like a number bond.",check:{prompt:"A bar model shows a whole of 60, split into a known part of 25 and an unknown part. What's the unknown?",options:["60\u221225=35","60+25=85","25\u221260=\u221235"],correctIndex:0,explain:"whole \u2212 known part = unknown part: 60 \u2212 25 = 35."}},why:{text:"A bar model is just a number bond drawn as a picture \u2014 the visual makes the whole-minus-part relationship impossible to miss, because you can literally see the missing chunk of the bar. Every part-whole word problem, no matter how it's worded, reduces to this exact same picture.",demo:{model:{type:"bondweb",whole:54,a:29,b:25,missing:null},caption:"Test it: whole 54 splits into 29 and 25 \u2014 draw it as one bar, two parts."}}},bm2:{id:"bm2",chapter:"ch12",strategy:"Bar Model: Comparison",emoji:"\u{1F6A2}",blurb:"Two bars side by side \u2014 the gap between them is the difference, found by counting up.",worked:{model:{type:"chain",barCompare:{a:{label:"Cargo Hold A",value:28},b:{label:"Coal Bunker B",value:50}},steps:[{label:"Longer bar \u2212 shorter bar = the gap:",left:"50",op:"\u2212",right:"28",answer:"22"}]},note:"Hold A carries 28 tonnes, Bunker B carries 50. Line the bars up: the dashed piece is the gap. 50 \u2212 28 = 22 tonnes more."},items:[{model:{type:"chain",barCompare:{a:{label:"Deck A",value:34},b:{label:"Deck B",value:60}},steps:[{label:"Longer bar \u2212 shorter bar = the gap:",left:"60",op:"\u2212",right:"34",answer:"26"}]},solve:{prompt:"Deck A carries 34 passengers, Deck B carries 60. How many more does Deck B carry?",accepted:["26"]}},{model:{type:"chain",barCompare:{a:{label:"Flask A (mL)",value:19},b:{label:"Flask B (mL)",value:52}},steps:[{label:"Longer bar \u2212 shorter bar = the gap:",left:"52",op:"\u2212",right:"19",answer:"33"}]},solve:{prompt:"BOSS ROUND: Flask A holds 19 mL, Flask B holds 52 mL. How many more mL does Flask B hold?",accepted:["33"]}}],generalRule:{statement:"SPEC SHEET: Draw two bars side by side \u2014 the difference between them is the length of the leftover piece on the longer bar, found by counting up from the shorter to the longer.",check:{prompt:"Bar A is 40, Bar B is 65. What's the difference?",options:["Count up from 40 to 65 = 25","65+40=105","65\xD740"],correctIndex:0,explain:"The difference is the gap between the two bars: 65 \u2212 40 = 25."}},why:{text:"A comparison bar model makes subtraction visible \u2014 instead of computing an abstract 65\u221240, you can literally see the leftover chunk that makes Bar B longer than Bar A. It's the exact sa
