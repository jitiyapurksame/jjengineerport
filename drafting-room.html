<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover" />
<title>The Drafting Room — J.J.'s Engineering Academy</title>
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="default" />
<meta name="apple-mobile-web-app-title" content="Drafting Room" />
<meta name="description" content="Practice sketching and reading scientific models, ship-engineer style." />
<style>
@import url('https://fonts.googleapis.com/css2?family=Space+Mono:wght@400;700&family=Inter:wght@400;500;600;700&display=swap');

:root {
  --bg: #F1ECDD;
  --card: #FFFFFF;
  --ink: #16293A;
  --ink-soft: #5B6B78;
  --teal: #0E2A45;
  --teal-dark: #081826;
  --blueprint: #0B3550;
  --blueprint-line: rgba(255,255,255,0.09);
  --blueprint-line-strong: rgba(217,164,65,0.35);
  --amber: #D9A441;
  --amber-dark: #B3822C;
  --coral: #C1503A;
  --lab: #7C5CBF;
  --lab-bg: #F0EBFA;
  --success: #3FA37A;
  --success-bg: #E6F5EE;
  --nudge-bg: #FCEFD9;
  --nudge-ink: #8A5A18;
  --danger: #C0392B;
  --danger-bg: #FBEAE7;
  --mono: 'Space Mono', 'Courier New', monospace;
}

* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
html, body, #app { min-height: 100%; }
body {
  margin: 0;
  background-color: var(--blueprint);
  background-image:
    repeating-linear-gradient(0deg, var(--blueprint-line) 0px, var(--blueprint-line) 1px, transparent 1px, transparent 24px),
    repeating-linear-gradient(90deg, var(--blueprint-line) 0px, var(--blueprint-line) 1px, transparent 1px, transparent 24px),
    repeating-linear-gradient(0deg, var(--blueprint-line-strong) 0px, var(--blueprint-line-strong) 1px, transparent 1px, transparent 120px),
    repeating-linear-gradient(90deg, var(--blueprint-line-strong) 0px, var(--blueprint-line-strong) 1px, transparent 1px, transparent 120px);
  color: var(--ink);
  font-family: 'Inter', system-ui, sans-serif;
  min-height: 100vh;
}
button, input, textarea, select { font-family: inherit; }
a { color: inherit; text-decoration: none; }
button { cursor: pointer; }

.wrap { max-width: 560px; margin: 0 auto; padding-bottom: 48px; }

/* ---- Header ---- */
.hdr {
  padding: 20px 18px 18px; color: #fff; text-align: center; position: relative;
}
.hdr-eyebrow { font-family: var(--mono); font-size: 11px; letter-spacing: 0.12em; text-transform: uppercase; color: var(--amber); }
.hdr-title { font-family: var(--mono); font-weight: 700; font-size: 21px; margin-top: 6px; }
.hdr-sub { color: rgba(255,255,255,0.65); font-size: 12.5px; margin-top: 6px; line-height: 1.5; }
.hdr-back {
  position: absolute; left: 14px; top: 18px; font-family: var(--mono); font-size: 12px;
  color: var(--amber); background: none; border: 1px solid var(--amber-dark); border-radius: 6px; padding: 6px 10px;
}

/* ---- XP strip ---- */
.xp-strip {
  margin: 0 16px; background: rgba(255,255,255,0.06); border: 1px dashed var(--blueprint-line-strong);
  border-radius: 10px; padding: 12px 14px; color: #fff;
}
.xp-row { display: flex; justify-content: space-between; align-items: baseline; font-family: var(--mono); font-size: 11.5px; letter-spacing: .03em; }
.xp-row .lvl { color: var(--amber); font-weight: 700; }
.xp-track { height: 8px; background: rgba(255,255,255,0.15); border-radius: 5px; overflow: hidden; margin-top: 8px; }
.xp-fill { height: 100%; background: linear-gradient(90deg, var(--amber), #fff); border-radius: 5px; transition: width .4s ease; }

/* ---- Sections / cards ---- */
.section { padding: 16px 16px 0; }
.section-label {
  font-family: var(--mono); font-size: 11px; font-weight: 700; letter-spacing: 0.1em;
  text-transform: uppercase; color: var(--amber); margin-bottom: 10px;
}
.folder-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
.folder-card {
  background: var(--card); border-radius: 12px; padding: 16px 14px; text-align: left;
  border: 1px solid rgba(0,0,0,0.06); box-shadow: 0 3px 10px rgba(0,0,0,0.18);
}
.folder-emoji { font-size: 24px; }
.folder-name { font-family: var(--mono); font-weight: 700; font-size: 13.5px; color: var(--teal); margin-top: 8px; line-height: 1.3; }
.folder-count { font-size: 11px; color: var(--ink-soft); margin-top: 4px; }
.folder-progress { height: 5px; background: var(--bg); border-radius: 4px; margin-top: 8px; overflow: hidden; }
.folder-progress-fill { height: 100%; background: var(--success); border-radius: 4px; }

.model-card {
  background: var(--card); border-radius: 10px; padding: 14px; margin-bottom: 10px;
  border: 1px solid rgba(0,0,0,0.06); box-shadow: 0 2px 8px rgba(0,0,0,0.12);
  display: flex; align-items: center; gap: 12px; text-align: left; width: 100%;
}
.model-emoji {
  font-size: 22px; width: 40px; height: 40px; flex-shrink: 0; display: flex; align-items: center; justify-content: center;
  background: var(--bg); border-radius: 8px; border: 1px dashed var(--amber-dark);
}
.model-info { flex: 1; min-width: 0; }
.model-name { font-family: var(--mono); font-weight: 700; font-size: 14px; color: var(--teal); }
.model-level { font-size: 11px; color: var(--ink-soft); margin-top: 2px; }
.model-check { font-size: 18px; color: var(--success); flex-shrink: 0; }

/* ---- Run screen: step stepper ---- */
.stepper { display: flex; gap: 4px; padding: 0 16px; margin-top: 4px; }
.stepper .dot { flex: 1; height: 4px; border-radius: 3px; background: rgba(255,255,255,0.15); }
.stepper .dot.done { background: var(--success); }
.stepper .dot.active { background: var(--amber); }

.run-card {
  background: var(--card); border-radius: 12px; padding: 18px; margin: 14px 16px 0;
  box-shadow: 0 4px 16px rgba(0,0,0,0.22);
}
.step-eyebrow { font-family: var(--mono); font-size: 11px; font-weight: 700; letter-spacing: .1em; text-transform: uppercase; color: var(--amber-dark); }
.step-title { font-family: var(--mono); font-weight: 700; font-size: 17px; color: var(--teal); margin-top: 4px; }
.step-body { font-size: 14px; line-height: 1.55; color: var(--ink); margin-top: 10px; }

.chip-row { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 12px; }
.chip {
  font-family: var(--mono); font-size: 12.5px; padding: 8px 12px; border-radius: 20px;
  border: 1.5px solid var(--teal); background: #fff; color: var(--teal);
}
.chip.selected { background: var(--teal); color: #fff; }
.chip:disabled { opacity: 0.35; }
.chip { display: inline-flex; align-items: center; }

.boss-panel { margin-top: 14px; background: var(--teal); border-radius: 10px; padding: 14px; border: 2px dashed var(--coral); }
.boss-title { font-family: var(--mono); font-weight: 700; font-size: 14px; color: var(--amber); }
.boss-desc { font-size: 12px; color: rgba(255,255,255,0.8); margin: 6px 0 12px; line-height: 1.5; }
.hint-box { margin-top: 10px; border-radius: 10px; overflow: hidden; border: 1.5px dashed var(--amber-dark); }
.hint-box svg { width: 100%; display: block; }
.hint-label { font-family: var(--mono); font-size: 10px; letter-spacing: .08em; text-transform: uppercase; color: var(--amber-dark); background: var(--nudge-bg); padding: 5px 8px; }

table.dtable { width: 100%; border-collapse: collapse; margin-top: 12px; font-size: 13.5px; }
table.dtable th { font-family: var(--mono); font-size: 10.5px; text-transform: uppercase; letter-spacing: .06em; color: var(--ink-soft); text-align: left; padding: 6px 8px; border-bottom: 2px solid var(--teal); }
table.dtable td { padding: 8px; border-bottom: 1px solid rgba(0,0,0,0.08); }
table.dtable input {
  width: 100%; padding: 7px 8px; border-radius: 6px; border: 1.5px solid var(--amber-dark);
  font-family: var(--mono); font-size: 13px; background: var(--nudge-bg);
}

canvas.pad { width: 100%; touch-action: none; border-radius: 10px; border: 1.5px dashed var(--amber-dark); background: repeating-linear-gradient(0deg, rgba(14,42,69,0.05) 0, rgba(14,42,69,0.05) 1px, transparent 1px, transparent 20px), repeating-linear-gradient(90deg, rgba(14,42,69,0.05) 0, rgba(14,42,69,0.05) 1px, transparent 1px, transparent 20px), #fff; display: block; margin-top: 10px; }
.pad-tools { display: flex; gap: 8px; margin-top: 8px; }

.mc-row { display: flex; flex-direction: column; gap: 8px; margin-top: 12px; }
.mc-btn { text-align: left; padding: 11px 13px; border-radius: 8px; border: 1.5px solid rgba(14,42,69,0.2); background: #fff; font-size: 13.5px; color: var(--ink); }
.mc-btn.selected { border-color: var(--teal); background: var(--bg); font-weight: 600; }

textarea.freetext, input.freetext {
  width: 100%; margin-top: 12px; padding: 10px 12px; border-radius: 8px; border: 1.5px solid rgba(14,42,69,0.2);
  font-size: 13.5px; font-family: inherit; resize: vertical;
}

.feedback { margin-top: 12px; padding: 10px 12px; border-radius: 8px; font-size: 12.5px; display: none; }
.feedback.show { display: block; }
.feedback.ok { background: var(--success-bg); color: #1e5c40; border: 1px solid rgba(63,163,122,0.3); }
.feedback.warn { background: var(--nudge-bg); color: var(--nudge-ink); border: 1px dashed var(--amber-dark); }

.stamp {
  display: none; font-family: var(--mono); font-weight: 700; font-size: 12px; letter-spacing: .08em;
  color: var(--success); border: 2px solid var(--success); border-radius: 6px; padding: 5px 10px;
  transform: rotate(-4deg); margin-top: 10px; text-align: center; width: fit-content;
}
.stamp.show { display: block; }

.run-actions { display: flex; gap: 10px; margin-top: 16px; }
.btn { flex: 1; padding: 12px; border-radius: 8px; font-weight: 700; font-size: 13.5px; border: 2px solid var(--teal); background: transparent; color: var(--teal); text-align: center; }
.btn.primary { background: var(--teal); color: #fff; }
.btn.amber { border-color: var(--amber-dark); background: var(--amber); color: var(--teal-dark); }
.btn:disabled { opacity: 0.4; }

.complete-wrap { text-align: center; padding: 28px 18px; }
.complete-emoji { font-size: 44px; }
.complete-title { font-family: var(--mono); font-weight: 700; font-size: 19px; color: var(--teal); margin-top: 10px; }
.complete-xp { font-family: var(--mono); font-size: 13px; color: var(--amber-dark); margin-top: 6px; }

.foot-note { margin: 22px 16px 0; font-size: 11px; color: rgba(255,255,255,0.5); text-align: center; line-height: 1.6; }
</style>
</head>
<body>
<div id="app" class="wrap"></div>

  // ---- State ----
  function loadState() {
    var raw = null;
    try { raw = localStorage.getItem(STORAGE_KEY); } catch (e) { storageOk = false; }
    if (!raw) return { totalXp: 0, models: {} };
    try {
      var parsed = JSON.parse(raw);
      return { totalXp: parsed.totalXp || 0, models: parsed.models || {} };
    } catch (e) { return { totalXp: 0, models: {} }; }
  }
  function saveState() {
    try { localStorage.setItem(STORAGE_KEY, JSON.stringify(state)); } catch (e) { storageOk = false; }
  }
  var state = loadState();

  function levelInfo(xp) {
    var current = LEVELS[0], next = null;
    for (var i = 0; i < LEVELS.length; i++) {
      if (xp >= LEVELS[i].min) current = LEVELS[i];
      if (xp < LEVELS[i].min) { next = LEVELS[i]; break; }
    }
    var pct = next ? Math.round(((xp - current.min) / (next.min - current.min)) * 100) : 100;
    return { name: current.name, next: next, pct: pct };
  }

  function modelProgress(id) {
    var m = state.models[id];
    if (!m) return { doneSteps: [], xp: 0, complete: false };
    return m;
  }
  function moduleModels(moduleId) { return MODELS.filter(function (m) { return m.moduleId === moduleId; }); }
  function moduleCompleteCount(moduleId) {
    return moduleModels(moduleId).filter(function (m) { return modelProgress(m.id).complete; }).length;
  }

  // ---- Router ----
  var route = { view: "home", moduleId: null, modelId: null, stepIdx: 0 };
  var runtime = {}; // scratch data for the active run screen (canvas state, selections, attempts)

  function go(view, opts) {
    route = Object.assign({ view: view, moduleId: null, modelId: null, stepIdx: 0 }, opts || {});
    render();
    window.scrollTo(0, 0);
  }

  var app = document.getElementById("app");
  function render() {
    if (route.view === "home") renderHome();
    else if (route.view === "module") renderModuleView();
    else if (route.view === "run") renderRun();
  }

  function xpStripHtml() {
    var li = levelInfo(state.totalXp);
    return '<div class="xp-strip"><div class="xp-row"><span class="lvl">' + li.name + '</span>' +
      '<span>' + state.totalXp + ' XP' + (li.next ? " · next: " + li.next.name : " · max level") + '</span></div>' +
      '<div class="xp-track"><div class="xp-fill" style="width:' + li.pct + '%"></div></div></div>';
  }

  function renderHome() {
    var folders = MODULES.map(function (mod) {
      var total = moduleModels(mod.id).length;
      var done = moduleCompleteCount(mod.id);
      var pct = total ? Math.round((done / total) * 100) : 0;
      return '<button class="folder-card" data-mod="' + mod.id + '">' +
        '<div class="folder-emoji">' + mod.emoji + '</div>' +
        '<div class="folder-name">' + mod.name + '<br><span style="color:var(--ink-soft);font-weight:400;font-size:11px;">' + mod.sub + '</span></div>' +
        '<div class="folder-count">' + done + ' / ' + total + ' models</div>' +
        '<div class="folder-progress"><div class="folder-progress-fill" style="width:' + pct + '%"></div></div>' +
        '</button>';
    }).join("");

    app.innerHTML =
      '<div class="hdr"><a class="hdr-back" href="index.html" style="text-decoration:none;display:inline-block;">← Academy</a>' +
      '<div class="hdr-eyebrow">RMS Design Files · Drafting Room</div>' +
      '<div class="hdr-title">📐 The Drafting Room</div>' +
      '<div class="hdr-sub">Every model starts with a blank page. Pick a folder and get sketching.</div></div>' +
      '<div class="section">' + xpStripHtml() + '</div>' +
      '<div class="section"><div class="section-label">🗂️ Blueprint Folders</div><div class="folder-grid">' + folders + '</div></div>' +
      '<div class="foot-note">22 models across 7 folders — a growing library. Progress is saved on this device.<br>Part of J.J.\'s Engineering Academy.</div>';

    Array.prototype.forEach.call(app.querySelectorAll("[data-mod]"), function (btn) {
      btn.addEventListener("click", function () { go("module", { moduleId: btn.getAttribute("data-mod") }); });
    });
  }

  function renderModuleView() {
    var mod = MODULES.filter(function (m) { return m.id === route.moduleId; })[0];
    var models = moduleModels(mod.id);
    var cards = models.map(function (m) {
      var prog = modelProgress(m.id);
      return '<button class="model-card" data-model="' + m.id + '">' +
        '<div class="model-emoji">' + m.emoji + '</div>' +
        '<div class="model-info"><div class="model-name">' + m.name + '</div>' +
        '<div class="model-level">' + m.level + (prog.doneSteps && prog.doneSteps.length && !prog.complete ? " · in progress" : "") + '</div></div>' +
        '<div class="model-check">' + (prog.complete ? "✓" : "") + '</div></button>';
    }).join("");

    app.innerHTML =
      '<div class="hdr"><button class="hdr-back" id="btn-home">← Folders</button>' +
      '<div class="hdr-eyebrow">' + mod.sub + '</div>' +
      '<div class="hdr-title">' + mod.emoji + ' ' + mod.name + '</div></div>' +
      '<div class="section"><div class="section-label">📄 Models in this folder</div>' + cards + '</div>' +
      '<div class="foot-note">More models are added to each folder over time — same app, no update needed.</div>';

    document.getElementById("btn-home").addEventListener("click", function () { go("home"); });
    Array.prototype.forEach.call(app.querySelectorAll("[data-model]"), function (btn) {
      btn.addEventListener("click", function () {
        go("run", { moduleId: mod.id, modelId: btn.getAttribute("data-model"), stepIdx: 0 });
      });
    });
  }

  // ---- Run screen ----
  function renderRun() {
    var model = MODELS.filter(function (m) { return m.id === route.modelId; })[0];
    var stepKey = STEP_ORDER[route.stepIdx];
    var prog = modelProgress(model.id);

    if (route.stepIdx >= STEP_ORDER.length) { renderComplete(model); return; }

    runtime.attempts = runtime.attempts || 0;
    if (runtime.stepKeyLoaded !== stepKey || runtime.modelIdLoaded !== model.id) {
      runtime = { attempts: 0, stepKeyLoaded: stepKey, modelIdLoaded: model.id };
    }

    var dots = STEP_ORDER.map(function (k, i) {
      var cls = "dot" + (i < route.stepIdx ? " done" : i === route.stepIdx ? " active" : "");
      return '<div class="' + cls + '"></div>';
    }).join("");

    app.innerHTML =
      '<div class="hdr"><button class="hdr-back" id="btn-out">← Exit</button>' +
      '<div class="hdr-eyebrow">' + model.level + '</div>' +
      '<div class="hdr-title">' + model.emoji + ' ' + model.name + '</div></div>' +
      '<div class="stepper">' + dots + '</div>' +
      '<div class="run-card" id="run-card"></div>';

    document.getElementById("btn-out").addEventListener("click", function () { go("module", { moduleId: model.moduleId }); });

    var card = document.getElementById("run-card");
    var stepFns = { observe: stepObserve, sketch: stepSketch, variables: stepVariables, table: stepTable, graph: stepGraph, pattern: stepPattern, predict: stepPredict, explain: stepExplain };
    stepFns[stepKey](card, model);
  }

  function stepHeader(stepKey, extra) {
    return '<div class="step-eyebrow">Step ' + (STEP_ORDER.indexOf(stepKey) + 1) + ' of ' + STEP_ORDER.length + '</div>' +
      '<div class="step-title">' + STEP_LABEL[stepKey] + '</div>' + (extra || "");
  }

  function actionsHtml(checkLabel, checkId, nextEnabled) {
    return '<div class="feedback" id="fb"></div><div class="stamp" id="stamp">✓ VERIFIED — LOGGED</div>' +
      '<div class="run-actions">' +
      '<button class="btn" id="' + checkId + '">' + checkLabel + '</button>' +
      '<button class="btn primary" id="btn-next" ' + (nextEnabled ? "" : "disabled") + '>Next →</button>' +
      '</div>';
  }

  function completeStep(model, stepKey, xpAward) {
    var m = state.models[model.id] || { doneSteps: [], xp: 0, complete: false };
    if (m.doneSteps.indexOf(stepKey) === -1) {
      m.doneSteps.push(stepKey);
      m.xp = (m.xp || 0) + xpAward;
      state.totalXp += xpAward;
    }
    state.models[model.id] = m;
    saveState();
    var stamp = document.getElementById("stamp");
    if (stamp) stamp.classList.add("show");
    var nextBtn = document.getElementById("btn-next");
    if (nextBtn) nextBtn.disabled = false;
  }

  function showFeedback(msg, kind) {
    var fb = document.getElementById("fb");
    fb.textContent = msg;
    fb.className = "feedback show " + kind;
  }

  function wireNext(model) {
    document.getElementById("btn-next").addEventListener("click", function () {
      go("run", { moduleId: model.moduleId, modelId: model.id, stepIdx: route.stepIdx + 1 });
    });
  }

  // -- Observe --
  function stepObserve(card, model) {
    card.innerHTML = stepHeader("observe") +
      '<div class="step-body">' + model.observe.text + '</div>' +
      '<div class="run-actions"><button class="btn primary" id="btn-next" style="flex:1">I\'ve read it — continue →</button></div>';
    document.getElementById("btn-next").addEventListener("click", function () {
      completeStepSilently(model, "observe", 5);
      go("run", { moduleId: model.moduleId, modelId: model.id, stepIdx: route.stepIdx + 1 });
    });
  }
  function completeStepSilently(model, stepKey, xp) {
    var m = state.models[model.id] || { doneSteps: [], xp: 0, complete: false };
    if (m.doneSteps.indexOf(stepKey) === -1) { m.doneSteps.push(stepKey); m.xp = (m.xp || 0) + xp; state.totalXp += xp; }
    state.models[model.id] = m; saveState();
  }

  // -- Sketch & Label (Phase A: pre-made stamps · Phase B: Boss Level freehand) --
  function nodeIconSvg(shape) {
    var s = '<svg width="18" height="18" viewBox="0 0 20 20" xmlns="http://www.w3.org/2000/svg" style="margin-right:6px;">';
    var st = 'stroke="#0E2A45" stroke-width="2" fill="none"';
    if (shape === "arrow-right") s += '<line x1="2" y1="10" x2="14" y2="10" ' + st + '/><polygon points="15,10 10,6 10,14" fill="#0E2A45"/>';
    else if (shape === "arrow-left") s += '<line x1="18" y1="10" x2="6" y2="10" ' + st + '/><polygon points="5,10 10,6 10,14" fill="#0E2A45"/>';
    else if (shape === "box") s += '<rect x="3" y="5" width="14" height="10" ' + st + '/>';
    else if (shape === "circle") s += '<circle cx="10" cy="10" r="7" ' + st + '/>';
    else if (shape === "bar") s += '<rect x="7" y="2" width="6" height="16" fill="#D9A441"/>';
    else if (shape === "dots") s += '<circle cx="5" cy="6" r="1.5" fill="#0E2A45"/><circle cx="12" cy="9" r="1.5" fill="#0E2A45"/><circle cx="7" cy="14" r="1.5" fill="#0E2A45"/><circle cx="15" cy="14" r="1.5" fill="#0E2A45"/>';
    else if (shape === "line-h") s += '<line x1="2" y1="10" x2="18" y2="10" ' + st + '/>';
    else if (shape === "line-v") s += '<line x1="10" y1="2" x2="10" y2="18" ' + st + '/>';
    else if (shape === "line-diag") s += '<line x1="2" y1="17" x2="18" y2="3" ' + st + '/>';
    else if (shape === "arrow-up") s += '<line x1="10" y1="18" x2="10" y2="6" ' + st + '/><polygon points="10,2 6,8 14,8" fill="#0E2A45"/>';
    else if (shape === "arrow-down") s += '<line x1="10" y1="2" x2="10" y2="14" ' + st + '/><polygon points="10,18 6,12 14,12" fill="#0E2A45"/>';
    else if (shape === "ray") s += '<line x1="10" y1="2" x2="10" y2="7" ' + st + '/><line x1="4" y1="10" x2="9" y2="10" ' + st + '/><line x1="16" y1="10" x2="11" y2="10" ' + st + '/><circle cx="10" cy="10" r="2" fill="#D9A441"/>';
    s += "</svg>";
    return s;
  }

  function drawStamp(ctx, shape, x, y) {
    ctx.save();
    ctx.strokeStyle = "#0E2A45"; ctx.fillStyle = "#0E2A45"; ctx.lineWidth = 2.5;
    if (shape === "arrow-right" || shape === "arrow-left") {
      var dir = shape === "arrow-right" ? 1 : -1;
      ctx.beginPath(); ctx.moveTo(x - 16 * dir, y); ctx.lineTo(x + 12 * dir, y); ctx.stroke();
      ctx.beginPath(); ctx.moveTo(x + 16 * dir, y); ctx.lineTo(x + 6 * dir, y - 6); ctx.lineTo(x + 6 * dir, y + 6); ctx.closePath(); ctx.fill();
    } else if (shape === "box") {
      ctx.strokeRect(x - 20, y - 14, 40, 28);
    } else if (shape === "circle") {
      ctx.beginPath(); ctx.arc(x, y, 15, 0, Math.PI * 2); ctx.stroke();
    } else if (shape === "bar") {
      ctx.fillStyle = "#D9A441"; ctx.fillRect(x - 8, y - 22, 16, 44);
    } else if (shape === "dots") {
      ctx.fillStyle = "#0E2A45";
      [[-10, -8], [6, -4], [-4, 8], [10, 10], [0, 0]].forEach(function (d) { ctx.beginPath(); ctx.arc(x + d[0], y + d[1], 2.2, 0, Math.PI * 2); ctx.fill(); });
    } else if (shape === "line-h") {
      ctx.beginPath(); ctx.moveTo(x - 18, y); ctx.lineTo(x + 18, y); ctx.stroke();
    } else if (shape === "line-v") {
      ctx.beginPath(); ctx.moveTo(x, y - 18); ctx.lineTo(x, y + 18); ctx.stroke();
    } else if (shape === "line-diag") {
      ctx.beginPath(); ctx.moveTo(x - 16, y + 14); ctx.lineTo(x + 16, y - 14); ctx.stroke();
    } else if (shape === "arrow-up" || shape === "arrow-down") {
      var vdir = shape === "arrow-down" ? 1 : -1;
      ctx.beginPath(); ctx.moveTo(x, y - 16 * vdir); ctx.lineTo(x, y + 12 * vdir); ctx.stroke();
      ctx.beginPath(); ctx.moveTo(x, y + 16 * vdir); ctx.lineTo(x - 6, y + 6 * vdir); ctx.lineTo(x + 6, y + 6 * vdir); ctx.closePath(); ctx.fill();
    } else if (shape === "ray") {
      ctx.fillStyle = "#D9A441"; ctx.beginPath(); ctx.arc(x, y, 5, 0, Math.PI * 2); ctx.fill();
      [0, 45, 90, 135, 180, 225, 270, 315].forEach(function (deg) {
        var rad = deg * Math.PI / 180;
        ctx.beginPath(); ctx.moveTo(x + Math.cos(rad) * 8, y + Math.sin(rad) * 8); ctx.lineTo(x + Math.cos(rad) * 14, y + Math.sin(rad) * 14); ctx.stroke();
      });
    }
    ctx.restore();
  }

  function stepSketch(card, model) {
    runtime.phase = runtime.phase || "guided";
    if (runtime.phase === "boss") { stepSketchBoss(card, model); return; }

    var nodes = model.sketch.nodes;
    var mProg = state.models[model.id];
    var alreadyPassed = !!(mProg && mProg.doneSteps && mProg.doneSteps.indexOf("sketch") !== -1);
    runtime.placed = runtime.placed || [];
    runtime.pendingNode = runtime.pendingNode || null;
    runtime.hintVisible = runtime.hintVisible || false;

    card.innerHTML = stepHeader("sketch") +
      '<div class="step-body">' + model.sketch.prompt + ' Tap a stamp below, then tap the canvas to drop it in the right spot — position matters, so think about where each one really belongs. Draw freehand with your finger anywhere else.</div>' +
      '<div class="run-actions" style="margin:10px 0 0;"><button class="btn" id="btn-hint" style="flex:none;padding:8px 12px;font-size:12px;">👁 Peek Hint</button></div>' +
      '<div class="hint-box" id="hint-box"></div>' +
      '<canvas class="pad" id="pad" height="220"></canvas>' +
      '<div class="pad-tools"><button class="btn" id="btn-clear" style="flex:none;padding:8px 12px;font-size:12px;">Clear sketch</button></div>' +
      '<div class="chip-row" id="labels"></div>' +
      actionsHtml("Check placement", "btn-check", alreadyPassed) +
      '<div id="boss-unlock"></div>';

    document.getElementById("btn-hint").addEventListener("click", function () {
      runtime.hintVisible = !runtime.hintVisible;
      document.getElementById("hint-box").innerHTML = runtime.hintVisible ? ('<div class="hint-label">Hint — reference sketch</div>' + model.sketch.hint) : "";
      document.getElementById("btn-hint").textContent = runtime.hintVisible ? "🙈 Hide Hint" : "👁 Peek Hint";
    });
    if (runtime.hintVisible) {
      document.getElementById("hint-box").innerHTML = '<div class="hint-label">Hint — reference sketch</div>' + model.sketch.hint;
      document.getElementById("btn-hint").textContent = "🙈 Hide Hint";
    }

    var canvas = document.getElementById("pad");
    canvas.width = canvas.clientWidth || 500;
    var ctx = canvas.getContext("2d");
    var drawing = false, lastX = 0, lastY = 0;

    function pos(e) {
      var r = canvas.getBoundingClientRect();
      var t = e.touches && e.touches[0] ? e.touches[0] : e;
      return { x: t.clientX - r.left, y: t.clientY - r.top };
    }
    function redrawStamps() {
      runtime.placed.forEach(function (p) {
        drawStamp(ctx, p.shape, p.x, p.y);
        ctx.font = "10px monospace"; ctx.fillStyle = "#5B6B78";
        ctx.fillText(p.text, p.x + 12, p.y + 22);
      });
    }
    function start(e) {
      var p = pos(e);
      if (runtime.pendingNode) {
        runtime.placed.push({ x: p.x, y: p.y, text: runtime.pendingNode.label, shape: runtime.pendingNode.shape, target: runtime.pendingNode.target });
        var chip = document.querySelector('[data-label="' + runtime.pendingNode.label + '"]');
        if (chip) chip.disabled = true;
        runtime.pendingNode = null;
        renderChips();
        redrawStamps();
        return;
      }
      drawing = true; lastX = p.x; lastY = p.y;
    }
    function move(e) {
      if (!drawing) return;
      e.preventDefault();
      var p = pos(e);
      ctx.strokeStyle = "#16293A"; ctx.lineWidth = 2; ctx.lineCap = "round";
      ctx.beginPath(); ctx.moveTo(lastX, lastY); ctx.lineTo(p.x, p.y); ctx.stroke();
      lastX = p.x; lastY = p.y;
    }
    function end() { drawing = false; }
    canvas.addEventListener("mousedown", start); canvas.addEventListener("mousemove", move); window.addEventListener("mouseup", end);
    canvas.addEventListener("touchstart", start); canvas.addEventListener("touchmove", move); canvas.addEventListener("touchend", end);

    document.getElementById("btn-clear").addEventListener("click", function () {
      ctx.clearRect(0, 0, canvas.width, canvas.height);
      runtime.placed = [];
      renderChips();
    });

    function renderChips() {
      var used = runtime.placed.map(function (p) { return p.text; });
      document.getElementById("labels").innerHTML = nodes.map(function (n) {
        var isUsed = used.indexOf(n.label) !== -1;
        var isPending = runtime.pendingNode && runtime.pendingNode.label === n.label;
        return '<button class="chip' + (isPending ? " selected" : "") + '" data-label="' + n.label + '" ' + (isUsed ? "disabled" : "") + '>' + nodeIconSvg(n.shape) + n.label + '</button>';
      }).join("");
      Array.prototype.forEach.call(document.querySelectorAll("[data-label]"), function (btn) {
        btn.addEventListener("click", function () {
          var lbl = btn.getAttribute("data-label");
          runtime.pendingNode = nodes.filter(function (n) { return n.label === lbl; })[0];
          renderChips();
        });
      });
    }
    renderChips();
    redrawStamps();

    function renderBossUnlock() {
      document.getElementById("boss-unlock").innerHTML =
        '<div class="boss-panel"><div class="boss-title">⚔️ Boss Level Unlocked</div>' +
        '<div class="boss-desc">Same model, no stamps this time — draw it completely freehand from memory. Peek the hint if you get stuck. Bonus XP for finishing.</div>' +
        '<button class="btn amber" id="btn-boss" style="width:100%;">Enter Boss Level →</button></div>';
      document.getElementById("btn-boss").addEventListener("click", function () {
        runtime.phase = "boss";
        renderRun();
      });
    }
    if (alreadyPassed) renderBossUnlock();

    document.getElementById("btn-check").addEventListener("click", function () {
      if (runtime.placed.length < nodes.length) {
        showFeedback("Place all " + nodes.length + " stamps on your sketch first (" + runtime.placed.length + "/" + nodes.length + " so far).", "warn");
        return;
      }
      var wrong = [];
      runtime.placed.forEach(function (p) {
        if (!p.target) return;
        var tx = p.target.x * canvas.width, ty = p.target.y * canvas.height;
        var tolX = canvas.width * 0.20, tolY = canvas.height * 0.26;
        if (Math.abs(p.x - tx) > tolX || Math.abs(p.y - ty) > tolY) wrong.push(p.text);
      });
      if (wrong.length === 0) {
        showFeedback("Every stamp is placed and connected correctly. Nice work.", "ok");
        completeStep(model, "sketch", 10);
        renderBossUnlock();
      } else {
        showFeedback("Not quite connected yet — these aren't in the right spot: " + wrong.join(", ") + ". Tap Clear Sketch and try placing them again, thinking about how they relate to each other.", "warn");
      }
    });
    wireNext(model);
  }

  function stepSketchBoss(card, model) {
    var mProg = state.models[model.id];
    var bossAlready = !!(mProg && mProg.doneSteps && mProg.doneSteps.indexOf("sketch-boss") !== -1);
    runtime.bossDrawn = runtime.bossDrawn || bossAlready;
    runtime.hintVisible = runtime.hintVisible || false;
    runtime.inkCount = runtime.inkCount || 0;

    card.innerHTML = stepHeader("sketch", ' <span style="font-family:var(--mono);font-size:11px;color:var(--coral);letter-spacing:.06em;">· BOSS LEVEL ⚔️</span>') +
      '<div class="step-body">No stamps this time — sketch and label the whole thing freehand, from memory.</div>' +
      '<div class="run-actions" style="margin:10px 0 0;">' +
      '<button class="btn" id="btn-hint" style="flex:none;padding:8px 12px;font-size:12px;">👁 Peek Hint</button>' +
      '<button class="btn" id="btn-back-guided" style="flex:none;padding:8px 12px;font-size:12px;">← Back to stamps</button>' +
      '</div>' +
      '<div class="hint-box" id="hint-box"></div>' +
      '<canvas class="pad" id="bpad" height="220"></canvas>' +
      '<div class="pad-tools"><button class="btn" id="btn-clear" style="flex:none;padding:8px 12px;font-size:12px;">Clear sketch</button></div>' +
      actionsHtml("Mark boss sketch complete", "btn-check", bossAlready);

    var canvas = document.getElementById("bpad");
    canvas.width = canvas.clientWidth || 500;
    var ctx = canvas.getContext("2d");
    var drawing = false, lastX = 0, lastY = 0;

    function pos(e) {
      var r = canvas.getBoundingClientRect();
      var t = e.touches && e.touches[0] ? e.touches[0] : e;
      return { x: t.clientX - r.left, y: t.clientY - r.top };
    }
    function start(e) { drawing = true; var p = pos(e); lastX = p.x; lastY = p.y; }
    function move(e) {
      if (!drawing) return;
      e.preventDefault();
      var p = pos(e);
      ctx.strokeStyle = "#16293A"; ctx.lineWidth = 2; ctx.lineCap = "round";
      ctx.beginPath(); ctx.moveTo(lastX, lastY); ctx.lineTo(p.x, p.y); ctx.stroke();
      lastX = p.x; lastY = p.y;
      runtime.inkCount++;
      runtime.bossDrawn = runtime.inkCount > 15;
    }
    function end() { drawing = false; }
    canvas.addEventListener("mousedown", start); canvas.addEventListener("mousemove", move); window.addEventListener("mouseup", end);
    canvas.addEventListener("touchstart", start); canvas.addEventListener("touchmove", move); canvas.addEventListener("touchend", end);

    document.getElementById("btn-clear").addEventListener("click", function () {
      ctx.clearRect(0, 0, canvas.width, canvas.height);
      runtime.inkCount = 0; runtime.bossDrawn = false;
    });

    document.getElementById("btn-hint").addEventListener("click", function () {
      runtime.hintVisible = !runtime.hintVisible;
      document.getElementById("hint-box").innerHTML = runtime.hintVisible ? ('<div class="hint-label">Hint — reference sketch</div>' + model.sketch.hint) : "";
      document.getElementById("btn-hint").textContent = runtime.hintVisible ? "🙈 Hide Hint" : "👁 Peek Hint";
    });

    document.getElementById("btn-back-guided").addEventListener("click", function () {
      runtime.phase = "guided";
      renderRun();
    });

    document.getElementById("btn-check").addEventListener("click", function () {
      if (!runtime.bossDrawn) { showFeedback("Draw a bit more before marking it complete — give the boss level a real attempt.", "warn"); return; }
      showFeedback("Boss level cleared! Bonus XP logged.", "ok");
      completeStep(model, "sketch-boss", 15);
    });
    wireNext(model);
  }

  // -- Variables --
  function stepVariables(card, model) {
    runtime.selected = runtime.selected || [];
    card.innerHTML = stepHeader("variables") +
      '<div class="step-body">Tap every variable from the observation that actually matters here.</div>' +
      '<div class="chip-row" id="vchips"></div>' +
      actionsHtml("Check my selection", "btn-check");

    function renderChips() {
      document.getElementById("vchips").innerHTML = model.variables.options.map(function (o) {
        var sel = runtime.selected.indexOf(o) !== -1;
        return '<button class="chip' + (sel ? " selected" : "") + '" data-opt="' + o + '">' + o + '</button>';
      }).join("");
      Array.prototype.forEach.call(document.querySelectorAll("[data-opt]"), function (btn) {
        btn.addEventListener("click", function () {
          var v = btn.getAttribute("data-opt");
          var i = runtime.selected.indexOf(v);
          if (i === -1) runtime.selected.push(v); else runtime.selected.splice(i, 1);
          renderChips();
        });
      });
    }
    renderChips();

    document.getElementById("btn-check").addEventListener("click", function () {
      runtime.attempts++;
      var correct = model.variables.correct;
      var match = correct.length === runtime.selected.length && correct.every(function (c) { return runtime.selected.indexOf(c) !== -1; });
      if (match) {
        showFeedback("Exactly right — those are the variables that matter.", "ok");
        completeStep(model, "variables", 10);
      } else if (runtime.attempts >= 2) {
        showFeedback("The variables that matter: " + correct.join(", ") + ".", "warn");
        completeStep(model, "variables", 3);
      } else {
        showFeedback("Not quite — look again at what actually changes or affects the outcome.", "warn");
      }
    });
    wireNext(model);
  }

  // -- Table --
  function stepTable(card, model) {
    var rowsHtml = model.table.rows.map(function (row, ri) {
      return "<tr>" + row.map(function (cell, ci) {
        if (cell && typeof cell === "object" && cell.blank) {
          return '<td><input data-r="' + ri + '" data-c="' + ci + '" placeholder="?" /></td>';
        }
        return "<td>" + cell + "</td>";
      }).join("") + "</tr>";
    }).join("");

    card.innerHTML = stepHeader("table") +
      '<div class="step-body">Fill in the missing value(s) in the table below.</div>' +
      '<table class="dtable"><thead><tr>' + model.table.columns.map(function (c) { return "<th>" + c + "</th>"; }).join("") + '</tr></thead><tbody>' + rowsHtml + '</tbody></table>' +
      actionsHtml("Check table", "btn-check");

    document.getElementById("btn-check").addEventListener("click", function () {
      runtime.attempts++;
      var ok = true;
      Array.prototype.forEach.call(card.querySelectorAll("input"), function (inp) {
        var ri = +inp.getAttribute("data-r"), ci = +inp.getAttribute("data-c");
        var expected = model.table.rows[ri][ci].answer;
        var given = inp.value.trim();
        var same = given.toLowerCase() === String(expected).toLowerCase();
        inp.style.borderColor = same ? "#3FA37A" : "#C0392B";
        if (!same) ok = false;
      });
      if (ok) { showFeedback("Table complete and correct.", "ok"); completeStep(model, "table", 10); }
      else if (runtime.attempts >= 2) {
        Array.prototype.forEach.call(card.querySelectorAll("input"), function (inp) {
          var ri = +inp.getAttribute("data-r"), ci = +inp.getAttribute("data-c");
          inp.value = model.table.rows[ri][ci].answer;
          inp.style.borderColor = "#3FA37A";
        });
        showFeedback("Here's the completed table — take a look before moving on.", "warn");
        completeStep(model, "table", 3);
      } else showFeedback("One or more values aren't right yet — check the pattern in the other rows.", "warn");
    });
    wireNext(model);
  }

  // -- Graph --
  function stepGraph(card, model) {
    var g = model.graph;
    runtime.placedPoints = runtime.placedPoints || [];

    card.innerHTML = stepHeader("graph") +
      '<div class="step-body">Tap the grid to plot each point from the table (' + g.xLabel + ' vs. ' + g.yLabel + '). Plot ' + g.points.length + ' points.</div>' +
      '<canvas class="pad" id="gpad" height="240"></canvas>' +
      '<div class="pad-tools"><button class="btn" id="btn-clear" style="flex:none;padding:8px 12px;font-size:12px;">Clear points</button></div>' +
      actionsHtml("Check graph", "btn-check");

    var canvas = document.getElementById("gpad");
    canvas.width = canvas.clientWidth || 500;
    var ctx = canvas.getContext("2d");
    var padL = 40, padB = 26, padT = 10, padR = 10;

    function toPx(x, y) {
      var w = canvas.width - padL - padR, h = canvas.height - padT - padB;
      return { x: padL + (x / g.xMax) * w, y: canvas.height - padB - (y / g.yMax) * h };
    }
    function toData(px, py) {
      var w = canvas.width - padL - padR, h = canvas.height - padT - padB;
      return { x: ((px - padL) / w) * g.xMax, y: ((canvas.height - padB - py) / h) * g.yMax };
    }
    function drawAxes() {
      ctx.clearRect(0, 0, canvas.width, canvas.height);
      ctx.strokeStyle = "#16293A"; ctx.lineWidth = 1.5;
      ctx.beginPath();
      ctx.moveTo(padL, padT); ctx.lineTo(padL, canvas.height - padB); ctx.lineTo(canvas.width - padR, canvas.height - padB);
      ctx.stroke();
      ctx.fillStyle = "#5B6B78"; ctx.font = "10px monospace";
      ctx.fillText(g.xLabel, padL, canvas.height - 6);
      ctx.save(); ctx.translate(10, canvas.height / 2); ctx.rotate(-Math.PI / 2); ctx.fillText(g.yLabel, 0, 0); ctx.restore();
    }
    function drawPoints() {
      if (runtime.placedPoints.length > 1) {
        ctx.strokeStyle = "#D9A441"; ctx.lineWidth = 2; ctx.beginPath();
        runtime.placedPoints.forEach(function (p, i) {
          var px = toPx(p.x, p.y);
          if (i === 0) ctx.moveTo(px.x, px.y); else ctx.lineTo(px.x, px.y);
        });
        ctx.stroke();
      }
      runtime.placedPoints.forEach(function (p) {
        var px = toPx(p.x, p.y);
        ctx.fillStyle = "#0E2A45"; ctx.beginPath(); ctx.arc(px.x, px.y, 4, 0, Math.PI * 2); ctx.fill();
      });
    }
    function redraw() { drawAxes(); drawPoints(); }
    redraw();

    canvas.addEventListener("click", function (e) {
      if (runtime.placedPoints.length >= g.points.length) return;
      var r = canvas.getBoundingClientRect();
      var d = toData(e.clientX - r.left, e.clientY - r.top);
      if (d.x < 0 || d.y < 0) return;
      runtime.placedPoints.push(d);
      redraw();
    });
    document.getElementById("btn-clear").addEventListener("click", function () { runtime.placedPoints = []; redraw(); });

    document.getElementById("btn-check").addEventListener("click", function () {
      runtime.attempts++;
      if (runtime.placedPoints.length < g.points.length) {
        showFeedback("Plot all " + g.points.length + " points first (" + runtime.placedPoints.length + " so far).", "warn");
        return;
      }
      var tolX = g.xMax * 0.06, tolY = g.yMax * 0.06;
      var matchedCount = 0;
      g.points.forEach(function (ep) {
        var hit = runtime.placedPoints.some(function (pp) { return Math.abs(pp.x - ep[0]) <= tolX && Math.abs(pp.y - ep[1]) <= tolY; });
        if (hit) matchedCount++;
      });
      if (matchedCount === g.points.length) {
        showFeedback("Great plotting — every point lands in the right spot.", "ok");
        completeStep(model, "graph", 10);
      } else if (runtime.attempts >= 2) {
        runtime.placedPoints = g.points.map(function (p) { return { x: p[0], y: p[1] }; });
        redraw();
        showFeedback("Here's the correct plot for reference.", "warn");
        completeStep(model, "graph", 3);
      } else {
        showFeedback(matchedCount + "/" + g.points.length + " points are in the right place — adjust and check again.", "warn");
      }
    });
    wireNext(model);
  }

  // -- Pattern --
  function stepPattern(card, model) {
    runtime.pick = runtime.pick == null ? -1 : runtime.pick;
    card.innerHTML = stepHeader("pattern") +
      '<div class="step-body">' + model.pattern.question + '</div>' +
      '<div class="mc-row" id="mc"></div>' +
      actionsHtml("Check answer", "btn-check");

    function renderMc() {
      document.getElementById("mc").innerHTML = model.pattern.options.map(function (o, i) {
        return '<button class="mc-btn' + (runtime.pick === i ? " selected" : "") + '" data-i="' + i + '">' + o + '</button>';
      }).join("");
      Array.prototype.forEach.call(document.querySelectorAll(".mc-btn"), function (btn) {
        btn.addEventListener("click", function () { runtime.pick = +btn.getAttribute("data-i"); renderMc(); });
      });
    }
    renderMc();

    document.getElementById("btn-check").addEventListener("click", function () {
      runtime.attempts++;
      if (runtime.pick === -1) { showFeedback("Pick an option first.", "warn"); return; }
      if (runtime.pick === model.pattern.correct) {
        showFeedback("Correct — that's the pattern.", "ok"); completeStep(model, "pattern", 10);
      } else if (runtime.attempts >= 2) {
        showFeedback("The correct pattern: \u201c" + model.pattern.options[model.pattern.correct] + "\u201d", "warn");
        completeStep(model, "pattern", 3);
      } else showFeedback("Not quite — look at the trend again.", "warn");
    });
    wireNext(model);
  }

  // -- Predict --
  function stepPredict(card, model) {
    card.innerHTML = stepHeader("predict") +
      '<div class="step-body">' + model.predict.question + '</div>' +
      '<input class="freetext" id="pinput" placeholder="Type your prediction…" />' +
      actionsHtml("Check prediction", "btn-check");

    document.getElementById("btn-check").addEventListener("click", function () {
      runtime.attempts++;
      var val = (document.getElementById("pinput").value || "").toLowerCase();
      var hit = model.predict.keywords.some(function (k) { return val.indexOf(k.toLowerCase()) !== -1; });
      if (hit) { showFeedback("That matches — nice prediction.", "ok"); completeStep(model, "predict", 10); }
      else if (runtime.attempts >= 2) {
        showFeedback("A prediction along these lines works: " + model.predict.keywords[0] + ".", "warn");
        completeStep(model, "predict", 3);
      } else showFeedback("Close, but check the trend once more and try again.", "warn");
    });
    wireNext(model);
  }

  // -- Explain --
  function stepExplain(card, model) {
    card.innerHTML = stepHeader("explain") +
      '<div class="step-body">' + model.explain.prompt + '</div>' +
      '<textarea class="freetext" id="einput" rows="4" placeholder="Write your explanation…"></textarea>' +
      actionsHtml("Log entry", "btn-check");

    document.getElementById("btn-check").addEventListener("click", function () {
      var val = (document.getElementById("einput").value || "").trim();
      if (val.length < 5) { showFeedback("Write a sentence or two before logging it.", "warn"); return; }
      showFeedback("Logged in your ship's log.", "ok");
      completeStep(model, "explain", 10);
    });
    wireNext(model);
  }

  function renderComplete(model) {
    var m = state.models[model.id] || { doneSteps: [], xp: 0 };
    m.complete = true;
    state.models[model.id] = m;
    saveState();
    app.innerHTML =
      '<div class="hdr"><button class="hdr-back" id="btn-out">← Exit</button>' +
      '<div class="hdr-eyebrow">Model complete</div><div class="hdr-title">' + model.emoji + ' ' + model.name + '</div></div>' +
      '<div class="run-card complete-wrap">' +
      '<div class="complete-emoji">⚓</div>' +
      '<div class="complete-title">Model logged in the Drafting Room</div>' +
      '<div class="complete-xp">+' + m.xp + ' XP earned on this model</div>' +
      '<div class="run-actions" style="margin-top:20px;">' +
      '<button class="btn" id="btn-folder">Back to folder</button>' +
      '<button class="btn primary" id="btn-again">Practice again</button>' +
      '</div></div>';
    document.getElementById("btn-out").addEventListener("click", function () { go("module", { moduleId: model.moduleId }); });
    document.getElementById("btn-folder").addEventListener("click", function () { go("module", { moduleId: model.moduleId }); });
    document.getElementById("btn-again").addEventListener("click", function () {
      var mm = state.models[model.id]; mm.doneSteps = []; saveState();
      go("run", { moduleId: model.moduleId, modelId: model.id, stepIdx: 0 });
    });
  }

  go("home");
  if (!storageOk) {
    console.warn("localStorage unavailable — progress won't persist in this context.");
  }
})();
</script>
</body>
</html>
