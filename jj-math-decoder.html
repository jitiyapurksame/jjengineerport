      @import url('https://fonts.googleapis.com/css2?family=Space+Mono:wght@400;700&family=Inter:wght@400;500;600;700&display=swap');

      .sb-root {
        --bg: #F1ECDD;
        --card: #FFFFFF;
        --ink: #16293A;
        --ink-soft: #5B6B78;
        --teal: #0E2A45;
        --teal-dark: #081826;
        --amber: #D9A441;
        --amber-dark: #B3822C;
        --coral: #C1503A;
        --success: #3FA37A;
        --success-bg: #E6F5EE;
        --nudge-bg: #FCEFD9;
        --nudge-ink: #8A5A18;
        --stone-empty: #E3DCC7;
        --stone-fill: #D9A441;
        --ratio-a: #4C8CF2;
        --ratio-b: #D9A441;
        --mono: 'Space Mono', 'Courier New', monospace;
        font-family: 'Inter', sans-serif;
        background-color: var(--bg);
        background-image:
          repeating-linear-gradient(0deg, rgba(14,42,69,0.035) 0px, rgba(14,42,69,0.035) 1px, transparent 1px, transparent 28px),
          repeating-linear-gradient(90deg, rgba(14,42,69,0.035) 0px, rgba(14,42,69,0.035) 1px, transparent 1px, transparent 28px);
        color: var(--ink);
        min-height: 100vh;
        display: flex;
        justify-content: center;
        padding: 0;
      }
      .sb-root * { box-sizing: border-box; }
      .sb-root button { font-family: inherit; cursor: pointer; }
      .sb-root button:focus-visible, .sb-root input:focus-visible {
        outline: 3px solid var(--amber); outline-offset: 2px;
      }

      .sb-screen {
        width: 100%; max-width: 480px; min-height: 100vh;
        background: var(--bg); padding: 20px 16px 40px;
        display: flex; flex-direction: column; gap: 16px;
      }
      .sb-loading { padding: 40px; text-align: center; color: var(--ink-soft); }

      /* ---- home hero ---- */
      .sb-hero { text-align: center; padding: 12px 0 4px; background: var(--teal); margin: -20px -16px 4px; padding-top: 20px; padding-bottom: 16px; border-bottom: 3px solid var(--amber); }
      .sb-hero-title {
        font-family: var(--mono); font-weight: 700; font-size: 24px;
        color: #fff; letter-spacing: 0.02em;
      }
      .sb-hero-sub { color: rgba(255,255,255,0.72); font-size: 13px; margin-top: 4px; }
      .sb-hero-chip {
        display: inline-block; margin-top: 10px; background: transparent; color: var(--amber);
        font-size: 11px; font-weight: 700; padding: 5px 12px; border-radius: 4px;
        border: 1px dashed var(--amber); font-family: var(--mono); text-transform: uppercase; letter-spacing: 0.04em;
      }

      .sb-xpbar-card {
        background: var(--card); border-radius: 10px; padding: 14px 16px;
        box-shadow: 0 2px 10px rgba(14,42,69,0.08); border: 1px solid rgba(14,42,69,0.10);
      }
      .sb-xpbar-row { display: flex; justify-content: space-between; font-size: 13px; font-weight: 600; color: var(--teal); margin-bottom: 8px; font-family: var(--mono); }
      .sb-xpbar-track { height: 10px; background: var(--stone-empty); border-radius: 6px; overflow: hidden; }
      .sb-xpbar-fill { height: 100%; background: linear-gradient(90deg, var(--amber), var(--amber-dark)); border-radius: 6px; transition: width 0.4s ease; }
      .sb-trophy-link { margin-top: 10px; background: none; border: none; color: var(--teal); font-weight: 600; font-size: 13px; padding: 0; }

      .sb-continue-btn {
        display: flex; align-items: center; gap: 12px; background: var(--teal); color: white;
        border: 2px dashed var(--amber); border-radius: 10px; padding: 16px; text-align: left;
        box-shadow: 0 4px 14px rgba(14,42,69,0.25);
      }
      .sb-continue-emoji { font-size: 32px; }
      .sb-continue-label { display: block; font-size: 12px; opacity: 0.85; font-weight: 600; text-transform: uppercase; letter-spacing: 0.5px; font-family: var(--mono); }
      .sb-continue-title { display: block; font-family: var(--mono); font-size: 17px; font-weight: 700; margin-top: 2px; }

      /* ---- islands ---- */
      .sb-islands { display: flex; flex-direction: column; gap: 10px; }
      .sb-island { background: var(--card); border-radius: 10px; overflow: hidden; box-shadow: 0 2px 8px rgba(14,42,69,0.07); border: 1px solid rgba(14,42,69,0.10); }
      .sb-island-head { width: 100%; display: flex; align-items: center; gap: 12px; padding: 14px; background: none; border: none; text-align: left; }
      .sb-island-emoji { font-size: 26px; }
      .sb-island-info { flex: 1; }
      .sb-island-name { display: block; font-family: var(--mono); font-weight: 700; font-size: 15px; color: var(--teal); }
      .sb-island-desc { display: block; font-size: 12px; color: var(--ink-soft); }
      .sb-island-progress { font-weight: 700; color: var(--amber-dark); font-size: 13px; }
      .sb-island-new {
        display: inline-block; margin-left: 6px; background: var(--coral); color: white;
        font-size: 9px; font-weight: 800; padding: 2px 6px; border-radius: 8px; vertical-align: middle;
      }
      .sb-island-list { border-top: 1px solid var(--bg); padding: 6px; }
      .sb-island-row { width: 100%; display: flex; align-items: center; gap: 10px; padding: 10px; border: none; background: none; border-radius: 10px; text-align: left; }
      .sb-island-row:hover { background: var(--bg); }
      .sb-island-row.is-done { opacity: 0.75; }
      .sb-island-row-stone { color: var(--success); font-weight: 700; width: 16px; }
      .sb-island-row-emoji { font-size: 18px; }
      .sb-island-row-title { flex: 1; font-size: 14px; font-weight: 500; }
      .sb-island-row-stars { font-size: 11px; }

      /* ---- problem header ---- */
      .sb-problem-header { display: flex; align-items: center; justify-content: space-between; }
      .sb-back-btn, .sb-breathe-btn {
        width: 40px; height: 40px; border-radius: 12px; border: none; background: var(--card);
        font-size: 18px; box-shadow: 0 2px 6px rgba(14,42,69,0.1);
      }
      .sb-problem-title { font-family: var(--mono); font-weight: 700; font-size: 15px; color: var(--teal); text-align: center; flex: 1; }
      .sb-problem-emoji { margin-right: 4px; }

      /* ---- stepping stones ---- */
      .sb-stones { display: flex; align-items: flex-start; justify-content: space-between; padding: 4px 4px 0; }
      .sb-stone-item { position: relative; display: flex; flex-direction: column; align-items: center; flex: 1; }
      .sb-stone {
        width: 38px; height: 38px; border-radius: 50%; background: var(--stone-empty);
        display: flex; align-items: center; justify-content: center; font-size: 16px;
        color: var(--ink-soft); font-weight: 700; transition: background 0.3s, transform 0.3s;
      }
      .sb-stone.is-active { background: var(--amber); color: white; transform: scale(1.12); }
      .sb-stone.is-done { background: var(--success); color: white; }
      .sb-stone-label { font-size: 9px; font-weight: 700; letter-spacing: 0.5px; color: var(--ink-soft); margin-top: 4px; }
      .sb-stone-connector { position: absolute; top: 19px; left: 55%; width: 90%; height: 3px; background: var(--stone-empty); z-index: -1; }
      .sb-stone-connector.is-done { background: var(--success); }

      /* ---- card / stage ---- */
      .sb-card { background: var(--card); border-radius: 20px; padding: 18px 16px; box-shadow: 0 3px 14px rgba(14,42,69,0.1); }
      .sb-situation { font-size: 15px; font-weight: 600; line-height: 1.5; color: var(--ink); margin: 0 0 14px; }
      .sb-stage-prompt { font-size: 13px; color: var(--ink-soft); font-weight: 600; margin: 0 0 10px; }
      .sb-mt { margin-top: 18px; }
      .sb-mt-sm { margin-top: 12px; }
      .sb-eq-label { font-size: 12px; color: var(--teal); font-weight: 700; margin: 0 0 6px; }
      .sb-eq-hint { font-size: 12px; color: var(--amber-dark); font-weight: 600; background: var(--nudge-bg); padding: 8px 10px; border-radius: 10px; margin: 0 0 10px; }
      .sb-opviz { background: var(--bg); border-radius: 12px; padding: 10px; margin: 0 0 10px; }
      .sb-opviz-groups { display: flex; flex-wrap: wrap; gap: 10px; justify-content: center; }
      .sb-opviz-group { display: flex; flex-direction: column; align-items: center; gap: 4px; padding: 6px; border: 2px dashed var(--stone-empty); border-radius: 10px; background: white; }
      .sb-opviz-rows { display: flex; flex-direction: column; gap: 6px; align-items: center; }
      .sb-opviz-blocks { display: flex; flex-wrap: wrap; gap: 3px; justify-content: center; max-width: 220px; }
      .sb-opviz-block { width: 16px; height: 16px; border-radius: 4px; background: var(--ratio-a); }
      .sb-opviz-block-x { background: var(--amber); }
      .sb-opviz-group-label { font-size: 12px; font-weight: 800; color: var(--teal); }
      .sb-opviz-caption { text-align: center; font-size: 12px; font-weight: 700; color: var(--ink-soft); margin-top: 8px; }

      .sb-options { display: flex; flex-direction: column; gap: 8px; }
      .sb-option {
        text-align: left; padding: 12px 14px; border-radius: 12px; border: 2px solid var(--bg);
        background: var(--bg); font-size: 14px; font-weight: 500; color: var(--ink); line-height: 1.4;
      }
      .sb-option.is-selected { border-color: var(--teal); background: #ECE4CD; }
      .sb-option-visual { display: flex; align-items: center; gap: 10px; }
      .sb-option-emoji { font-size: 22px; flex-shrink: 0; }
      .sb-hint-link {
        align-self: flex-start; background: none; border: none; color: var(--nudge-ink);
        font-weight: 700; font-size: 12px; padding: 6px 2px; text-decoration: underline;
      }
      .sb-predict-badge {
        display: inline-block; background: var(--nudge-bg); color: var(--amber-dark); font-weight: 700;
        font-size: 12px; padding: 6px 12px; border-radius: 20px; margin: 4px 0 2px;
      }

      .sb-feedback { margin-top: 10px; padding: 10px 12px; border-radius: 12px; font-size: 13px; font-weight: 600; }
      .sb-feedback.is-good { background: var(--success-bg); color: var(--success); }
      .sb-feedback.is-nudge { background: var(--nudge-bg); color: var(--nudge-ink); }

      .sb-stage-actions { display: flex; gap: 10px; margin-top: 16px; flex-wrap: wrap; }
      .sb-btn { border: none; border-radius: 14px; padding: 12px 18px; font-weight: 700; font-size: 14px; font-family: var(--mono); }
      .sb-btn-primary { background: var(--teal); color: white; flex: 1; }
      .sb-btn-primary:disabled { opacity: 0.4; }
      .sb-btn-ghost { background: var(--nudge-bg); color: var(--nudge-ink); }

      .sb-working-note { margin-top: 10px; font-size: 12px; color: var(--ink-soft); font-style: italic; }

      /* ---- equation builder ---- */
      .sb-eq-row { display: flex; align-items: center; gap: 6px; background: var(--bg); border-radius: 14px; padding: 12px 10px; flex-wrap: wrap; margin-bottom: 4px; }
      .sb-eq-box {
        width: 58px; text-align: center; padding: 10px 4px; border-radius: 10px; border: 2px solid white;
        background: white; font-size: 16px; font-weight: 700; color: var(--ink);
      }
      .sb-eq-answer { border-color: var(--amber); background: #FBF3DC; }
      .sb-eq-op {
        width: 44px; height: 44px; border-radius: 10px; border: none; background: var(--teal); color: white;
        font-size: 18px; font-weight: 800; flex-shrink: 0;
      }
      .sb-eq-equals { font-size: 20px; font-weight: 800; color: var(--ink-soft); }
      .sb-direct-row { background: var(--bg); border-radius: 14px; padding: 12px 10px; }
      .sb-direct-input { width: 160px; }

      /* ---- number line ---- */
      .sb-nl-wrap { background: var(--bg); border-radius: 14px; padding: 10px; }
      .sb-nl-wrap.is-readonly { background: #E6DFC9; }
      .sb-nl-jump-prompt { font-size: 12px; font-weight: 700; color: var(--amber-dark); margin: 0 0 6px; }
      .sb-numberline { width: 100%; height: auto; cursor: pointer; touch-action: manipulation; }
      .sb-nl-wrap.is-readonly .sb-numberline { cursor: default; }
      .sb-nl-axis { stroke: var(--ink-soft); stroke-width: 2; }
      .sb-nl-tick { stroke: var(--ink-soft); stroke-width: 1.5; }
      .sb-nl-label { fill: var(--ink-soft); font-size: 11px; text-anchor: middle; font-family: 'Inter', sans-serif; }
      .sb-nl-given { fill: var(--ratio-a); }
      .sb-nl-given-label { fill: var(--ratio-a); font-size: 12px; text-anchor: middle; font-weight: 700; }
      .sb-nl-marker { fill: var(--amber); stroke: var(--amber-dark); stroke-width: 2; }
      .sb-nl-marker-label { fill: var(--amber-dark); font-size: 13px; text-anchor: middle; font-weight: 700; }
      .sb-nl-mid-marker { fill: var(--ratio-a); stroke: #2f6fd6; stroke-width: 2; }
      .sb-nl-mid-marker-label { fill: #2f6fd6; font-size: 12px; text-anchor: middle; font-weight: 700; }
      .sb-nl-arc { fill: none; stroke: var(--amber-dark); stroke-width: 2.5; stroke-dasharray: 6 5; stroke-linecap: round; }
      .sb-nl-jump-label { fill: var(--amber-dark); font-size: 13px; text-anchor: middle; font-weight: 800; }
      .sb-nl-start { fill: var(--teal); }
      .sb-nl-start-label { fill: var(--teal); font-size: 10px; text-anchor: middle; font-weight: 700; }
      .sb-count-row { display: flex; align-items: center; gap: 8px; padding: 6px 4px 2px; font-size: 13px; font-weight: 600; color: var(--teal); flex-wrap: wrap; }
      .sb-count-num { font-size: 18px; font-family: var(--mono); color: var(--amber-dark); }
      .sb-mini-btn { border: none; background: var(--card); border-radius: 8px; padding: 6px 10px; font-weight: 700; font-size: 13px; color: var(--teal); margin-left: auto; }

      /* ---- fraction bar ---- */
      .sb-bar { display: flex; gap: 4px; background: var(--bg); padding: 10px; border-radius: 14px; }
      .sb-bar.is-readonly { background: #E6DFC9; }
      .sb-bar-seg { flex: 1; height: 56px; border-radius: 8px; border: 2px solid var(--stone-empty); background: white; padding: 0; }
      .sb-bar-seg.is-shaded { background: var(--amber); border-color: var(--amber-dark); }

      /* ---- decimal grid ---- */
      .sb-grid { display: grid; grid-template-columns: repeat(10, 1fr); gap: 2px; background: var(--bg); padding: 10px; border-radius: 14px; }
      .sb-grid.is-readonly { background: #E6DFC9; }
      .sb-grid-cell { aspect-ratio: 1; border-radius: 2px; border: 1px solid var(--stone-empty); background: white; padding: 0; min-width: 0; }
      .sb-grid-cell.is-shaded { background: var(--amber); border-color: var(--amber-dark); }

      /* ---- percent pie ---- */
      .sb-pie-wrap { text-align: center; }
